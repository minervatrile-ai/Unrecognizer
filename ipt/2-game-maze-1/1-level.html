<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hellhound Engine Template [Blank 6-Room Build]</title>

<style>
/* ==========================
   PAGE / GAME AREA
========================== */

body {
  background: black;
  color: lime;
  font-family: monospace;
  text-align: center;
}

h1 {
  margin-top: 20px;
}

#message {
  position: sticky;
  top: 0;
  z-index: 100;

  background: black;
  border: 2px solid lime;

  margin: 10px auto;
  padding: 10px;

  font-size: 20px;
}

.popup {
  grid-column: 1 / -1;
  border: 2px solid lime;
  background: black;
  padding: 20px;
}

.popup img {
  width: 192px;
  height: 192px;
  image-rendering: pixelated;
}

.popup button {
  margin: 10px;
  padding: 10px 20px;
  font-family: monospace;
}

#maze {
  display: grid;
  grid-template-columns: repeat(11, 64px);
  grid-auto-rows: 64px;
  gap: 0;

  width: max-content;
  margin: 20px auto;
}

.tile {
  width: 64px;
  height: 64px;
  background-size:cover;
  background-position:center;
  image-rendering: pixelated;
}

#overlay {
  position: fixed;
  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  display: none;

  justify-content: center;
  align-items: center;

  background: rgba(0,0,0,0.7);

  z-index: 999;
}

#inventoryPanel {
  position: fixed;
  right: 20px;
  top: 150px;

  background: black;
  color: lime;

  border: 2px solid lime;
  padding: 12px;

  z-index: 1000;
}

#inventoryButton {
  position: fixed;
  right: 20px;
  top: 100px;

  z-index: 1001;
}

#inventoryItems div {
  margin: 6px 0;
}

#moraleBox {
  width: 300px;
  margin: 10px auto;
  font-size: 18px;
}

#moraleBar {
  width: 100%;
  height: 24px;
  border: 2px solid lime;
  background: black;
}

#moraleFill {
  width: 100%;
  height: 100%;
  background: lime;
}
/* ==========================
   MOBILE CONTROLS
========================== */

.mobile-controls {
  display: none;
}

.mobile-controls button {
  width: 120px;
  height: 120px;
  font-size: 48px;
}

@media (max-width: 768px) {
  .mobile-controls {
    display: grid;
    grid-template-columns: 120px 120px 120px;
    gap: 16px;
    justify-content: center;
    margin-top: 16px;
  }
}

</style>
</head>

/* ==========================
   SMALL HELPERS
========================== */
function startRatScurry() {
  if (ratSeen) return;

  ratSeen = true;
  ratScurrying = true;
  ratStep = 0;

  function moveRat() {
    if (ratStep >= ratPath.length) {
      ratScurrying = false;
      ratX = -1;
      ratY = -1;
      drawMaze();
      return;
    }

    ratX = ratPath[ratStep].x;
    ratY = ratPath[ratStep].y;
    ratStep++;

    drawMaze();

    setTimeout(moveRat, 170);
  }

  moveRat();
}

function getOwnedWeapons() {
  let ownedWeapons = [];

  if (hasRevolver) {
    ownedWeapons.push("revolver");
  }

  if (hasSquirtGun) {
    ownedWeapons.push("squirtgun");
  }

  return ownedWeapons;
}

function switchWeapon() {
  let ownedWeapons = getOwnedWeapons();

  if (ownedWeapons.length === 0) {
    message.textContent = "No weapons equipped.";
    currentWeapon = "";
    return;
  }

  let currentIndex = ownedWeapons.indexOf(currentWeapon);

  currentIndex++;

  if (currentIndex >= ownedWeapons.length) {
    currentIndex = 0;
  }

  currentWeapon = ownedWeapons[currentIndex];

  if (currentWeapon === "revolver") {
    message.textContent = "Equipped: Revolver.";
  }

  if (currentWeapon === "squirtgun") {
    message.textContent = "Equipped: Squirt Gun.";
  }

drawInventory();
  drawMaze();
}

function refreshInventoryIfOpen() {
  if (inventoryOpen) {
    drawInventory();
  }
}

function isDarkRoom() {
  return false; // set to: return maze === room4; when you want a dark room
}

function isLitByFlashlight(x, y) {

    if (facingDirection === "right") {
    return (
      (x === playerX + 1 && y === playerY) ||
      (x === playerX + 2 &&
       y >= playerY - 1 &&
       y <= playerY + 1)
    );
  }

  if (facingDirection === "left") {
    return (
      (x === playerX - 1 && y === playerY) ||
      (x === playerX - 2 &&
       y >= playerY - 1 &&
       y <= playerY + 1)
    );
  }

  if (facingDirection === "down") {
    return (
      (y === playerY + 1 && x === playerX) ||
      (y === playerY + 2 &&
       x >= playerX - 1 &&
       x <= playerX + 1)
    );
  }

  if (facingDirection === "up") {
    return (
      (y === playerY - 1 && x === playerX) ||
      (y === playerY - 2 &&
       x >= playerX - 1 &&
       x <= playerX + 1)
    );
  }

  return false;
}

function isVisible(x, y) {
  if (!isDarkRoom()) return true;

  const tile = getMapTile(x, y);

  if (
    tile === TILE.ROUTER ||
    tile === TILE.VENDING_MACHINE
  ) {
    return true;
  }

  if (!hasFlashlight) return false;

  return isLitByFlashlight(x, y);
}

function toggleInventory() {

  inventoryOpen = !inventoryOpen;

  const panel = document.getElementById("inventoryPanel");

  if (inventoryOpen) {
    panel.style.display = "block";
    drawInventory();
  } else {
    panel.style.display = "none";
  }
}

function drawInventory() {
  let items = "";


  if (hasRevolver)
    items += '<div>💥 Revolver <button onclick="dropItem(\'revolver\')">Drop</button></div>';

  if (hasSquirtGun)
    items += '<div>🔫 Squirt Gun <button onclick="dropItem(\'squirtgun\')">Drop</button></div>';

  if (hasPagerBattery)
    items += "<div>🔋 Pager Battery</div>";

  if (hasDollar)
    items += "<div>💵 A Few Dollars</div>";

  if (hasExtinguisher)
    items += '<div>🧯 Extinguisher <button onclick="dropItem(\'extinguisher\')">Drop</button></div>';

  if (hasPager)
    items += '<div>📟 Pager <button onclick="dropItem(\'pager\')">Drop</button></div>';

  if (hasLadder)
    items += '<div>🪜 Ladder <button onclick="dropItem(\'ladder\')">Drop</button></div>';

  if (hasLevel2Disk)
    items += '<div>💾 Weird Wizard Apartment Disk <button onclick="dropItem(\'level2disk\')">Drop</button></div>';

  if (hasMedicineDog)
    items += '<div>💾 Medicine Dog Disk <button onclick="dropItem(\'medicinedog\')">Drop</button></div>';

  if (hasKeyA)
    items += '<div>🗝️ Key A <button onclick="dropItem(\'keyA\')">Drop</button></div>';

  if (hasKeyB)
    items += '<div>🗝️ Key B <button onclick="dropItem(\'keyB\')">Drop</button></div>';

  if (hasKeyC)
    items += '<div>🗝️ Key C <button onclick="dropItem(\'keyC\')">Drop</button></div>';

  if (hasKeyD)
    items += '<div>🗝️ Key D <button onclick="dropItem(\'keyD\')">Drop</button></div>';

  if (hasFlashlight)
    items += '<div>🔦 Flashlight <button onclick="dropItem(\'flashlight\')">Drop</button></div>';

  if (hasTapeR)
    items += '<div>📼 Cassette Tape <button onclick="dropItem(\'tapeR\')">Drop</button></div>';

  if (items === "") items = "No equipment yet.";

if (hasRevolver || hasSquirtGun) {
  items += `
    <hr>
    <div>Current Weapon: ${currentWeapon || "None"}</div>
    <button onclick="switchWeapon()">Switch Weapon</button>
  `;
}

document.getElementById("inventoryItems").innerHTML = items;
}

function fireRevolver() {

  if (!hasRevolver) {
  setMessage ("Hellhound has no weapons to fire.");
  return; 
}

  if (bulletActive) return;

  bulletX = playerX;
  bulletY = playerY;

  if (facingDirection === "right") {
    bulletDX = 1;
    bulletDY = 0;
  }

  if (facingDirection === "left") {
    bulletDX = -1;
    bulletDY = 0;
  }

  if (facingDirection === "down") {
    bulletDX = 0;
    bulletDY = 1;
  }

  if (facingDirection === "up") {
    bulletDX = 0;
    bulletDY = -1;
  }

  bulletActive = true;
}

function moveBullet() {
  if (!bulletActive) return;

  const nextX = bulletX + bulletDX;
  const nextY = bulletY + bulletDY;

  if (
    nextY < 0 ||
    nextY >= maze.length ||
    nextX < 0 ||
    nextX >= maze[nextY].length
  ) {
    bulletActive = false;
    drawMaze();
    return;
  }

  const nextTile = getMapTile(nextX, nextY);

  if (nextTile === TILE.WALL || nextTile === TILE.BLUE_WALL) {
    bulletActive = false;
    drawMaze();
    return;
  }

  bulletX = nextX;
  bulletY = nextY;

  if (skullActive && bulletX === skullX && bulletY === skullY) {
  bulletActive = false;
  skullFrozen = true;
  skullShot = true;
  setMessage("Hellhound blasts the Skull Influencer! It freezes. Must be a quantum-particle hologram...");
  drawMaze();
  return;
}

  drawMaze();
}

setInterval(moveBullet, 120);

function fireCurrentWeapon() {
  if (currentWeapon === "revolver") {
    fireRevolver();
    return;
  }

  if (currentWeapon === "squirtgun") {
    fireSquirtGun();
    return;
  }

  setMessage("No weapon equipped.");
}


function setMessage(text) {
  document.getElementById("message").innerText = text;
}

function placeTile(x, y, tile) {
  maze[y] =
    maze[y].substring(0, x) +
    tile +
    maze[y].substring(x + 1);
}

function getDropPosition() {
  let dropX = playerX;
  let dropY = playerY;

  if (facingDirection === "right") dropX++;
  if (facingDirection === "left") dropX--;
  if (facingDirection === "down") dropY++;
  if (facingDirection === "up") dropY--;

  return { x: dropX, y: dropY };
}

function dropItem(itemName) {
  const pos = getDropPosition();

  if (
    pos.y < 0 ||
    pos.y >= maze.length ||
    pos.x < 0 ||
    pos.x >= maze[pos.y].length
  ) {
    setMessage("You can't drop that outside the map.");
    return;
  }

  if (getMapTile(pos.x, pos.y) !== TILE.FLOOR) {
    setMessage("There is no room to drop that there.");
    return;
  }

  if (itemName === "revolver" && hasRevolver) {
    placeTile(pos.x, pos.y, TILE.REVOLVER);
    hasRevolver = false;
    if (currentWeapon === "revolver") currentWeapon = "";
    setMessage("You drop the Revolver.");
  }

  else if (itemName === "squirtgun" && hasSquirtGun) {
    placeTile(pos.x, pos.y, TILE.SQUIRT_GUN);
    hasSquirtGun = false;
    if (currentWeapon === "squirtgun") currentWeapon = "";
    setMessage("You drop the Squirt Gun.");
  }

  else if (itemName === "flashlight" && hasFlashlight) {
    placeTile(pos.x, pos.y, TILE.FLASHLIGHT);
    hasFlashlight = false;
    setMessage("You drop the Flashlight.");
  }

  else if (itemName === "pager" && hasPager) {
    placeTile(pos.x, pos.y, TILE.PAGER);
    hasPager = false;
    setMessage("You drop the Pager.");
  }

  else if (itemName === "ladder" && hasLadder) {
    placeTile(pos.x, pos.y, TILE.LADDER);
    hasLadder = false;
    setMessage("You drop the Ladder.");
  }

  else if (itemName === "keyA" && hasKeyA) {

/*
  This decides what each map cell should LOOK like
  after the game state has changed.
*/


function getVisibleTile(cell) {

  if (cell === TILE.PLAYER_START) return TILE.FLOOR;
  if (cell === TILE.LADDER && hasLadder) return TILE.FLOOR;
  if (cell === TILE.KEY_A && hasKeyA) return TILE.FLOOR;
  if (cell === TILE.KEY_B && hasKeyB) return TILE.FLOOR;
  if (cell === TILE.KEY_C && hasKeyC) return TILE.FLOOR;
  if (cell === TILE.KEY_D && hasKeyD) return TILE.FLOOR;

  if (cell === TILE.SQUIRT_GUN && hasSquirtGun) return TILE.FLOOR;
  if (cell === TILE.REVOLVER && hasRevolver) return TILE.FLOOR;
  if (cell === TILE.DOOR_D && doorDOpen) return TILE.FLOOR;
  if (cell === TILE.DOOR_A && doorAOpen) return TILE.FLOOR;
  if (cell === TILE.DOOR_B && doorBOpen) return TILE.FLOOR;
  if (cell === TILE.DOOR_C && doorCOpen) return TILE.FLOOR;
  if (cell === TILE.FIRE_A && fireAOut) return TILE.FLOOR;
  if (cell === TILE.FIRE_B && fireBOut) return TILE.FLOOR;
  if (cell === TILE.EXTINGUISHER && hasExtinguisher) return TILE.FLOOR;
  if (cell === TILE.LEVEL_2_DISK && hasLevel2Disk) return TILE.FLOOR;
  if (cell === TILE.MEDICINE_DOG && hasMedicineDog) return TILE.FLOOR;
  if (cell === TILE.CASSETTE_TAPE && hasTapeR) return TILE.FLOOR;
  if (cell === TILE.PHONY_WALL && wallVanish) return TILE.FLOOR;
  if (cell === TILE.LADDER && hasLadder) return TILE.FLOOR;
if (cell === TILE.RADIO) {
  if (radioState === 1) return TILE.RADIO_OFF;
  if (radioState === 2) return TILE.RADIO_GOOD;
  if (radioState === 3) return TILE.RADIO_BAD;
}

  return cell;

}

function drawMaze() {
  const mazeDiv = document.getElementById("maze");
  mazeDiv.innerHTML = "";

  for (let y = 0; y < maze.length; y++) {
    for (let x = 0; x < maze[y].length; x++) {
      let cell = getVisibleTile(getMapTile(x, y));

if (x === playerX && y === playerY) {

  if (currentWeapon === "revolver") {
    cell = TILE.PLAYER_REVOLVER;
  }

  else if (currentWeapon === "squirtgun") {
    cell = TILE.PLAYER_WATERGUN;
  }

  else {
    cell = TILE.PLAYER_START;
  }
}

if (skullActive && x === skullX && y === skullY) {
  if (skullShot) {
    cell = TILE.SKULL_INFLUENCER_BULLET;
  } else {
    cell = TILE.SKULL_INFLUENCER;
  }
}

if (ratScurrying && x === ratX && y === ratY) {
  cell = TILE.RAT_1_RIGHT;
}

if (streamActive && x === streamX && y === streamY) {
  cell = TILE.WATER_STREAM;
}

if (bulletActive && x === bulletX && y === bulletY) {
  cell = TILE.BULLET;
}

      const tile = document.createElement("div");
      tile.className = "tile";
      if (!isVisible(x, y)) {
  tile.style.backgroundColor = "black";
  tile.style.backgroundImage = "none";
} else {
  tile.style.backgroundColor = "";
  tile.style.backgroundImage = `url(${tileImages[cell]})`;
}

      mazeDiv.appendChild(tile);
    }
  }
}

function moveSkullInfluencer() {
  if (!skullActive) {
    return;
  }

  if (skullFrozen) {
    return;
  }

  const directions = [
    { x: 0, y: -1 },
    { x: 0, y: 1 },
    { x: -1, y: 0 },
    { x: 1, y: 0 }
  ];

  const choice = directions[Math.floor(Math.random() * directions.length)];

  const nextX = skullX + choice.x;
  const nextY = skullY + choice.y;

  if (maze[nextY][nextX] !== "#") {
    skullX = nextX;
    skullY = nextY;
  }

  if (skullShot) {
  cell = TILE.SKULL_INFLUENCER_BULLET;
} else if (skullFrozen) {
  cell = TILE.SKULL_INFLUENCER_FROZEN;
} else {
  cell = TILE.SKULL_INFLUENCER;
}

  if (playerX === skullX && playerY === skullY) {
  damageMorale();
  return;
}

  drawMaze();
}

function fireSquirtGun() {

  if (!hasSquirtGun) {
    setMessage("Hellhound has nothing to fire.");
    return;
}

  if (streamActive) return;

  streamX = playerX;
  streamY = playerY;

  if (facingDirection === "right") {
    streamDX = 1;
    streamDY = 0;
  }

  if (facingDirection === "left") {
    streamDX = -1;
    streamDY = 0;
  }

  if (facingDirection === "down") {
    streamDX = 0;
    streamDY = 1;
  }

  if (facingDirection === "up") {
    streamDX = 0;
    streamDY = -1;
  }

  streamActive = true;
}

  if (!streamActive) return;

  const nextX = streamX + streamDX;
  const nextY = streamY + streamDY;

    nextY < 0 ||
    nextY >= maze.length ||
    nextX < 0 ||
    nextX >= maze[nextY].length

    drawMaze();
    return;

    if (nextTile === TILE.ROUTER) {

  return;

  foundCouch = true;

  setMessage(
    "You stumbled upon a couch in the darkness..."
  );

  return;
}

if (
  (nextTile === TILE.COUCH_LEFT ||
   nextTile === TILE.COUCH_MIDDLE ||
   nextTile === TILE.COUCH_RIGHT) &&
   !searchedCouch
)
{
  hasDollar = true;
  hasPagerBattery = true;
  
  searchedCouch = true;
  setMessage(
  "You search between the cushions and find a few dollars and a pager battery."
);
  return;
}

if (
  nextTile === TILE.COUCH_LEFT ||
  nextTile === TILE.COUCH_MIDDLE ||
  nextTile === TILE.COUCH_RIGHT
)
{
  setMessage("Nothing else in the couch.");
}

/* ---- Move player after successful interaction ---- */

playerX = nextX;
playerY = nextY;

if (skullActive && playerX === skullX && playerY === skullY) {
  damageMorale();
}

drawMaze();
}

function drawPagerCloseup() {
  const overlay = document.getElementById("overlay");

  overlay.style.display = "flex";

  overlay.innerHTML = `
    <div class="popup">
      <img src="${getPagerCloseupImage()}">
      <br>
      <button onclick="checkPager()">Check Messages</button>
    </div>
  `;
}

function getPagerCloseupImage() {
    return "../0-game-gallery/pager-active.png";
  }

function checkPager() {
  viewingPager = false;

  const overlay = document.getElementById("overlay");

  overlay.style.display = "none";
  overlay.innerHTML = "";
}

function drawRadioCloseup() {
  const overlay = document.getElementById("overlay");

  overlay.style.display = "flex";

  overlay.innerHTML = `
    <div class="popup">
      <img src="${getRadioCloseupImage()}">
      <br>
      <button onclick="listenRadio()">Listen</button>
      <button onclick="closeRadio()">Back</button>
    </div>
  `;
}

function getRadioCloseupImage() {
  if (radioState === 1) {
    return "../0-game-gallery/big-2-radio-off.png";
  }

  if (radioState === 2) {
    return "../0-game-gallery/big-2-radio-good.png";
  }

  if (radioState === 3) {
    return "../0-game-gallery/big-2-radio-bad.png";
  }
}

function listenRadio() {
  if (radioState === 1) {
    setMessage("The radio has no power.");
  } else if (radioState === 2) {
    if (hasTapeR) {
    setMessage(
  "The cassette clicks in. 'Hellhound: you have been selected to troubleshoot this RETRO-TECH facility due to your maximum capabilities as a troubleshooter and three-headed dog-man. Once you escape, you will be compensated financially for all trauma incurred during testing. Further instructions may be available through facility communications devices.'");

    } else {
      setMessage("You don't have any tapes to play right now.");
    }
  } else if (radioState === 3) {
    setMessage("The radio crackles with distorted static.");
  }
}

function closeRadio() {
  viewingRadio = false;

  const overlay = document.getElementById("overlay");

  overlay.style.display = "none";
  overlay.innerHTML = "";
}



/* ==========================
   KEYBOARD CONTROLS
========================== */

document.addEventListener("keydown", function(event) {
  if (event.key === "ArrowUp") movePlayer(0, -1);
  if (event.key === "ArrowDown") movePlayer(0, 1);
  if (event.key === "ArrowLeft") movePlayer(-1, 0);
  if (event.key === "ArrowRight") movePlayer(1, 0);

  if (event.code === "Space") {
  fireCurrentWeapon();
}
});

/* ==========================
   START GAME
========================== */

/* ==========================
   START GAME
========================== */

drawMaze();
setInterval(moveSkullInfluencer, 700);

</script>
