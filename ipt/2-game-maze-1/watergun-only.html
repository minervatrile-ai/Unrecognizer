/* ==========================
   PAGE / GAME AREA
========================== */

body {
  background: black;
  color: lime;
  font-family: monospace;
  text-align: center;
}

h1 {
  margin-top: 20px;
}

#message {
  position: sticky;
  top: 0;
  z-index: 100;

  background: black;
  border: 2px solid lime;

  margin: 10px auto;
  padding: 10px;

  font-size: 20px;
}

.popup {
  grid-column: 1 / -1;
  border: 2px solid lime;
  background: black;
  padding: 20px;
}

.popup img {
  width: 192px;
  height: 192px;
  image-rendering: pixelated;
}

.popup button {
  margin: 10px;
  padding: 10px 20px;
  font-family: monospace;
}

#maze {
  display: grid;
  grid-template-columns: repeat(11, 64px);
  grid-auto-rows: 64px;
  gap: 0;

  width: max-content;
  margin: 20px auto;
}

.tile {
  width: 64px;
  height: 64px;
  background-size:cover;
  background-position:center;
  image-rendering: pixelated;
}

#overlay {
  position: fixed;
  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  display: none;

  justify-content: center;
  align-items: center;

  background: rgba(0,0,0,0.7);

  z-index: 999;
}

#inventoryPanel {
  position: fixed;
  right: 20px;
  top: 150px;

  background: black;
  color: lime;

  border: 2px solid lime;
  padding: 12px;

  z-index: 1000;
}

#inventoryButton {
  position: fixed;
  right: 20px;
  top: 100px;

  z-index: 1001;
}

#inventoryItems div {
  margin: 6px 0;
}

#moraleBox {
  width: 300px;
  margin: 10px auto;
  font-size: 18px;
}

#moraleBar {
  width: 100%;
  height: 24px;
  border: 2px solid lime;
  background: black;
}

#moraleFill {
  width: 100%;
  height: 100%;
  background: lime;
}
/* ==========================
   MOBILE CONTROLS
========================== */

.mobile-controls {
  display: none;
}

.mobile-controls button {
  width: 120px;
  height: 120px;
  font-size: 48px;
}

@media (max-width: 768px) {
  .mobile-controls {
    display: grid;
    grid-template-columns: 120px 120px 120px;
    gap: 16px;
    justify-content: center;
    margin-top: 16px;
  }
}

/* ==========================
   SMALL HELPERS
========================== */
function startRatScurry() {
  if (ratSeen) return;

  ratSeen = true;
  ratScurrying = true;
  ratStep = 0;

  function moveRat() {
    if (ratStep >= ratPath.length) {
      ratScurrying = false;
      ratX = -1;
      ratY = -1;
      drawMaze();
      return;
    }

    ratX = ratPath[ratStep].x;
    ratY = ratPath[ratStep].y;
    ratStep++;

    drawMaze();

    setTimeout(moveRat, 170);
  }

  moveRat();
}



function isDarkRoom() {
  return maze === room4; // change to your dark room
}

function isLitByFlashlight(x, y) {
  if (facingDirection === "right") return y === playerY && x > playerX && x <= playerX + 2;
  if (facingDirection === "left") return y === playerY && x < playerX && x >= playerX - 2;
  if (facingDirection === "down") return x === playerX && y > playerY && y <= playerY + 2;
  if (facingDirection === "up") return x === playerX && y < playerY && y >= playerY - 2;

  return false;
}

function isVisible(x, y) {
  if (!isDarkRoom()) return true;

  const tile = getMapTile(x, y);

  if (
    tile === TILE.ROUTER ||
    tile === TILE.VENDING_MACHINE
  ) {
    return true;
  }

  if (!hasFlashlight) return false;

  return isLitByFlashlight(x, y);
}

function toggleInventory() {

  inventoryOpen = !inventoryOpen;

  const panel = document.getElementById("inventoryPanel");

  if (inventoryOpen) {
    panel.style.display = "block";
    drawInventory();
  } else {
    panel.style.display = "none";
  }
}

function drawInventory() {
  let items = "";

  if (hasRevolver) items += "<div> Revolver</div>";
  if (hasSquirtGun) items += "<div>🔫 Squirt Gun</div>";
  if (hasPagerBattery)
  items += "<div>🔋 Pager Battery</div>";
  if (hasDollar) items += "<div>💵 A Few Dollars</div>";
  if (hasExtinguisher) items += "<div>🧯 Extinguisher</div>";
  if (hasExtinguisher2)
  items += "<div>🧯 Backup Extinguisher</div>";
  if (hasPager) items += "<div>📟 Pager</div>";
  if (hasLadder) items += "<div>🪜 Ladder</div>";
  if (hasLevel2Disk) items += "<div>💾 Weird Wizard Apartment Disk</div>";
  if (hasMedicineDog) items += "<div>💾 Medicine Dog Disk</div>";
  if (hasKeyA) items += "<div>🗝️ Key A</div>";
  if (hasKeyB) items += "<div>🗝️ Key B</div>";
  if (hasKeyC) items += "<div>🗝️ Key C</div>";
  if (hasKeyD) items += "<div>🗝️ Key D</div>";
  
  if (hasTapeR) items += "<div>📼 Cassette Tape</div>";

  if (items === "") items = "No equipment yet.";

  document.getElementById("inventoryItems").innerHTML = items;
}

function setMessage(text) {
  document.getElementById("message").innerText = text;

function getMapTile(x, y) {
  return maze[y][x];
}

/*
  This decides what each map cell should LOOK like
  after the game state has changed.
*/
function getVisibleTile(cell) {
  if (cell === TILE.PLAYER_START) return TILE.FLOOR;
  if (cell === TILE.LADDER && hasLadder) return TILE.FLOOR;
  if (cell === TILE.KEY_A && hasKeyA) return TILE.FLOOR;
  if (cell === TILE.KEY_B && hasKeyB) return TILE.FLOOR;
  if (cell === TILE.KEY_C && hasKeyC) return TILE.FLOOR;
  if (cell === TILE.KEY_D && hasKeyD) return TILE.FLOOR;

  if (cell === TILE.SQUIRT_GUN && hasSquirtGun) return TILE.FLOOR;
  if (cell === TILE.REVOLVER && hasRevolver) return TILE.FLOOR;
  if (cell === TILE.DOOR_D && doorDOpen) return TILE.FLOOR;
  if (cell === TILE.DOOR_A && doorAOpen) return TILE.FLOOR;
  if (cell === TILE.DOOR_B && doorBOpen) return TILE.FLOOR;
  if (cell === TILE.DOOR_C && doorCOpen) return TILE.FLOOR;
  if (cell === TILE.FIRE_A && fireAOut) return TILE.FLOOR;
  if (cell === TILE.FIRE_B && fireBOut) return TILE.FLOOR;

  if (cell === TILE.PAGER && pagerPickedUp) return TILE.FLOOR;

  if (cell === TILE.EXTINGUISHER2 && hasExtinguisher2) return TILE.FLOOR;
  if (cell === TILE.EXTINGUISHER && hasExtinguisher) return TILE.FLOOR;
  if (cell === TILE.LEVEL_2_DISK && hasLevel2Disk) return TILE.FLOOR;
  if (cell === TILE.MEDICINE_DOG && hasMedicineDog) return TILE.FLOOR;
  if (cell === TILE.CASSETTE_TAPE && hasTapeR) return TILE.FLOOR;
  if (cell === TILE.PHONY_WALL && wallVanish) return TILE.FLOOR;
  if (cell === TILE.LADDER && hasLadder) return TILE.FLOOR;
if (cell === TILE.RADIO) {
  if (radioState === 1) return TILE.RADIO_OFF;
  if (radioState === 2) return TILE.RADIO_GOOD;
  if (radioState === 3) return TILE.RADIO_BAD;
}

  return cell;

}

/* ==========================
   DRAW MAZE
========================== */

function drawMaze() {
  const mazeDiv = document.getElementById("maze");
  mazeDiv.innerHTML = "";

  for (let y = 0; y < maze.length; y++) {
    for (let x = 0; x < maze[y].length; x++) {
      let cell = getVisibleTile(getMapTile(x, y));

     if (x === playerX && y === playerY) {
  if (hasSquirtGun) {
    cell = TILE.PLAYER_WATERGUN;
  } else {
    cell = TILE.PLAYER_START;
  }
}

      if (x === skullX && y === skullY) {
        cell = TILE.SKULL_INFLUENCER;
      }

if (ratScurrying && x === ratX && y === ratY) {
  cell = TILE.RAT_1_RIGHT;
}

if (streamActive && x === streamX && y === streamY) {
  cell = TILE.WATER_STREAM;
}

      const tile = document.createElement("div");
      tile.className = "tile";
      if (!isVisible(x, y)) {
  tile.style.backgroundColor = "black";
  tile.style.backgroundImage = "none";
} else {
  tile.style.backgroundColor = "";
  tile.style.backgroundImage = `url(${tileImages[cell]})`;
}

      mazeDiv.appendChild(tile);
    }
  }
}

function moveSkullInfluencer() {
  if (skullFrozen) {
    return;
  }

  const directions = [
    { x: 0, y: -1 },
    { x: 0, y: 1 },
    { x: -1, y: 0 },
    { x: 1, y: 0 }
  ];

  const choice = directions[Math.floor(Math.random() * directions.length)];

  const nextX = skullX + choice.x;
  const nextY = skullY + choice.y;

  if (maze[nextY][nextX] !== "#") {
    skullX = nextX;
    skullY = nextY;
  }

  if (playerX === skullX && playerY === skullY) {
  damageMorale();
  return;
}

  drawMaze();
}

function damageMorale() {
  hellhoundMorale -= 25;

  if (hellhoundMorale < 0) {
    hellhoundMorale = 0;
  }

  document.getElementById("moraleFill").style.width =
    hellhoundMorale + "%";

  setMessage("The Skull Influencer corners you!");

  if (hellhoundMorale === 0) {
    setMessage(
      "Hellhound loses morale and is now more focused on just being thirsty."
    );

    // optional later:
    // restart level
    // game over screen
    // teleport to start
  }
}

function squirtStream() {

  if (!hasSquirtGun) {
    setMessage("Hellhound has nothing to fire.");
    return;
}

  if (streamActive) return;

  streamX = playerX;
  streamY = playerY;

  if (facingDirection === "right") {
    streamDX = 1;
    streamDY = 0;
  }

  if (facingDirection === "left") {
    streamDX = -1;
    streamDY = 0;
  }

  if (facingDirection === "down") {
    streamDX = 0;
    streamDY = 1;
  }

  if (facingDirection === "up") {
    streamDX = 0;
    streamDY = -1;
  }

  streamActive = true;
}

function moveStream() {
  if (!streamActive) return;

  const nextX = streamX + streamDX;
  const nextY = streamY + streamDY;

  if (
    nextY < 0 ||
    nextY >= maze.length ||
    nextX < 0 ||
    nextX >= maze[nextY].length
  ) {
    streamActive = false;
    drawMaze();
    return;
  }



  const nextTile = getMapTile(nextX, nextY);

    if (nextTile === TILE.ROUTER) {

  streamActive = false;

  skullFrozen = true;

  setMessage(
    "The RETRO-TECH LAN ROUTER sparks and crackles. The Skull Influencer freezes."
  );

  drawMaze();
  return;
}



  streamX = nextX;
  streamY = nextY;

  if (streamX === skullX && streamY === skullY) {
    streamActive = false;
    setMessage("Hellhound sprays the Skull Influencer!");
    skullX = 8;
    skullY = 9;
    drawMaze();
    return;
  }

  drawMaze();
}

setInterval(moveStream, 120);




/* ==========================
   INTERACTION LOGIC
========================== */

function movePlayer(dx, dy) {

if (dx === 1) facingDirection = "right";
if (dx === -1) facingDirection = "left";
if (dy === 1) facingDirection = "down";
if (dy === -1) facingDirection = "up";

  const nextX = playerX + dx;
  const nextY = playerY + dy;

  const nextTile = getMapTile(nextX, nextY);

  /* ---- Hard blockers ---- */

if (
  nextTile === TILE.WALL ||
  nextTile === TILE.BLUE_WALL
) {
  setMessage("A wall blocks your path.");
  return;
}

  if (nextTile === TILE.PHONY_WALL && !wallVanish) {
    setMessage("This must be the way out. But it's LOCKED.");

function drawPagerCloseup() {
  const overlay = document.getElementById("overlay");

  overlay.style.display = "flex";

  overlay.innerHTML = `
    <div class="popup">
      <img src="${getPagerCloseupImage()}">
      <br>
      <button onclick="checkPager()">Check Messages</button>
    </div>
  `;
}

function getPagerCloseupImage() {
    return "../0-game-gallery/pager-active.png";
  }

function checkPager() {
  viewingPager = false;

  const overlay = document.getElementById("overlay");

  overlay.style.display = "none";
  overlay.innerHTML = "";
}

function drawRadioCloseup() {
  const overlay = document.getElementById("overlay");

  overlay.style.display = "flex";

  overlay.innerHTML = `
    <div class="popup">
      <img src="${getRadioCloseupImage()}">
      <br>
      <button onclick="listenRadio()">Listen</button>
      <button onclick="closeRadio()">Back</button>
    </div>
  `;
}

function getRadioCloseupImage() {
  if (radioState === 1) {
    return "../0-game-gallery/big-2-radio-off.png";
  }

  if (radioState === 2) {
    return "../0-game-gallery/big-2-radio-good.png";
  }

  if (radioState === 3) {
    return "../0-game-gallery/big-2-radio-bad.png";
  }
}

function listenRadio() {
  if (radioState === 1) {
    setMessage("The radio has no power.");
  } else if (radioState === 2) {
    if (hasTapeR) {
    setMessage(
  "The cassette clicks in. 'Hellhound: you have been selected to troubleshoot this RETRO-TECH facility due to your maximum capabilities as a troubleshooter and three-headed dog-man. Once you escape, you will be compensated financially for all trauma incurred during testing. Further instructions may be available through facility communications devices.'");

    } else {
      setMessage("You don't have any tapes to play right now.");
    }
  } else if (radioState === 3) {
    setMessage("The radio crackles with distorted static.");
  }
}

function closeRadio() {
  viewingRadio = false;

  const overlay = document.getElementById("overlay");

  overlay.style.display = "none";
  overlay.innerHTML = "";
}

document.addEventListener("keydown", function(event) {
  if (event.key === "ArrowUp") movePlayer(0, -1);

  if (event.key === "ArrowRight") movePlayer(1, 0);

  if (event.code === "Space") {
    squirtStream();
  }
});
