<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    background: black;
    padding: 20px;
}

.card-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    justify-items: center;
}

.card {
    background: #222;
    border-radius: 12px;
    overflow: hidden;
    width: 250px;
}

.card img {
    width: 100%;
    display: block;

    animation: flicker 2.8s infinite;

    filter: brightness(1);
}

@keyframes flicker {

    0% {
        opacity: 1;
        filter: brightness(1);
    }

    3% {
        opacity: 0.82;
        filter: brightness(1.15);
    }

    6% {
        opacity: 1;
    }

    11% {
        opacity: 0.9;
    }

    14% {
        opacity: 1;
    }

    35% {
        opacity: 1;
    }

    37% {
        opacity: 0.78;
        filter: brightness(1.25);
    }

    40% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        filter: brightness(1);
    }
}

.card:nth-child(odd) img {
    animation-duration: 3.4s;
}

.card:nth-child(3n) img {
    animation-duration: 2.1s;
}

.card:nth-child(4n) img {
    animation-duration: 4.7s;
}

</style>
</head>

<body>

<div class="card-container">

    <div class="card">
        <img src="../../gallery/broadcast-cultural-relevance-window-closing.jpg">
    </div>
    <div class="card">

    </div>

    </div>

    </div>
    <div class="card">

    </div>
    <div class="card">

    </div>
