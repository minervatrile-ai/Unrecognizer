<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    background: black;
    padding: 20px;
}

.card-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    justify-items: center;
}

.card {
    background: #222;
    border-radius: 12px;
    overflow: hidden;
    width: 250px;
}

.card img {
    width: 100%;
    display: block;
}

</style>
</head>

<body>

<div class="card-container">
    <div class="card">
        <img src="../../gallery/interstate-sign.png" alt="interstate sign">
    </div>
    <div class="card">
        <img src="../../gallery/convoy.png" alt="convoy image">
    </div>
    <div class="card">
        <a href="../../index.html">
            <img src="../../gallery/interstate-sign-exit.png" alt="exit sign image">
        </a>
        <h1>Take exit to continue to IPT home...</h1>
    </div>

</body>
</html>
