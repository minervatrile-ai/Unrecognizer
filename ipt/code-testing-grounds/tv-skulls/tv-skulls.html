<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    background: black;
    padding: 20px;
}

.card-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    justify-items: center;
}

.card {
    background: #222;
    border-radius: 12px;
    overflow: hidden;
    width: 250px;
}

.card img {
    width: 100%;
    display: block;
}

</style>
</head>
<body>
    <div class="card-container">

        <a href="emergency-broadcasts.html" class="card">
            <img src="../../gallery/tv-skulls.png" alt="skulls tv">
        </a>
    </div>
</body>
</html>
