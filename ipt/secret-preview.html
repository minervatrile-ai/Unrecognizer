<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Badges of SNOW PLANET UNRECOGNIZER game development</title>
  <style>
    /* PAGE LAYOUT: centers the game and sets the dark arcade backdrop. */
    body {
      margin: 0;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* TITLE: orange arcade header above the game. */
    h1 {
      margin: 12px 0 4px;
      font-size: 22px;
      letter-spacing: 2px;
      color: #ff8c00;
    }

    /* HUD: small status/control line under the title. */
    #hud {
      margin-bottom: 10px;
      color: #9cff00;
      font-size: 14px;
    }

    /* GAME GRID: the actual tile map canvas made from HTML divs. */
    #game {
  display: grid;
  border: 4px solid #ff8c00;
  position: relative;
  background: #cfe8ff;
}

    /* TILE CELLS: every grid square uses this 64x64 base style. */
    .tile {
      width: 64px;
      height: 64px;
      background-image: url("gallery/ground/snow-basic.png");
      background-size: 64px 64px;
      position: relative;
      overflow: visible;
    }

/* NIGHT Overlay */

#nightOverlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 35;
  background: rgba(0, 20, 55, 0.45);
  display: none;
}
/* weather system */

#snowOverlay.weather-snow {
  opacity: 0.7;
  animation: snowDrift 12s linear infinite;
  filter: none;
}

#snowOverlay.weather-blizzard {
  opacity: 1;
  animation: blizzardDrift 3s linear infinite;
  filter: blur(1px);
  background-size: 60px 60px, 100px 100px, 160px 160px;
}

@keyframes snowDrift {
  from {
    background-position: 0 0;
  }
  to {
    background-position: 200px 400px;
  }
}

@keyframes blizzardDrift {
  from {
    background-position: 0 0;
  }
  to {
    background-position: 700px 300px;
  }
}

/* Snow Effect */

#snowOverlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 40;
  background-image:
    radial-gradient(circle, rgba(255,255,255,0.9) 1px, transparent 2px),
    radial-gradient(circle, rgba(255,255,255,0.6) 1px, transparent 2px),
    radial-gradient(circle, rgba(255,255,255,0.35) 1px, transparent 2px);
  background-size: 90px 90px, 140px 140px, 220px 220px;
  animation: snowFall 1.2s linear infinite;
  display: none;
}

@keyframes snowFall {
  from {
    background-position: 0 0, 40px 0, 80px 0;
  }
  to {
    background-position: 30px 90px, 10px 140px, 60px 220px;
  }
}

/* hereo overlay */

#hereoOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.88);
  z-index: 130;
  display: flex;
  align-items: center;
  justify-content: center;

}

<body>


  <!-- PAGE TITLE / GAME NAME -->
  <h1>Badges of SNOW PLANET UNRECOGNIZER [for game testing/development]</h1>
  <!-- HUD: current mode and controls -->
  <div id="hud">Mode: Walking | Arrow Keys: Move | E: Enter / Exit / Ride / Interact | B: Back | I: Inventory</div>
    <!-- CAMERA: visible viewport around the larger tile map -->
  <div id="camera">
  <div id="game"></div>
  <div id="introLayer"></div>
  <div id="snowOverlay"></div>
  <div id="nightOverlay"></div>
</div>
  <!-- MESSAGE BOX: short interaction feedback -->
  <div id="messageBox">There is no objective yet...</div>

  <!-- INSTRUCTIONS: player-facing note beneath the game -->
  <div class="instructions">
    Press "i" key for inventory. Press "e" to enter/exit/ride. Press "b" to go back.
  </div>
<!-- MOBILE CONTROLS: touch buttons that simulate keyboard events -->
<div id="mobileControls">
  <button id="upBtn">▲</button>
  <button id="fireBtn">🔴</button>
  <div>
    <button id="leftBtn">◀</button>
    <button id="eBtn">E</button>
    <button id="iBtn">I</button>
    <button id="skipBtn">SKIP</button>
    <button id="rightBtn">▶</button>
        <button id="bBtn">B</button>
  </div>

  <button id="downBtn">▼</button>
</div>
<script>

/*
  ============================================================
  UNRECOGNIZER VEHICLE TEST TEMPLATE
  Reorganized + commented study/development version

  The file is organized by game system:
  1. HTML/CSS interface
  2. map and tile data
  3. player, NPC, building, and vehicle state
  4. UI overlays: dialogue, phone, exchange terminal
  5. movement, collision, drawing, and camera
  6. interactions, conversations, keyboard, mobile controls

  This is still plain HTML/CSS/JavaScript, so it can be opened
  directly in Live Server without a build step.
  ============================================================
*/

// ------------------------------------------------------------
// MAP SETTINGS / DOM
// ------------------------------------------------------------

// TILE / MAP DIMENSIONS
// Controls the size of each square tile and the base outside map dimensions.
// Most movement, drawing, collision, and camera math depends on TILE_SIZE.
const TILE_SIZE = 64;
const MAP_WIDTH = 30;
const MAP_HEIGHT = 22;

// CORE DOM REFERENCES
// These connect JavaScript to the visible game board, HUD, and message box.
const game = document.getElementById("game");
const hud = document.getElementById("hud");
const messageBox = document.getElementById("messageBox");
const introLayer = document.getElementById("introLayer");

// sound effects

const RADIO_TRANSMISSION_SOUND = new Audio(
  "gallery/sounds/tech/radio-transmission.wav"
);
RADIO_TRANSMISSION_SOUND.preload = "auto";
RADIO_TRANSMISSION_SOUND.volume = 0.10;

const COMPUTER_INTERACTION_SOUND = new Audio(
  "gallery/sounds/tech/computer-interaction.wav"
);
COMPUTER_INTERACTION_SOUND.preload = "auto";
COMPUTER_INTERACTION_SOUND.volume = 0.10;

const BASIC_LASER_BLAST_SOUND = new Audio(
  "gallery/sounds/weapon/basic-laser-blast.wav"
);

BASIC_LASER_BLAST_SOUND.volume = 0.35;

// vehicle sounds

const SNOWMOBILE_ENGINE = new Audio(
  "gallery/sounds/vehicle/engine-snowmobile.m4a"
);

SNOWMOBILE_ENGINE.loop = true;
SNOWMOBILE_ENGINE.volume = 0.5;

const RS1_ENGINE = new Audio(
  "gallery/sounds/vehicle/engine-rs-1.flac"
);

RS1_ENGINE.loop = true;
RS1_ENGINE.volume = 0.10;



const CAR_DOOR_SOUND = new Audio(
  "gallery/sounds/vehicle/car-door-1.mp3"
);

const CAR1_ENGINE_REV = new Audio(
  "gallery/sounds/vehicle/engine-rev-1.wav"
);

CAR1_ENGINE_REV.volume = 0.3;

const WIND_1 = new Audio(
  "gallery/sounds/weather/wind-1.mp3"
);

WIND_1.loop = true;
WIND_1.volume = 1;

function startWindSound() {
  WIND_1.play();
}

function stopWindSound() {
  WIND_1.pause();
  WIND_1.currentTime = 0;
}

function updateWeatherSounds() {

  const outside = !!OUTSIDE_MAPS[currentMap];
  const inVehicle = mode === "driving";

  if (outside && !inVehicle) {
    if (WIND_1.paused) {
      WIND_1.play();
    }
  } else {
    if (!WIND_1.paused) {
      WIND_1.pause();
      WIND_1.currentTime = 0;
    }
  }
}


const CAR1_ENGINE_IDLE = new Audio("gallery/sounds/vehicle/engine-idling-1.wav");
CAR1_ENGINE_IDLE.loop = true;
CAR1_ENGINE_IDLE.volume = 1;

function playVehicleIdleSound(vehicle) {
  if (!vehicle) return;

  if (vehicle.type === "trackedCar" && vehicle.model === "car-1") {
    CAR1_ENGINE_IDLE.currentTime = 0;
    CAR1_ENGINE_IDLE.play().catch(err => {
      console.log("Engine idle failed:", err);
    });
  }
}

// ------------------------------------------------------------
// PLAYER SETTINGS
// ------------------------------------------------------------

// PLAYER STATE
// Tracks Zyr's current grid position and facing direction while walking.
let player = {
  x: 1,
  y: 2,
  facing: "right"
};

let currentMap = "outside";
// speech bubble priority

// fuel pump menu functions

function openFuelMenu(pumpSpot) {
  fuelMenuOpen = true;
  fuelMenuSelection = 0;
  selectedFuelVehicle = getVehicleNearFuelPump(pumpSpot, 5);

  drawFuelMenu();
}

function closeFuelMenu() {
  fuelMenuOpen = false;
  fuelMenuSelection = 0;
  selectedFuelVehicle = null;
  hideBubble();
}

function getFuelMenuOptions() {
  const options = [];

  if (selectedFuelVehicle) {
    options.push("Refuel " + selectedFuelVehicle.name + " - " + FUEL_COST + " Merit");
  }

  options.push("Fill Gas Jug - " + FUEL_COST + " Merit");
  options.push("Leave");

  return options;
}

function drawFuelMenu() {
  hideBubble();

  const options = getFuelMenuOptions();

  const choiceText = options.map((option, index) => {
    const marker = index === fuelMenuSelection ? "▶" : " ";
    return marker + " " + option;
  }).join("<br>");

  showBubble(
    "STRO FUEL",
    "Automated fuel service active.<br><br>" + choiceText
  );
}

// fuel pump menu choices

function handleFuelMenuInput(key) {
  if (!fuelMenuOpen) return false;

  const options = getFuelMenuOptions();

  if (key === "arrowup") {
    fuelMenuSelection--;

    if (fuelMenuSelection < 0) {
      fuelMenuSelection = options.length - 1;
    }

    drawFuelMenu();
    return true;
  }

  if (key === "arrowdown") {
    fuelMenuSelection++;

    if (fuelMenuSelection >= options.length) {
      fuelMenuSelection = 0;
    }

    drawFuelMenu();
    return true;
  }

  if (key === "b" || key === "escape") {
    closeFuelMenu();
    setMessage("Fuel service closed.");
    return true;
  }

  if (key === "e" || key === "enter") {
    const choice = options[fuelMenuSelection];

    if (choice === "Leave") {
      closeFuelMenu();
      setMessage("Fuel service closed.");
      return true;
    }

    if (choice.startsWith("Refuel")) {
      if (!selectedFuelVehicle) return true;

      if (!spendMerit(FUEL_COST)) {
        setMessage("Not enough Merit.");
        drawFuelMenu();
        return true;
      }

      addToGasTank(selectedFuelVehicle, FUEL_AMOUNT);
      closeFuelMenu();
      showBubble("STRO FUEL", selectedFuelVehicle.name + " refueled.");
      return true;
    }

    if (choice.startsWith("Fill Gas Jug")) {
      if (!hasItem("gasJug")) {
        setMessage("You need a gas jug.");
        drawFuelMenu();
        return true;
      }

      if (!spendMerit(FUEL_COST)) {
        setMessage("Not enough Merit.");
        drawFuelMenu();
        return true;
      }

      ITEM_DATA.gasJug.filled = true;
      ITEM_DATA.gasJug.image = "gallery/item/gas-jug-full.png";

      closeFuelMenu();
      showBubble("STRO FUEL", "Gas jug filled.");
      setMessage("Gas jug filled.");
      return true;
    }
  }

  return true;
}

// COMBAT SYSTEM

let combatMode = false;
let combatEnemy = null;
let combatStarted = false;

function beginCombat(enemy) {
  if (combatMode) return;

  combatMode = true;
  combatEnemy = enemy;
  combatStarted = true;

  setMessage("COMBAT MODE");
}

function endCombat(message = "Combat ended.") {
  combatMode = false;
  combatEnemy = null;
  combatStarted = false;
  combatTick = 0;

  projectiles = projectiles.filter(projectile => projectile.owner === "player");

  setMessage(message);
}

// combat tick

let combatTick = 0;

function getDirectionTowardPlayer(npc) {
  const dx = player.x - npc.x;
  const dy = player.y - npc.y;

  if (Math.abs(dx) > Math.abs(dy)) {
    return dx > 0 ? "right" : "left";
  }

  return dy > 0 ? "down" : "up";
}

function npcFireLaser(npc) {
  const direction = getDirectionTowardPlayer(npc);

  let shotX = npc.x;
  let shotY = npc.y;

  if (direction === "up") shotY--;
  if (direction === "down") shotY++;
  if (direction === "left") shotX--;
  if (direction === "right") shotX++;

  if (!inBounds(shotX, shotY)) return;

  spawnProjectile(npc.id, shotX, shotY, direction, 6);

  BASIC_LASER_BLAST_SOUND.currentTime = 0;
  BASIC_LASER_BLAST_SOUND.play().catch(err => {
    console.log("NPC laser sound failed:", err);
  });
}

function npcStepTowardPlayer(npc) {
  const direction = getDirectionTowardPlayer(npc);

  let nextX = npc.x;
  let nextY = npc.y;

  if (direction === "up") nextY--;
  if (direction === "down") nextY++;
  if (direction === "left") nextX--;
  if (direction === "right") nextX++;

  if (!inBounds(nextX, nextY)) return;
  if (nextX === player.x && nextY === player.y) return;
  if (isLaserBlocked(nextX, nextY)) return;

  npc.x = nextX;
  npc.y = nextY;
}

function updateCombat() {
  if (!combatMode) return;
  if (!combatEnemy) return;
  if (!combatEnemy.visible) {
    endCombat("Combat ended.");
    return;
  }
  if (combatEnemy.defeated) return;
  if (combatEnemy.map !== currentMap) return;

  combatTick++;

  if (combatTick % 12 === 0) {
    npcFireLaser(combatEnemy);
  }

  if (combatTick % 24 === 0) {
    npcStepTowardPlayer(combatEnemy);
  }
}

// combat damage and defeat

function defeatNpc(npc) {
  npc.defeated = true;
  npc.health = 0;
  npc.searchable = true;
  npc.combatState = "defeated";

  if (npc.id === "phayl") {
    resolvePhaylDefeatCatalyst();
  } else {
    setMessage(npc.name + " defeated.");
  }

  if (combatEnemy === npc) {
    endCombat();
  }
}

// ------------------------------------------------------------
// ROAD MAP RED SNOW RENEGADES
// Endless hostile NPCs who emerge from the forest edges.
// ------------------------------------------------------------

const ROAD_RENEGADE_MAX_ACTIVE = 3;
const ROAD_RENEGADE_SPAWN_INTERVAL = 3500;

let roadRenegadeSerial = 0;

// These are open snow tiles immediately beside the forest regions.
// Northern gangsters emerge downward from the upper forest.
// Southern gangsters emerge upward from the lower forest.
const ROAD_RENEGADE_SPAWN_POINTS = [
  { x: 5,  y: 11, facing: "down" },
  { x: 10, y: 11, facing: "down" },
  { x: 15, y: 11, facing: "down" },
  { x: 20, y: 11, facing: "down" },
  { x: 24, y: 11, facing: "down" },

  { x: 5,  y: 16, facing: "up" },
  { x: 10, y: 16, facing: "up" },
  { x: 15, y: 16, facing: "up" },
  { x: 20, y: 16, facing: "up" },
  { x: 24, y: 16, facing: "up" }
];

function getActiveRoadRenegades() {
  return npcs.filter(npc =>
    npc.isRoadRenegade &&
    npc.visible &&
    !npc.defeated &&
    npc.map === "roadMap"
  );
}

function getAllRoadRenegades() {
  return npcs.filter(npc => npc.isRoadRenegade);
}

function isRoadRenegadeSpawnPointClear(point) {
  if (!point) return false;

  if (currentMap !== "roadMap") return false;
  if (!inBounds(point.x, point.y)) return false;

  // Do not materialize directly beside or underneath Zyr.
  const distanceFromPlayer =
    Math.abs(player.x - point.x) +
    Math.abs(player.y - point.y);

  if (distanceFromPlayer < 7) return false;

  if (isOccupiedByNpcOrResident(point.x, point.y)) return false;
  if (isOccupiedByVehicle(point.x, point.y)) return false;
  if (isOccupiedByBuilding(point.x, point.y)) return false;

  const symbol = ROAD_MAP[point.y]?.[point.x];

  // Renegades must enter on ordinary open snow.
  if (symbol !== ".") return false;

  return true;
}

function createRoadRenegade(point) {
  roadRenegadeSerial++;

  return {
    id: "road-renegade-" + roadRenegadeSerial,
    name: "RED SNOW RENEGADE",
    map: "roadMap",

    x: point.x,
    y: point.y,
    facing: point.facing,

    // Temporary reused artwork.
    // These paths can later be replaced with anonymous gangster artwork.
    image: "gallery/sprite/badge/rs/red-snow-badge.png",
    defeatedImage: "gallery/sprite/badge/rs/red-snow-badge-defeated.png",

    visible: true,
    faction: "redSnow",
    weapon: "basicLaserHandgun",

    health: 75,
    maxHealth: 75,

    combatState: "attacking",
    target: "player",

    defeated: false,
    searchable: false,
    searched: false,

    // Empty inventory means searching clears the defeated body
    // without duplicating unlimited laser weapons.
    inventory: [],

    isRoadRenegade: true,

    moveCooldown: 1 + Math.floor(Math.random() * 3),
    fireCooldown: 3 + Math.floor(Math.random() * 5)
  };
}

function spawnRoadRenegade() {
  if (currentMap !== "roadMap") return false;
  if (mode !== "walking") return false;

  const activeRenegades = getActiveRoadRenegades();

  if (activeRenegades.length >= ROAD_RENEGADE_MAX_ACTIVE) {
    return false;
  }

  const availablePoints =
    ROAD_RENEGADE_SPAWN_POINTS.filter(isRoadRenegadeSpawnPointClear);

  if (availablePoints.length === 0) return false;

  const point =
    availablePoints[Math.floor(Math.random() * availablePoints.length)];

  const renegade = createRoadRenegade(point);
  npcs.push(renegade);

  if (activeRenegades.length === 0) {
    setMessage("Movement at the forest edge. Red Snow renegades attack.");
  }

  drawGame();
  return true;
}

function updateRoadRenegades() {
  if (currentMap !== "roadMap") return;
  if (mode !== "walking") return;

  const renegades = getActiveRoadRenegades();

  if (renegades.length === 0) return;

  for (const renegade of renegades) {
    renegade.moveCooldown--;
    renegade.fireCooldown--;

    if (renegade.fireCooldown <= 0) {
      npcFireLaser(renegade);
      renegade.fireCooldown = 4 + Math.floor(Math.random() * 5);
    }

    if (renegade.moveCooldown <= 0) {
      npcStepTowardPlayer(renegade);
      renegade.moveCooldown = 2 + Math.floor(Math.random() * 3);
    }
  }

  drawGame();
}

function removeSearchedRoadRenegades() {
  npcs = npcs.filter(npc =>
    !npc.isRoadRenegade ||
    !npc.searched
  );
}

// body heat

let bodyHeat = 28;
let bodyHeatActive = false;
let lastBodyHeatWarning = "";
let lastBodyHeat = bodyHeat;

function updateBodyHeat() {
  if (!bodyHeatActive) return;

  if (equippedSuit === "thermalSnowSuit") {
    bodyHeat = 100;
    lastBodyHeatWarning = "protected";
    return;
  }

  const outside = !!OUTSIDE_MAPS[currentMap];
  const inVehicle = mode === "driving";

  let heatLoss = 0;

  if (outside && !inVehicle) {
    if (weatherMode === "clear") {
      heatLoss = 1;
    } else if (weatherMode === "snow") {
      heatLoss = timeOfDay === "night" ? 4 : 2;
    } else if (weatherMode === "blizzard") {
      heatLoss = 6;
    }

    if (equippedSuit === "snowSuit") {
      heatLoss = Math.max(0, heatLoss - 2);
    }

    bodyHeat -= heatLoss;
  }

  if (!outside || inVehicle) {
    bodyHeat += 2;
    blizzardWarningShown = false;
  }

  bodyHeat = Math.max(0, Math.min(100, bodyHeat));

  const warmingUp = !outside || inVehicle;
  const coolingDown = outside && !inVehicle;

  if (warmingUp) {
    if (lastBodyHeatWarning !== "warming") {
      lastBodyHeatWarning = "warming";
      hideBubble();
      showBubble("SURVIVAL SYSTEM", "Restoring body heat.");
    }

    lastBodyHeat = bodyHeat;
    return;
  }

  if (coolingDown) {
    if (bodyHeat <= 0) {
      bodyHeat = 1;

      if (lastBodyHeatWarning !== "depleted") {
        lastBodyHeatWarning = "depleted";
        showBubble(
          "SURVIVAL SYSTEM",
          "Body heat depleted. Emergency thermal reserves engaged."
        );
        setMessage("Body heat critical.");
      }

      lastBodyHeat = bodyHeat;
      return;
    }

    if (bodyHeat <= 25 && lastBodyHeatWarning !== "emergency") {
      lastBodyHeatWarning = "emergency";
      showBubble("SURVIVAL SYSTEM", "Emergency cold exposure.");
      setMessage("Body heat emergency.");
    } else if (bodyHeat <= 50 && lastBodyHeatWarning !== "critical") {
      lastBodyHeatWarning = "critical";
      showBubble("SURVIVAL SYSTEM", "Body heat dropping.");
      setMessage("Body heat critical.");
    }
  }

  lastBodyHeat = bodyHeat;
}

// WEATHER SYSTEM

let weatherMode = "snow"; // "clear", "snow", "blizzard"
let weatherTimer = null;
let lastWeatherMessage = "";

const WEATHER_MODES = ["clear", "snow", "blizzard"];

function setWeather(mode) {
  weatherMode = mode;

  const snowOverlay = document.getElementById("snowOverlay");
  if (!snowOverlay) return;

  snowOverlay.classList.remove("weather-clear", "weather-snow", "weather-blizzard");

  if (mode === "clear") {
    snowOverlay.style.display = "none";
  }

  if (mode === "snow") {
    snowOverlay.style.display = "block";
    snowOverlay.classList.add("weather-snow");
  }

  if (mode === "blizzard") {
    snowOverlay.style.display = "block";
    snowOverlay.classList.add("weather-blizzard");
  }

  showWeatherMessage(mode);

  console.log("Weather is now:", weatherMode);
}

function showWeatherMessage(mode) {
  if (!OUTSIDE_MAPS[currentMap]) return;
  if (lastWeatherMessage === mode) return;
  if (isSpeechBubbleOpen()) return;

  lastWeatherMessage = mode;

  if (mode === "clear") {
    setMessage("The snowfall clears.");
  } else if (mode === "snow") {
    setMessage("Snow begins falling.");
  } else if (mode === "blizzard") {
    setMessage("Blizzard conditions intensify.");
    showBubble(
      "SURVIVAL SYSTEM",
      "Blizzard conditions. Body heat loss accelerated."
    );
  }
}

function randomWeather() {
  const choices = WEATHER_MODES.filter(mode => mode !== weatherMode);
  const next = choices[Math.floor(Math.random() * choices.length)];
  setWeather(next);
}

function scheduleNextWeatherChange() {
  if (weatherTimer) clearTimeout(weatherTimer);

  const minTime = 45000;  // 45 seconds
  const maxTime = 120000; // 2 minutes

  const delay = minTime + Math.random() * (maxTime - minTime);

  weatherTimer = setTimeout(() => {
    randomWeather();
    scheduleNextWeatherChange();
  }, delay);
}

function startWeatherSystem() {
  setWeather("snow");
  scheduleNextWeatherChange();
}

let projectiles = [];
let impactEffects = [];

const PROJECTILE_IMAGES = {
  basicLaser: "gallery/effect/basic-laser-blast.png"
};

function spawnProjectile(owner, x, y, direction, range) {
  projectiles.push({
    owner: owner,
    map: currentMap,
    x: x,
    y: y,
    direction: direction,
    image: PROJECTILE_IMAGES.basicLaser,
    rangeRemaining: range
  });
}

function updateProjectiles() {
  for (const projectile of projectiles) {

    let nextX = projectile.x;
    let nextY = projectile.y;

    if (projectile.direction === "up") nextY--;
    if (projectile.direction === "down") nextY++;
    if (projectile.direction === "left") nextX--;
    if (projectile.direction === "right") nextX++;

    const hitNpc = npcs.find(npc =>
      !npc.defeated &&
      npc.map === projectile.map &&
      npc.x === nextX &&
      npc.y === nextY &&
      npc.id !== projectile.owner
    );

    if (hitNpc) {
      hitNpc.health -= 25;

      console.log("NPC HIT:", hitNpc.name, "HP:", hitNpc.health);

      spawnImpactEffect(nextX, nextY);
      projectile.rangeRemaining = 0;

      if (hitNpc.health <= 0) {
        console.log("DEFEATING:", hitNpc.name);
        defeatNpc(hitNpc);
      } else {
        setMessage(hitNpc.name + " hit. HP: " + hitNpc.health);
      }

      continue;
    }

    if (isLaserBlocked(nextX, nextY)) {
      spawnImpactEffect(nextX, nextY);
      projectile.rangeRemaining = 0;
      continue;
    }

    projectile.x = nextX;
    projectile.y = nextY;

    projectile.rangeRemaining--;
  }

  projectiles = projectiles.filter(projectile => {
    if (projectile.rangeRemaining <= 0) return false;
    if (!inBounds(projectile.x, projectile.y)) return false;
    if (projectile.map !== currentMap) return false;

    return true;
  });

  updateImpactEffects();
  drawGame();
}

function spawnImpactEffect(x, y) {
  const sparks = [];

  for (let i = 0; i < 10; i++) {
    sparks.push({
      dx: (Math.random() - 0.5) * 52,
      dy: (Math.random() - 0.5) * 52
    });
  }

  impactEffects.push({
    map: currentMap,
    x: x,
    y: y,
    age: 0,
    life: 5,
    sparks: sparks
  });
}

function updateImpactEffects() {
  for (const effect of impactEffects) {
    effect.age++;
  }

  impactEffects = impactEffects.filter(effect => {
    if (effect.age >= effect.life) return false;
    if (effect.map !== currentMap) return false;
    return true;
  });
}

function drawImpactEffects() {
  for (const effect of impactEffects) {
    if (effect.map !== currentMap) continue;

    const tile = getTile(effect.x, effect.y);
    if (!tile) continue;

    const progress = effect.age / effect.life;
    const opacity = 1 - progress;

    const wrapper = document.createElement("div");
    wrapper.className = "impactEffect";

    const glow = document.createElement("div");
    glow.className = "impactGlow";
    glow.style.opacity = opacity;
    glow.style.transform = `translate(-50%, -50%) scale(${1 + progress * 2.2})`;

    wrapper.appendChild(glow);

    for (const sparkData of effect.sparks) {
      const spark = document.createElement("div");
      spark.className = "impactSpark";
      spark.style.opacity = opacity;
      spark.style.transform = `translate(${sparkData.dx * progress}px, ${sparkData.dy * progress}px) scale(${1 - progress * 0.4})`;
      wrapper.appendChild(spark);
    }

    tile.appendChild(wrapper);
  }
}

function fireEquippedWeapon() {
  if (!equippedWeapon) {
    setMessage("No weapon equipped.");
    return;
  }

  const weapon = ITEM_DATA[equippedWeapon];

  if (!weapon || weapon.type !== "weapon") {
    setMessage("No weapon equipped.");
    return;
  }

  let shotX = player.x;
  let shotY = player.y;

  if (player.facing === "up") shotY--;
  if (player.facing === "down") shotY++;
  if (player.facing === "left") shotX--;
  if (player.facing === "right") shotX++;

  if (!inBounds(shotX, shotY)) return;

  const hitNpc = npcs.find(npc =>
    !npc.defeated &&
    npc.visible !== false &&
    npc.map === currentMap &&
    npc.x === shotX &&
    npc.y === shotY &&
    npc.id !== "player"
  );

  if (hitNpc) {
    hitNpc.health -= 25;

    spawnImpactEffect(shotX, shotY);

    if (hitNpc.health <= 0) {
      defeatNpc(hitNpc);
    } else {
      setMessage(hitNpc.name + " hit. HP: " + hitNpc.health);
    }

    drawGame();
    return;
  }

  if (isLaserBlocked(shotX, shotY)) {
    spawnImpactEffect(shotX, shotY);
    drawGame();
    return;
  }

  spawnProjectile("player", shotX, shotY, player.facing, weapon.range);

  BASIC_LASER_BLAST_SOUND.currentTime = 0;
  BASIC_LASER_BLAST_SOUND.play().catch(err => {
    console.log("Laser sound failed:", err);
  });

  drawGame();
}

function drawProjectiles() {
  for (const projectile of projectiles) {
    if (projectile.map !== currentMap) continue;
    addImageToTile(projectile.x, projectile.y, projectile.image);
  }
}

let searchNpcMenuOpen = false;

  "Search",
  "Leave"
];

// search npc death menu

function openSearchNpcMenu(npc) {
  searchNpcMenuOpen = true;
  searchNpcTarget = npc;
  searchNpcSelection = 0;
  drawSearchNpcMenu();
}

function closeSearchNpcMenu() {
  searchNpcMenuOpen = false;
  searchNpcTarget = null;
  searchNpcSelection = 0;
  hideBubble();
}

function drawSearchNpcMenu() {
  if (!searchNpcTarget) return;

  const choiceText = searchNpcOptions.map((option, index) => {
    const marker = index === searchNpcSelection ? "▶" : " ";
    return marker + " " + option;
  }).join("<br>");

  showBubble(
    "SEARCH",
    "Search " + searchNpcTarget.name + "?<br><br>" + choiceText
  );
}

// actual search npc interaction for inventory transfer

function searchDefeatedNpc(npc) {
  if (!npc) return;

  if (!npc.defeated || !npc.searchable) {
    showBubble("SEARCH", npc.name + " cannot be searched.");
    setMessage("Cannot search.");
    return;
  }

  if (npc.searched) {
    showBubble("SEARCH", npc.name + " has already been searched.");
    setMessage("Already searched.");
    return;
  }

  const loot = npc.inventory || [];

  if (loot.length === 0) {
  npc.searched = true;
  npc.searchable = false;
  npc.visible = false;

  showBubble("SEARCH", npc.name + " had nothing.");
  setMessage("Nothing found.");

  removeSearchedRoadRenegades();

  drawGame();
  return;
}

  const foundNames = [];

  for (const itemId of loot) {
    addItem(itemId);

    if (ITEM_DATA[itemId]) {
      foundNames.push(ITEM_DATA[itemId].name);
    } else {
      foundNames.push(itemId);
    }
  }

  npc.inventory = [];
  npc.searched = true;
  npc.searchable = false;
  npc.visible = false;

  showBubble(
    "SEARCH",
    "Recovered from " + npc.name + ":<br>" + foundNames.join("<br>")
  );

  setMessage("Inventory recovered from " + npc.name + ".");
  drawGame();
}

// npc search menu input handler

function handleSearchNpcMenuInput(key) {
  if (!searchNpcMenuOpen) return false;

  if (key === "arrowup" || key === "arrowdown") {
    searchNpcSelection = searchNpcSelection === 0 ? 1 : 0;
    drawSearchNpcMenu();
    return true;
  }

  if (key === "b" || key === "escape") {
    closeSearchNpcMenu();
    setMessage("Search cancelled.");
    return true;
  }

  if (key === "e" || key === "enter") {
    if (searchNpcSelection === 0) {
  const npc = searchNpcTarget;
  closeSearchNpcMenu();
  searchDefeatedNpc(npc);
  return true;
}

    closeSearchNpcMenu();
    setMessage("Search cancelled.");
    return true;
  }

  return true;
}

// EXCHANGE TERMINAL PROXIMITY CHECK
// Returns true when the player is adjacent to an "x" exchange terminal tile.
function playerIsBesideExchange() {
  const checks = [
    { x: player.x, y: player.y - 1 },
    { x: player.x, y: player.y + 1 },
    { x: player.x - 1, y: player.y },
    { x: player.x + 1, y: player.y }
  ];

  for (const spot of checks) {
    if (!inBounds(spot.x, spot.y)) continue;

    const symbol = BLUEPRINTS[currentMap]?.[spot.y]?.[spot.x];
    if (symbol === "x") return true;
  }

  return false;
}

function closeComputerOverlay() {

  if (overlay) overlay.remove();

function focusComputerInput() {
  const input = document.getElementById("computerInput");
  if (input) input.focus();
}

function drawComputerOverlay() {
  const oldOverlay = document.getElementById("computerOverlay");
  if (oldOverlay) oldOverlay.remove();

  const overlay = document.createElement("div");
  overlay.id = "computerOverlay";

  overlay.innerHTML = `
    <div id="computerImage"></div>

    <div id="computerMenu">
      <h2>STRO CENTRAL TERMINAL</h2>

      <p>${computerOutput}</p>

      <div id="computerPromptLine">
        > <input
          id="computerInput"
          value="${computerCommand}"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        >
      </div>

      <p class="phoneHint">
        Type command | Enter: submit | B/Esc: close
      </p>
    </div>
  `;

  document.body.appendChild(overlay);

  const input = document.getElementById("computerInput");

  input.addEventListener("input", () => {
    computerCommand = input.value;
  });

  input.addEventListener("keydown", event => {
    event.stopPropagation();

    const key = event.key.toLowerCase();

    if (key === "enter") {
      event.preventDefault();
      computerCommand = input.value;
      submitComputerCommand();
      focusComputerInput();
    }

    if (key === "escape") {
      event.preventDefault();
      closeComputerOverlay();
    }
  });

  focusComputerInput();
}

// computer command handling

function submitComputerCommand() {
  const command = computerCommand.trim().toLowerCase();

  if (command === "ch1" || command === "hereo") {
    addItem("hereoDevice");
    computerOutput = "AUTHORIZED. HEREO DEVICE ADDED TO INVENTORY.";

if (command === "servicelaser") {

if (command === "basiclaser") {

function handleComputerInput(key, event) {
  if (!usingComputer) return false;

  if (key === "b" || key === "escape") {
    event.preventDefault();
    closeComputerOverlay();
    return true;
  }

  if (key === "e") {
    event.preventDefault();
    submitComputerCommand();

  }

}

// fuel system helper

const VEHICLE_FUEL_MAX = 100;
const PLAYER_FUEL_BURN_PER_MOVE = 0.25;
const NPC_FUEL_BURN_PER_MOVE = 1;

function setupVehicleFuel(vehicle) {
  if (!vehicle) return;

  if (vehicle.maxFuel === undefined) {
    vehicle.maxFuel = VEHICLE_FUEL_MAX;
  }

  if (vehicle.fuel === undefined) {
    vehicle.fuel = vehicle.maxFuel;
  }
}

function getFuelPercent(vehicle) {
  setupVehicleFuel(vehicle);
  return Math.round(vehicle.fuel);
}

function spendPlayerVehicleFuel(vehicle) {
  setupVehicleFuel(vehicle);

  if (vehicle.fuel <= 0) {
    vehicle.fuel = 0;
    stopVehicleIdleSound(vehicle);
    showBubble("VEHICLE SYSTEM", "Fuel tank empty.");
    setMessage("Out of fuel.");
    return false;
  }

  vehicle.fuel = Math.max(0, vehicle.fuel - PLAYER_FUEL_BURN_PER_MOVE);

  if (vehicle.fuel <= 0) {
    vehicle.fuel = 0;
    stopVehicleIdleSound(vehicle);
    showBubble("VEHICLE SYSTEM", "Fuel tank empty.");
    setMessage("Out of fuel.");
  }

  return vehicle.fuel > 0;
}

function spendNpcVehicleFuel(vehicle) {
  setupVehicleFuel(vehicle);

  vehicle.fuel -= NPC_FUEL_BURN_PER_MOVE;

  if (vehicle.fuel <= 0) {
    vehicle.fuel = vehicle.maxFuel;
  }

  return true;
}

function addToGasTank(vehicle, amount) {
  setupVehicleFuel(vehicle);

  vehicle.fuel = Math.min(vehicle.maxFuel, vehicle.fuel + amount);

  setMessage(vehicle.name + " fuel: " + getFuelPercent(vehicle) + "%.");
}

// jegna helper 

function moveNpcToward(npc, targetX, targetY) {
  let dx = 0;
  let dy = 0;

  if (npc.x < targetX) dx = 1;
  else if (npc.x > targetX) dx = -1;
  else if (npc.y < targetY) dy = 1;
  else if (npc.y > targetY) dy = -1;

// reverse helper

function isOppositeDirection(a, b) {
  return (
    (a === "left" && b === "right") ||
    (a === "right" && b === "left") ||
    (a === "up" && b === "down") ||
    (a === "down" && b === "up")
  );
}

// DIRECTION HELPER
// Converts a facing direction into x/y movement numbers.
function directionToDelta(direction) {
  if (direction === "up") return { dx: 0, dy: -1 };
  if (direction === "down") return { dx: 0, dy: 1 };
  if (direction === "left") return { dx: -1, dy: 0 };
  if (direction === "right") return { dx: 1, dy: 0 };

  return { dx: 0, dy: 0 };
}

// DEPLOY SDA TRANSPORT SQUAD

function deploySdaTransportSquad(vehicle) {
  if (!vehicle || !vehicle.passengers || vehicle.passengers.length === 0) return false;

  const dropSpots = [
    { x: vehicle.x - 1, y: vehicle.y + vehicle.height },
    { x: vehicle.x + 1, y: vehicle.y + vehicle.height },
    { x: vehicle.x + 3, y: vehicle.y + vehicle.height }
  ];

  for (let i = 0; i < vehicle.passengers.length; i++) {
    const guard = getResidentById(vehicle.passengers[i]);
    const spot = dropSpots[i];

    if (!guard || !spot) continue;
    if (!canResidentStep(guard, spot.x, spot.y)) continue;

    guard.map = vehicle.map;
    guard.x = spot.x;
    guard.y = spot.y;
    guard.facing = "down";
    guard.state = "standingGuard";
    guard.visible = true;
    guard.timer = 0;
  }

  vehicle.passengers = [];
  vehicle.deployed = true;

  showBubble("SDA TRANSPORT", "SDA personnel deploy from the transport.");
  setMessage("SDA squad deployed.");

  drawGame();
  return true;
}

// ACTIVE MAP LOOKUP
// Returns the correct map array for the currentMap name.
function getActiveMap() {
  if (OUTSIDE_MAPS[currentMap]) {
    return OUTSIDE_MAPS[currentMap];
  }

  return BLUEPRINTS[currentMap];
}

// ACTIVE MAP WIDTH
// Counts columns in the active map.
function getActiveWidth() {
  return getActiveMap()[0].length;
}

// ACTIVE MAP HEIGHT
// Counts rows in the active map.
function getActiveHeight() {
  return getActiveMap().length;
}

// MAP BOUNDARY CHECK
// Prevents player and vehicle movement outside the current map.
function inBounds(x, y) {
  return x >= 0 && x < getActiveWidth() && y >= 0 && y < getActiveHeight();
}

// VEHICLE FOOTPRINT
// Converts a multi-tile vehicle into a list of occupied grid coordinates.
function getVehicleFootprint(vehicle) {
  const spots = [];

  for (let yy = 0; yy < vehicle.height; yy++) {
    for (let xx = 0; xx < vehicle.width; xx++) {
      spots.push({
        x: vehicle.x + xx,
        y: vehicle.y + yy
      });
    }
  }

  return spots;
}

// LASER / PROJECTILE COLLISION CHECK
// Returns true if a laser blast should stop at this tile.
function isLaserBlocked(x, y) {
  const activeMap = getActiveMap();
  const row = activeMap?.[y];

  // Stop lasers at real map/blueprint edges, including short string rows.
  if (!row || x < 0 || x >= row.length) return true;

  const symbol = row[x];

if (symbol === undefined) return true;

// keycard readers / access doors stop lasers
if ("12345678".includes(symbol)) return true;

  if (isOccupiedByNpcOrResident(x, y)) return true;

  if (OUTSIDE_MAPS[currentMap]) {
    if (isOccupiedByVehicle(x, y)) return true;
    if (isOccupiedByBuilding(x, y)) return true;

    if (symbol === "@") return true;
    if (symbol === "P") return true;
    if (symbol === "p") return true;
  }

  if (BLUEPRINTS[currentMap]) {
    if (isOccupiedByInteriorTile(x, y)) return true;
  }

  return false;
}

// VEHICLE COLLISION CHECK
// Detects whether a grid coordinate is occupied by a vehicle.
// ignoreVehicleId lets a vehicle avoid colliding with itself while moving.
function isOccupiedByVehicle(x, y, ignoreVehicleId = null) {
  for (const vehicle of getActiveVehicles()) {
    if (vehicle.id === ignoreVehicleId) continue;

    const footprint = getVehicleFootprint(vehicle);

    for (const spot of footprint) {
      if (spot.x === x && spot.y === y) return true;
    }
  }

  return false;
}

// BUILDING COLLISION CHECK
// Uses each building's collision mask to decide if a tile is blocked.
function isOccupiedByBuilding(x, y) {
  for (const building of buildings) {
    if (building.map !== currentMap) continue;

    const localX = x - building.x;
    const localY = y - building.y;

    if (
      localX < 0 ||
      localY < 0 ||
      localX >= building.width ||
      localY >= building.height
    ) {
      continue;
    }

    const row = building.collision[localY];
    const cell = row[localX];

    if (cell === "X") return true;
  }

  return false;
}

// INTERIOR COLLISION CHECK
// Blocks walls and furniture inside blueprint rooms.
function isOccupiedByInteriorTile(x, y) {
  const symbol = BLUEPRINTS[currentMap]?.[y]?.[x];

  if (symbol === "0") return true;
  if (symbol === "W") return true;
  if (symbol === "T") return true;
  if (symbol === "C") return true;
  if (symbol === "B") return true;
  if (symbol === "[") return true;
  if (symbol === "F") return true;
  if (symbol === "U") return true;
  if (symbol === "R") return true;
  if (symbol === "p") return true;
  if (symbol === "K") return true;
  if (symbol === "k") return true;
  if (symbol === "b") return true;
  if (symbol === "e") return true;
  if (symbol === "L") return true;
  if (symbol === "S") return true;
  if (symbol === "Z") return true;
  if (symbol === "#") return true;
  if (symbol === "%") return true;

  return false;
}

// ADJACENCY CHECK
// Used for interacting with NPCs, vehicles, phones, and terminals.
function areAdjacent(aX, aY, bX, bY) {
  return Math.abs(aX - bX) + Math.abs(aY - bY) === 1;
}

// CAMERA FOLLOW SYSTEM
// Keeps the visible camera centered on the player or active vehicle.
function updateCamera() {
  const camera = document.getElementById("camera");

  const viewW = camera.clientWidth;
  const viewH = camera.clientHeight;

  const mapW = getActiveWidth() * TILE_SIZE;
  const mapH = getActiveHeight() * TILE_SIZE;

  let targetX;
  let targetY;

  if (mode === "driving" && currentVehicle) {
    targetX = currentVehicle.x * TILE_SIZE + (currentVehicle.width * TILE_SIZE) / 2;
    targetY = currentVehicle.y * TILE_SIZE + (currentVehicle.height * TILE_SIZE) / 2;
  } else {
    targetX = player.x * TILE_SIZE + TILE_SIZE / 2;
    targetY = player.y * TILE_SIZE + TILE_SIZE / 2;
  }

  let camX = targetX - viewW / 2;
  let camY = targetY - viewH / 2;

  camX = Math.max(0, Math.min(camX, Math.max(0, mapW - viewW)));
  camY = Math.max(0, Math.min(camY, Math.max(0, mapH - viewH)));

  game.style.transform = `translate(${-camX}px, ${-camY}px)`;
}

// PHONE PROXIMITY CHECK
// Returns true when the player is adjacent to an interior phone tile.
function playerIsBesidePhone() {
  const checks = [
    { x: player.x, y: player.y - 1 },
    { x: player.x, y: player.y + 1 },
    { x: player.x - 1, y: player.y },
    { x: player.x + 1, y: player.y }

  for (const spot of checks) {
    if (!inBounds(spot.x, spot.y)) continue;

    const symbol = BLUEPRINTS[currentMap]?.[spot.y]?.[spot.x];

  return false;
}

// PHONE MAIN MENU INPUT
// Handles arrow/E/B controls while the phone main menu is open.
function handleMainPhoneMenu(key) {
  if (key === "arrowup") {
    phoneMenuIndex = Math.max(0, phoneMenuIndex - 1);
    drawPhoneOverlay();
    return;
  }

  if (key === "arrowdown") {
    phoneMenuIndex = Math.min(phoneOptions.length - 1, phoneMenuIndex + 1);
    drawPhoneOverlay();
    return;
  }

  if (key === "e") {
  const option = phoneOptions[phoneMenuIndex];

  if (option === "Hang Up") {
    closePhoneOverlay();
    return;
  }

  if (option === "Vehicle Requests") {
    openVehicleRequestMenu();
    return;
  }

  if (option === "Transit Schedule") {
    closePhoneOverlay();

    showBubble(
      "TRANSIT SCHEDULE",
      "No buses are currently scheduled. Buses no longer stop at this facility."
    );

    setMessage("Transit service unavailable.");
    return;
  }

  setMessage("Selected: " + option);
  return;
}

  if (key === "b") {
    closePhoneOverlay();
  }
}

// Handles arrow/E/B controls while choosing a vehicle request.
function handleVehicleRequestMenu(key) {
  if (key === "arrowup") {
    vehicleRequestIndex = Math.max(0, vehicleRequestIndex - 1);
    drawVehicleRequestMenu();
    return;
  }

  if (key === "arrowdown") {
    vehicleRequestIndex = Math.min(vehicleRequestOptions.length - 1, vehicleRequestIndex + 1);
    drawVehicleRequestMenu();
    return;
  }

  if (key === "b") {
    phoneScreen = "main";
    drawPhoneOverlay();
    return;
  }

  if (key !== "e") return;

  const option = vehicleRequestOptions[vehicleRequestIndex];

  if (option === "Back") {
    phoneScreen = "main";
    drawPhoneOverlay();
    return;
  }

  if (option === "White Fang Snowmobile") {

// VEHICLE DELIVERY REQUEST
// Moves an existing vehicle to a delivery spot outside the SCMF.
function requestVehicle(vehicleId) {
  const vehicle = getVehicleById(vehicleId);

  if (!vehicle) {
    setMessage("Vehicle request failed. Unit not found.");
    return;
  }

  if (currentVehicle && currentVehicle.id === vehicle.id) {
    setMessage("That vehicle is already in use.");
    return;
  }

  const deliverySpots = {
    "wf-snowmobile": {
      x: 8,
      y: 11,
      facing: "right",
      width: 2,
      height: 1
    },
    "green-snowmobile-6": {
      x: 11,
      y: 11,
      facing: "right",
      width: 2,
      height: 1
    },
    "wf-operator": {
      x: 14,
      y: 11,
      facing: "down",
      width: 2,
      height: 2
    }
  };

  const spot = deliverySpots[vehicleId];

  vehicle.occupied = false;
  vehicle.npcDriven = false;
  vehicle.x = spot.x;
  vehicle.y = spot.y;
  vehicle.facing = spot.facing;
  vehicle.width = spot.width;

// Converts x/y map coordinates into the matching HTML tile element.
function getTile(x, y) {

// SPRITE DRAW HELPER
// Adds a single image layer to a tile.
function addImageToTile(x, y, src, className = "sprite") {
  if (!inBounds(x, y)) return;

  const tile = getTile(x, y);
  if (!tile) return;

  const sprite = document.createElement("div");
  sprite.className = className;
  sprite.style.backgroundImage = `url("${src}")`;
  tile.appendChild(sprite);
}

function drawNpcs() {
  for (const npc of npcs) {

function drawResidents() {

  }
}

// NPC / RESIDENT COLLISION
function isOccupiedByNpcOrResident(x, y) {
  for (const npc of npcs) {
    if (!npc.visible) continue;
    if (npc.map !== currentMap) continue;

    if (npc.x === x && npc.y === y) return true;
  }

  for (const resident of RESIDENTS) {
    if (resident.visible === false) continue;
    if (resident.map !== currentMap) continue;

    if (resident.x === x && resident.y === y) return true;
  }

  return false;
}

function canResidentVehicleMove(car, nextX, nextY) {
  const map = OUTSIDE_MAPS[car.map];

  if (!map) return false;

  for (let y = nextY; y < nextY + car.height; y++) {
    for (let x = nextX; x < nextX + car.width; x++) {
      if (y < 0 || y >= map.length) return false;
      if (x < 0 || x >= map[0].length) return false;

      const tile = map[y][x];

      if (tile === "@") return false;
      if (tile === "X") return false;
      if (tile === "W") return false;
      if (tile === "D") return false;
      if (tile === "P") return false;
      if (tile === "p") return false;

      if (isOccupiedByVehicle(x, y, car.id)) return false;
    }
  }

  return true;
}

function tryFaceResidentVehicle(car, newFacing) {
  const oldFacing = car.facing;
  const oldWidth = car.width;
  const oldHeight = car.height;

  car.facing = newFacing;
  updateVehicleSizeForFacing(car);

  if (canResidentVehicleMove(car, car.x, car.y)) {
    return true;
  }

  car.facing = oldFacing;
  car.width = oldWidth;
  car.height = oldHeight;
  return false;
}

function updateVehicleSizeForFacing(vehicle) {
  if (vehicle.type === "rs2") {
    if (vehicle.facing === "left" || vehicle.facing === "right") {
      vehicle.width = 4;
      vehicle.height = 3;
    }

    if (vehicle.facing === "up" || vehicle.facing === "down") {
      vehicle.width = 3;
      vehicle.height = 4;
    }
  }

  if (vehicle.type === "trackedCar") {
    if (vehicle.facing === "left" || vehicle.facing === "right") {
      vehicle.width = 3;
      vehicle.height = 2;
    }

    if (vehicle.facing === "up" || vehicle.facing === "down") {
      vehicle.width = 2;
      vehicle.height = 3;
    }
  }
}

function handleNpcVehicleBlocked(npc, waitState = "waitingToMove", retryState = "drivingBack", giveUpState = "drivingAround") {
  npc.state = waitState;
  npc.retryState = retryState;
  npc.giveUpState = giveUpState;
  npc.timer = 0;
  return true;
}

function moveYetiBats() {
  if (gameMode !== "playing") return;
  if (currentMap !== "outside") return;

  for (const bat of yetiBats) {
    bat.timer--;

    // PERCHED: sit still until timer runs out
    if (bat.state === "perched") {
      if (bat.timer > 0) continue;

      bat.state = "flying";
      bat.timer = 8 + Math.floor(Math.random() * 8);
      continue;
    }

    // RETURNING: fly back home one tile at a time
    if (bat.state === "returning") {
      if (bat.x === bat.homeX && bat.y === bat.homeY) {
        bat.state = "perched";
        bat.timer = 6 + Math.floor(Math.random() * 10);
        continue;
      }

      if (bat.x < bat.homeX) {
        bat.x++;
        bat.facing = "right";
      } else if (bat.x > bat.homeX) {
        bat.x--;
        bat.facing = "left";
      } else if (bat.y < bat.homeY) {
        bat.y++;
        bat.facing = "down";
      } else if (bat.y > bat.homeY) {
        bat.y--;
        bat.facing = "up";
      }

      continue;
    }

    // FLYING: wander until timer runs out
    if (bat.state === "flying") {
      if (bat.timer <= 0) {
        bat.state = "returning";
        continue;
      }

      const directions = [
        { dx: 0, dy: -1, facing: "up" },
        { dx: 0, dy: 1, facing: "down" },
        { dx: -1, dy: 0, facing: "left" },
        { dx: 1, dy: 0, facing: "right" }
      ];

      const choice = directions[Math.floor(Math.random() * directions.length)];

      const nextX = bat.x + choice.dx;
      const nextY = bat.y + choice.dy;

      const distanceFromHome =
        Math.abs(nextX - bat.homeX) + Math.abs(nextY - bat.homeY);

      if (distanceFromHome > 5) continue;
if (!inBounds(nextX, nextY)) continue;
if (isOccupiedByVehicle(nextX, nextY)) continue;

      bat.x = nextX;
      bat.y = nextY;
      bat.facing = choice.facing;
    }
  }

  drawGame();
}

      cruk.state = "reactingToPhaylDefeat";
    }

    return true;
  }

  return false;
}

function updateVerkos(verkos) {

if (verkos.state === "waitingToMove") {
  const car = getResidentVehicle(verkos);
  if (!car) return false;

  // wait too long, then circle around and try again later
  if (verkos.timer > 120) {
    verkos.state = verkos.giveUpState || "drivingAround";
    verkos.timer = 0;
    return true;
  }

  // wait a bit, then try original route again
  if (verkos.timer > 30) {
    verkos.state = verkos.retryState || "drivingBack";
    verkos.timer = 0;
    return true;
  }

  return true;
}

if (verkos.state === "inside") {

  if (!verkosCanLeaveForCar) {
    return false;
  }

  if (verkos.timer > 30) {
    verkos.visible = true;
    verkos.pathIndex = 0;
    verkos.state = "walkingToExit";
    verkos.timer = 0;
    return true;
  }

  return false;
}

  if (verkos.state === "walkingToExit") {
  if (verkos.x < 3) verkos.x++;
  else if (verkos.x > 3) verkos.x--;
  else if (verkos.y < 7) verkos.y++;
  else if (verkos.y > 7) verkos.y--;
  else {
  verkos.state = "exitingFacility";
  verkos.timer = 0;
  return true;
}

  return true;
}

if (verkos.state === "exitingFacility") {
  verkos.map = "restpointWest";
  verkos.x = 25;
  verkos.y = 5;
  verkos.pathIndex = 0;
  verkos.state = "walkingToCar";
  verkos.timer = 0;
  return true;
}

  if (verkos.state === "walkingToCar") {
    const target = verkos.path[verkos.pathIndex];

    if (!target) {
      verkos.visible = false;
      verkos.state = "drivingAway";
      verkos.timer = 0;
      verkos.pathIndex = 0;
      return true;
    }

    if (verkos.x < target.x) verkos.x++;
    else if (verkos.x > target.x) verkos.x--;
    else if (verkos.y < target.y) verkos.y++;
    else if (verkos.y > target.y) verkos.y--;
    else verkos.pathIndex++;

    return true;
  }

  // keep your drivingAway / away / drivingBack / outsideReturned blocks here


if (verkos.state === "drivingAway") {
  const car = getResidentVehicle(verkos);
  if (!car) return false;

  verkos.state = "drivingAround";
  verkos.timer = 0;
  return true;
}

if (verkos.state === "drivingAround") {
  const car = getResidentVehicle(verkos);
  if (!car) return false;

  if (verkos.timer % 8 === 0) {
  const choices = ["left", "right", "up", "down"];
  const choice = choices[Math.floor(Math.random() * choices.length)];
  tryFaceResidentVehicle(car, choice);
}



if (car.facing === "left") {
  if (canResidentVehicleMove(car, car.x - 1, car.y)) {
    car.x--;
    spendNpcVehicleFuel(car);
  }
}
else if (car.facing === "right") {
  if (canResidentVehicleMove(car, car.x + 1, car.y)) {
    car.x++;
    spendNpcVehicleFuel(car);
  }
}
else if (car.facing === "up") {
  if (canResidentVehicleMove(car, car.x, car.y - 1)) {
    car.y--;
    spendNpcVehicleFuel(car);
  }
}
else if (car.facing === "down") {
  if (canResidentVehicleMove(car, car.x, car.y + 1)) {
    car.y++;
    spendNpcVehicleFuel(car);
  }
}

  if (verkos.timer > 120) {
    verkos.state = "drivingBack";
    verkos.timer = 0;
  }

  return true;
}

if (verkos.state === "drivingBack") {
  const car = getResidentVehicle(verkos);
  if (!car) return false;

  const parkingSpot = { x: 17, y: 2 };

  let moved = false;

  if (car.x < parkingSpot.x) {
    if (tryFaceResidentVehicle(car, "right") && canResidentVehicleMove(car, car.x + 1, car.y)) {
      car.x++;
      moved = true;
    }
  }
  else if (car.x > parkingSpot.x) {
    if (tryFaceResidentVehicle(car, "left") && canResidentVehicleMove(car, car.x - 1, car.y)) {
      car.x--;
      moved = true;
    }
  }
  else if (car.y < parkingSpot.y) {
    if (tryFaceResidentVehicle(car, "down") && canResidentVehicleMove(car, car.x, car.y + 1)) {
      car.y++;
      moved = true;
    }
  }
  else if (car.y > parkingSpot.y) {
    if (tryFaceResidentVehicle(car, "up") && canResidentVehicleMove(car, car.x, car.y - 1)) {
      car.y--;
      moved = true;
    }
  }
  else {
    car.facing = "left";
    updateVehicleSizeForFacing(car);

    verkos.visible = true;
    verkos.map = "restpointWest";
    verkos.x = 18;
    verkos.y = 4;

    verkos.state = "walkingBack";
    verkos.timer = 0;
    return true;
  }

  // If blocked while trying to return, try a little wiggle instead of freezing.
if (!moved) {
  verkos.state = "drivingAround";
  verkos.timer = 0;
  return true;
}  

  return true;
}

// not currently in use but maybe useful for HONK IF BLOCKED code

if (verkos.state === "waitingToPark") {
  const car = getResidentVehicle(verkos);
  if (!car) return false;

  const parkingSpot = { x: 17, y: 2 };

  // face the parking direction while waiting
  car.facing = "left";
  updateVehicleSizeForFacing(car);

  if (verkos.timer > 30) {
    if (isParkingSpotFreeFor(car, parkingSpot)) {
      verkos.state = "drivingBack";
      verkos.timer = 0;
    }
  }

  // after waiting too long, give up and drive around again
  if (verkos.timer > 120) {
    verkos.state = "drivingAround";
    verkos.timer = 0;
  }

  return true;
}

if (verkos.state === "walkingBack") {
  const target = { x: 25, y: 5 };

  if (verkos.x < target.x && canResidentStep(verkos, verkos.x + 1, verkos.y)) verkos.x++;
  else if (verkos.x > target.x && canResidentStep(verkos, verkos.x - 1, verkos.y)) verkos.x--;
  else if (verkos.y < target.y && canResidentStep(verkos, verkos.x, verkos.y + 1)) verkos.y++;
  else if (verkos.y > target.y && canResidentStep(verkos, verkos.x, verkos.y - 1)) verkos.y--;
  else if (verkos.x === target.x && verkos.y === target.y) {
    verkos.visible = false;
    verkos.state = "outsideReturned";
    verkos.timer = 0;
  }

  return true;
}

if (verkos.state === "outsideReturned") {

}


if (verkos.state === "walkingToTable") {

  else if (verkos.x > target.x && canResidentStep(verkos, verkos.x - 1, verkos.y)) verkos.x--;
  else if (verkos.y < target.y && canResidentStep(verkos, verkos.x, verkos.y + 1)) verkos.y++;
  else if (verkos.y > target.y && canResidentStep(verkos, verkos.x, verkos.y - 1)) verkos.y--;
  else if (verkos.x === target.x && verkos.y === target.y) {

  }

  return true;
}
return false;

// PLAYER WALKING MOVEMENT
// Handles walking, facing direction, boundary checks, vehicle/building blocking,
// barrel blocking, checkpoint dialogue, and final position update.


function movePlayer(dx, dy, direction) {
  hideBubble();
  player.facing = direction;

  const nextX = player.x + dx;
  const nextY = player.y + dy;

  if (!inBounds(nextX, nextY)) {
    setMessage("The snowfield boundary blocks the way.");
    drawGame();
    return;
  }

const nextSymbol = getActiveMap()[nextY]?.[nextX];

if (OUTSIDE_MAPS[currentMap]) {
  if (nextSymbol === "W") {
    if (currentMap === "outside") {
      transferPlayerToMap("restpointWest", 25, 13, direction);
      return;
    }

    if (currentMap === "restpointWest") {
      transferPlayerToMap("outside", 4, 12, direction);
      return;
    }
  }

  if (nextSymbol === "N") {
    if (currentMap === "restpointWest") {
      transferPlayerToMap("westernNothing", 25, 13, direction);
      return;
    }

    if (currentMap === "westernNothing") {
      transferPlayerToMap("restpointWest", 4, 12, direction);
      return;
    }
  }

  if (nextSymbol === "S") {
    if (currentMap === "restpointWest") {
      transferPlayerToMap("southRoute", 20, 1, direction);
      return;
    }

    if (currentMap === "southRoute") {
      transferPlayerToMap("restpointWest", 20, 20, direction);
      return;
    }
  }

  if (nextSymbol === "R") {
    if (currentMap === "outside") {
      transferPlayerToMap("roadMap", 4, 12, direction);
      return;
    }

    if (currentMap === "roadMap") {
      transferPlayerToMap("outside", 25, 12, direction);
      return;
    }
  }
}

  if (isOccupiedByNpcOrResident(nextX, nextY)) {
    setMessage("Someone blocks the way.");
    drawGame();
    return;
  }

  if (OUTSIDE_MAPS[currentMap] && isOccupiedByVehicle(nextX, nextY)) {
    setMessage("Vehicle here. Press E beside it to interact.");
    drawGame();
    return;
  }

  if (OUTSIDE_MAPS[currentMap] && isOccupiedByBuilding(nextX, nextY)) {
    setMessage("A building blocks the way.");
    drawGame();
    return;
  }

  if (!OUTSIDE_MAPS[currentMap] && nextSymbol === "%") {
    setMessage("Sign reads: No Entry.");
    drawGame();
    return;
  }


  if (!OUTSIDE_MAPS[currentMap] && isOccupiedByInteriorTile(nextX, nextY)) {
    setMessage("Interior object blocks the way.");
    drawGame();
    return;
  }

  if (OUTSIDE_MAPS[currentMap] && nextSymbol === "@") {
    setMessage("A barrel blocks the way.");
    drawGame();
    return;
  }

  if (
  OUTSIDE_MAPS[currentMap] &&
  (nextSymbol === "P" || nextSymbol === "p")
) {
  setMessage("There's a tree here.");
  drawGame();
  return;
}

  player.x = nextX;
  player.y = nextY;

const symbol = BLUEPRINTS[currentMap]?.[player.y]?.[player.x];

if (symbol === "E" && currentMap === "restpointWestFacility") {
  enterBlueprintRoom("acquisitionOffice", 1, player.y + 1, "right");
  return;
}

if (symbol === "E" && currentMap === "acquisitionOffice") {
  enterBlueprintRoom("restpointWestFacility", 8, player.y - 1, "left");
  return;
}

  npcPortraitHasShown = false;

  drawGame();
}

// AUTOMATED SNOW BUS ROUTE TIMER
// Runs the unattended snowbus loop between outside and roadMap.
let snowbusRouteTimer = null;

// START AUTOMATED SNOW BUS ROUTE
// Moves snowbus-1 across its route unless the player is occupying it.
function startSnowbusRoute() {
  if (snowbusRouteTimer) clearInterval(snowbusRouteTimer);

  snowbusRouteTimer = setInterval(() => {
    const bus = getVehicleById("snowbus-1");
    if (!bus) return;
    if (bus.occupied) return;

    bus.facing = "right";
    bus.width = 4;
    bus.height = 2;

    const nextX = bus.x + 1;
    const nextY = bus.y;

    // OUTSIDE: drive into ROAD_MAP portal
    if (bus.map === "outside" || currentMap === "outside") {
      if (nextX >= MAP_WIDTH - 4) {
        moveVehicleToMap(bus, "roadMap", 8, 12, "right", 4, 2);
        drawGame();
        return;
      }

      if (currentMap === "outside" && canVehicleMove(bus, nextX, nextY, 4, 2)) {
        bus.x = nextX;
        bus.y = nextY;
        drawGame();
      }

      return;
    }

    // ROAD_MAP: drive across highway, then loop back to outside
    if (bus.map === "roadMap" || currentMap === "roadMap") {
      if (nextX >= MAP_WIDTH - 4) {
        moveVehicleToMap(bus, "outside", 0, 12, "right", 4, 2);
        drawGame();
        return;
      }

      if (currentMap === "roadMap" && canVehicleMove(bus, nextX, nextY, 4, 2)) {
        bus.x = nextX;
        bus.y = nextY;
        drawGame();
      }

      return;
    }
  }, 500);
}

// VEHICLE ROTATION SIZE RULES
// Multi-tile vehicles change width/height depending on facing direction.
function getVehicleSizeForDirection(vehicle, direction) {

if (vehicle.type === "rs2") {
  if (direction === "left" || direction === "right") {
    return { width: 4, height: 3 };
  }

  return { width: 3, height: 4 };
}

 if (vehicle.type === "trackedCar") {
  if (direction === "left" || direction === "right") {
    return { width: 3, height: 2 };
  }

  if (direction === "up" || direction === "down") {
    return { width: 2, height: 3 };
  }
}
 
  if (vehicle.type === "rs1") {
  if (direction === "left" || direction === "right") {
    return { width: 6, height: 3 };
  }

  if (direction === "up" || direction === "down") {
    return { width: 3, height: 6 };
  }
}

  if (vehicle.type === "snowbus") {
  if (direction === "left" || direction === "right") {
    return { width: 4, height: 2 };
  }

  if (direction === "up" || direction === "down") {
    return { width: 2, height: 4 };
  }
}
  
  if (vehicle.type === "operator") {
    return { width: 2, height: 2 };
  }

  if (vehicle.type === "snowmobile") {
    if (direction === "left" || direction === "right") {
      return { width: 2, height: 1 };
    }

    if (direction === "up" || direction === "down") {
      return { width: 1, height: 2 };
    }
  }

  return { width: vehicle.width, height: vehicle.height };
}

// NPC VEHICLE ROAMING CHOICE
// Finds a random legal next move for an NPC-driven vehicle.
function pickNpcVehicleMove(vehicle) {
  const directions = [
    { dx: 0, dy: -1, facing: "up" },
    { dx: 0, dy: 1, facing: "down" },
    { dx: -1, dy: 0, facing: "left" },
    { dx: 1, dy: 0, facing: "right" }
  ];

  const legalMoves = [];

  for (const dir of directions) {
    const size = getVehicleSizeForDirection(vehicle, dir.facing);
    const nextX = vehicle.x + dir.dx;
    const nextY = vehicle.y + dir.dy;

    if (canVehicleMove(vehicle, nextX, nextY, size.width, size.height)) {
      legalMoves.push({
        x: nextX,
        y: nextY,
        facing: dir.facing,
        width: size.width,
        height: size.height
      });
    }
  }

  if (legalMoves.length === 0) return null;

  return legalMoves[Math.floor(Math.random() * legalMoves.length)];
}

// vanish Kigh's demo snowmobile

// DEALER DEMO ROAM STATE
// Controls the Unrecognizer dealer's post-demo snowmobile wandering.
let dealerRoamTimer = null;

let dealerRoamDirection = "left";
let dealerRoamStepsLeft = 4;

// START DEALER FREE ROAM
// After the scripted demo, Kigh's snowmobile wanders around the snowfield.
function startDealerFreeRoam(snowmobile) {
  if (dealerRoamTimer) clearInterval(dealerRoamTimer);

  dealerRoamTimer = setInterval(() => {
    if (currentMap !== "outside") return;

    const dir = directionToDelta(dealerRoamDirection);
    const size = getVehicleSizeForDirection(snowmobile, dealerRoamDirection);

    const nextX = snowmobile.x + dir.dx;
    const nextY = snowmobile.y + dir.dy;

    if (
      dealerRoamStepsLeft > 0 &&
      canVehicleMove(snowmobile, nextX, nextY, size.width, size.height)
    ) {
      snowmobile.x = nextX;
      snowmobile.y = nextY;
      snowmobile.facing = dealerRoamDirection;
      snowmobile.width = size.width;
      snowmobile.height = size.height;

      dealerRoamStepsLeft--;
      drawGame();
      return;
    }

    const nextMove = pickNpcVehicleMove(snowmobile);

    if (!nextMove) return;

    dealerRoamDirection = nextMove.facing;
    dealerRoamStepsLeft = 3 + Math.floor(Math.random() * 5);

    snowmobile.x = nextMove.x;
    snowmobile.y = nextMove.y;
    snowmobile.facing = nextMove.facing;
    snowmobile.width = nextMove.width;
    snowmobile.height = nextMove.height;

    dealerRoamStepsLeft--;

    drawGame();
  }, 700);
}

// VEHICLE COLLISION / MOVEMENT VALIDATION
// Checks whether every tile in a vehicle's next footprint is legal.
function canVehicleMove(vehicle, nextX, nextY, nextWidth, nextHeight) {
  for (let yy = 0; yy < nextHeight; yy++) {
    for (let xx = 0; xx < nextWidth; xx++) {
      const checkX = nextX + xx;
      const checkY = nextY + yy;

      if (!inBounds(checkX, checkY)) return false;
      if (isOccupiedByVehicle(checkX, checkY, vehicle.id)) return false;
      if (OUTSIDE_MAPS[currentMap] && isOccupiedByBuilding(checkX, checkY)) return false;

      const symbol = getActiveMap()[checkY]?.[checkX];

      if (
        OUTSIDE_MAPS[currentMap] &&
        (symbol === "@" || symbol === "P" || symbol === "p")
      ) {
        return false;
      }
    }
  }

  return true;
}

// PLAYER VEHICLE MOVEMENT with REVERSE MODE
// Moves the currently driven vehicle, including snowbus checkpoint transfers.
function moveCurrentVehicle(dx, dy, direction) {
  hideBubble();

  const vehicle = currentVehicle;

  const reversing =
  vehicle.type !== "snowmobile" &&
  isOppositeDirection(vehicle.facing, direction);

  const visualFacing = reversing
    ? vehicle.facing
    : direction;

  const newSize = getVehicleSizeForDirection(vehicle, visualFacing);

  const nextX = vehicle.x + dx;
  const nextY = vehicle.y + dy;

  const nextSymbol = getActiveMap()[nextY]?.[nextX];

// SNOW BUS ONLY: SCMF checkpoint route
if (vehicle.type === "snowbus" && nextSymbol === "R") {
  if (currentMap === "outside") {
    transferSnowbusToRoadMap();
    return;
  }

  if (currentMap === "roadMap") {
    transferSnowbusToScmf();
    return;
  }
}

// ANY VEHICLE: outside <-> restpointWest
if (nextSymbol === "W") {
  if (currentMap === "outside") {
    transferVehicleToRestpointWest(vehicle);
    return;
  }

  if (currentMap === "restpointWest") {
    transferVehicleToOutsideFromRestpoint(vehicle);
    return;
  }
}

// ANY VEHICLE: restpointWest <-> westernNothing
if (nextSymbol === "N") {
  if (currentMap === "restpointWest") {
    transferVehicleToWesternNothing(vehicle);
    return;
  }

  if (currentMap === "westernNothing") {
    transferVehicleToRestpointWestFromNothing(vehicle);
    return;
  }
}

// ANY VEHICLE: restpointWest <-> southRoute
if (nextSymbol === "S") {
  if (currentMap === "restpointWest") {
    transferVehicleToSouthRoute(vehicle);
    return;
  }

  if (currentMap === "southRoute") {
    transferVehicleToRestpointWestFromSouthRoute(vehicle);
    return;
  }
}

  if (!canVehicleMove(vehicle, nextX, nextY, newSize.width, newSize.height)) {
    setMessage("The vehicle cannot move there.");
    drawGame();
return;
  }

if (!spendPlayerVehicleFuel(vehicle)) {
  drawGame();
  return;
}

vehicle.x = nextX;
vehicle.y = nextY;
vehicle.facing = visualFacing;
vehicle.width = newSize.width;
vehicle.height = newSize.height;
vehicle.reversing = reversing;

if (vehicle.type === "trackedCar" && vehicle.model === "car-1") {
  CAR1_ENGINE_REV.pause();
  CAR1_ENGINE_REV.currentTime = 0;
  CAR1_ENGINE_REV.play();
}


  setMessage("Driving " + vehicle.name + ". Fuel: " + getFuelPercent(vehicle) + "%.");
  drawGame();
}

// BUILDING DOOR DETECTION
// Checks if the player is standing on a building collision cell marked as a door.
function getBuildingDoorAtPlayer() {
  for (const building of buildings) {
    if (building.map !== currentMap) continue;

    const localX = player.x - building.x;
    const localY = player.y - building.y;

    if (
      localX < 0 ||
      localY < 0 ||
      localX >= building.width ||
      localY >= building.height
    ) {
      continue;
    }

    const cell = building.collision[localY][localX];
    if (cell === "D") return building;
  }

  return null;
}
// VEHICLE INTERACTION RANGE
// Checks if the player is adjacent to any tile in a vehicle footprint.
function playerIsBesideVehicle(vehicle) {
  const footprint = getVehicleFootprint(vehicle);

  for (const spot of footprint) {
    if (areAdjacent(player.x, player.y, spot.x, spot.y)) return true;
  }

  return false;
}

// FIND FUEL PUMP VEHICLE

function getVehicleNearFuelPump(pumpSpot, radius = 5) {
  for (const vehicle of getActiveVehicles()) {
    if (vehicle.map !== currentMap) continue;

    const dx = Math.abs(vehicle.x - pumpSpot.x);
    const dy = Math.abs(vehicle.y - pumpSpot.y);

    if (dx + dy <= radius) {
      return vehicle;
    }
  }

  return null;
}

// FIND FUEL PUMP
function getAdjacentFuelPumpSpot() {
  const checks = [
    { x: player.x, y: player.y - 1 },
    { x: player.x, y: player.y + 1 },
    { x: player.x - 1, y: player.y },
    { x: player.x + 1, y: player.y }
  ];

  for (const spot of checks) {
    if (!inBounds(spot.x, spot.y)) continue;

    if (getActiveMap()[spot.y]?.[spot.x] === "g") {
      return spot;
    }
  }

  return null;
}

// FIND NEARBY VEHICLE
// Returns the first unoccupied vehicle beside the player.
function getAdjacentVehicle() {
  for (const vehicle of getActiveVehicles()) {
    if (!vehicle.occupied && playerIsBesideVehicle(vehicle)) return vehicle;
  }

  return null;
}

// FIND NEARBY NPC
// Returns the first visible NPC beside the player on the current map.
function getAdjacentNpc() {
  for (const npc of npcs) {
    if (!npc.visible) continue;
    if (npc.map !== currentMap) continue;

    if (areAdjacent(player.x, player.y, npc.x, npc.y)) return npc;
  }

  return null;
}

function getAdjacentResident() {
  for (const resident of RESIDENTS) {
    if (resident.visible === false) continue;
    if (resident.map !== currentMap) continue;

    if (areAdjacent(player.x, player.y, resident.x, resident.y)) {
      return resident;
    }
  }

  return null;
}

// update sda personnel carrier

  function updateSdaTransport() {
  if (!sdaTransportEventStarted) return false;

  const vehicle = getVehicleById("sda-transport-1");
  if (!vehicle) return false;
  if (vehicle.deployed) return false;

  if (vehicle.map === "restpointWest") {
    vehicle.x++;
    vehicle.facing = "right";

    if (vehicle.x >= 26) {
      moveVehicleToMap(vehicle, "outside", 0, 12, "right", 5, 2);
    }

    return true;
  }

  if (vehicle.map === "outside") {
    vehicle.x++;
    vehicle.facing = "right";

    if (vehicle.x >= 8) {
      vehicle.x = 8;
      vehicle.y = 12;
      vehicle.facing = "right";
      vehicle.state = "parkedAtScmf";

      deploySdaTransportSquad(vehicle);
    }

    return true;
  }

  return false;
}

// Hides the dealer, animates the green snowmobile along a fixed path,
// then hands it over to NPC free-roam behavior.
function startDealerDemo(npc) {
  const snowmobile = getVehicleById("green-snowmobile");

  if (!snowmobile) {
    setMessage("Dealer: The demo unit is missing.");
    return;
  }

  setMessage('Dealer: "Watch this!"');

  npc.visible = false;
  snowmobile.occupied = true;
  snowmobile.npcDriven = true;

  const path = [
  { x: 14, y: 19, facing: "up", width: 1, height: 2 },
  { x: 14, y: 18, facing: "up", width: 1, height: 2 },
  { x: 14, y: 17, facing: "up", width: 1, height: 2 },
  { x: 14, y: 16, facing: "up", width: 1, height: 2 },

  { x: 13, y: 16, facing: "left", width: 2, height: 1 },
  { x: 12, y: 16, facing: "left", width: 2, height: 1 },
  { x: 11, y: 16, facing: "left", width: 2, height: 1 },
  { x: 10, y: 16, facing: "left", width: 2, height: 1 },

  { x: 9, y: 16, facing: "left", width: 2, height: 1 },
  { x: 8, y: 16, facing: "left", width: 2, height: 1 },
  { x: 7, y: 16, facing: "left", width: 2, height: 1 },
  { x: 6, y: 16, facing: "left", width: 2, height: 1 },
  { x: 5, y: 16, facing: "left", width: 2, height: 1 },
  { x: 4, y: 16, facing: "left", width: 2, height: 1 }
];

let step = 0;

const demoTimer = setInterval(() => {
  if (step >= path.length) {
    clearInterval(demoTimer);

    snowmobile.occupied = true;
    snowmobile.npcDriven = true;
    snowmobile.x = 4;
    snowmobile.y = 16;
    snowmobile.facing = "left";
    snowmobile.width = 2;
    snowmobile.height = 1;

    npc.x = 4;
    npc.y = 17;
    npc.visible = false;

    dealerConversationStep = 99;
    setMessage("Kigh finishes the demonstration and keeps roaming the snowfield.");
    drawGame();

    startDealerFreeRoam(snowmobile);
    return;
  }

  const move = path[step];

  snowmobile.x = move.x;
  snowmobile.y = move.y;
  snowmobile.facing = move.facing;
  snowmobile.width = move.width;
  snowmobile.height = move.height;

  step++;
  drawGame();
}, 400);

}

CAR1_ENGINE_IDLE.pause();

// exceptional vehicle car door sound handling for special cases

function vehicleUsesCarDoorSound(vehicle) {
  if (!vehicle) return false;

  if (vehicle.type === "snowmobile") return false;
  if (vehicle.id === "rs-1") return false;

  return true;
}

// ENTER VEHICLE
// Switches from walking mode into driving mode.
function enterVehicle(vehicle) {
  if (
  vehicle.boardable === false &&
  !(
    vehicle.type === "snowmobile" &&
    vehicle.skin === "unrecognizer" &&
    hasItem("zyrUnrecognizerBadge")
  )
) {
  hideBubble();

  if (vehicle.id === "snowbus-1") {
    showBubble(
      "AUTOMATED TRANSIT",
      "This snow bus is not currently accepting passengers here."
    );
  }

  else if (vehicle.id === "rs-1") {
    showBubble(
      "RED SNOW SECURITY",
      "Access denied. Authorized Red Snow operators only."
    );
  }

else if (vehicle.skin === "wf") {
  showBubble(
    "WHITE FANG",
    "This vehicle belongs to the White Fang group. You don't have the clearance."
  );
}

else if (
  vehicle.type === "snowmobile" &&
  vehicle.skin === "unrecognizer"
) {
  showBubble(
    "UNRECOGNIZER PROPERTY",
    "Only authorized Unrecognizer agents may operate these snowmobiles."
  );
}

  else {
    showBubble(
      "VEHICLE SYSTEM",
      "This vehicle cannot be operated."
    );
  }

  return;
}

  mode = "driving";
  currentVehicle = vehicle;

  setupVehicleFuel(vehicle);

  updateVehicleSizeForFacing(vehicle);
  vehicle.occupied = true;

  if (vehicle.ownerId) {
    vehicleRole = "passenger";
    setMessage("You ride as a passenger in " + vehicle.name + ".");
  } else {
    vehicleRole = "driver";
    setMessage("Entered " + vehicle.name + ". Fuel: " + getFuelPercent(vehicle) + "%.");
  }

  if (vehicleUsesCarDoorSound(vehicle)) {
  CAR_DOOR_SOUND.currentTime = 0;
  CAR_DOOR_SOUND.play();
}

  playVehicleIdleSound(vehicle);

  drawGame();
}

// EXIT VEHICLE
// Finds a safe tile beside the vehicle and switches back to walking mode.
function exitVehicle() {
  const vehicle = currentVehicle;
  const exitSpot = findExitSpot(vehicle);

  if (!exitSpot) {
    setMessage("No safe place to exit.");
    console.log("Exit failed:", vehicle);
    return;
  }

  player.x = exitSpot.x;
  player.y = exitSpot.y;
  player.facing = vehicle.facing;

  vehicle.occupied = false;
  stopVehicleIdleSound(vehicle);

  mode = "walking";
  currentVehicle = null;
  vehicleRole = null;

  if (vehicleUsesCarDoorSound(vehicle)) {
  CAR_DOOR_SOUND.currentTime = 0;
  CAR_DOOR_SOUND.play();
}

  setMessage("Exited vehicle.");
  drawGame();
}

// VEHICLE EXIT SPOT LOGIC
// Chooses an exit tile based on the vehicle's facing direction and checks safety.
function findExitSpot(vehicle) {
  let exitSpot;

  if (vehicle.facing === "up") {
    exitSpot = { x: vehicle.x - 1, y: vehicle.y };
  }

  if (vehicle.facing === "left") {
    exitSpot = { x: vehicle.x, y: vehicle.y + vehicle.height };
  }

  if (vehicle.facing === "down") {
    exitSpot = { x: vehicle.x + vehicle.width, y: vehicle.y };
  }

  if (vehicle.facing === "right") {
    exitSpot = { x: vehicle.x, y: vehicle.y - 1 };
  }

  if (!exitSpot) return null;
  if (!inBounds(exitSpot.x, exitSpot.y)) return null;
  if (isOccupiedByVehicle(exitSpot.x, exitSpot.y, vehicle.id)) return null;
  if (currentMap === "outside" && isOccupiedByBuilding(exitSpot.x, exitSpot.y)) return null;

  return exitSpot;
}

// KEYBOARD INPUT CONTROLLER
// Routes all keyboard controls through overlays first, then gameplay movement/actions.
document.addEventListener("keydown", function(event) {
  const key = event.key.toLowerCase();

  if (
  (gameMode === "introCarExterior" || gameMode === "introConsole") &&
  event.key.toLowerCase() === "s"
) {
  skipIntro();
  return;

// intro keys

  event.preventDefault();

  if (key === "e" || key === "enter") {

  return;
}

//NPC PORTRAIT overlay

if (key === "b" && document.getElementById("npcPortraitOverlay")) {
  hideNpcPortrait();
  
  return;
}

if (verkosBadgeChoiceOpen) {
  event.preventDefault();

  if (
    event.key === "ArrowUp" ||

    event.key === "ArrowRight"
  ) {
    verkosBadgeChoiceSelection = verkosBadgeChoiceSelection === 0 ? 1 : 0;
    drawVerkosBadgeChoice();
    return;
  }

  if (key === "e" || key === "enter") {
    handleVerkosBadgeChoice();
    return;
  }

  if (key === "b" || key === "escape") {
    closeVerkosBadgeChoice();
    hideNpcPortrait();
    return;

  return;
}

// NPC Portrait keys

  hideNpcPortrait();
  return;
}

// search NPC menu keys

// keys fuel pump choice

  event.preventDefault();
  handleFuelMenuInput(key);
  return;
}

// keys bolt cutters choice keydown

if (bunkerChoiceOpen) {
  event.preventDefault();
  handleBunkerChoiceInput(key);
  return;
}

// hereo keys keydown using hereo

  event.preventDefault();
  handleHereoInput(key);
  return;
}

if (viewingPopcornStand) {
  if (key === "b" || key === "e") {
    closePopcornOverlay();
  }
  return;
}

// computer keys

if (usingComputer) {
  handleComputerInput(key, event);
  return;
}

if (viewingFoodDispenser) {
  if (key === "b" || key === "e") {
    closeFoodOverlay();
  }
  return;
}

if (viewingInventory) {
  event.preventDefault();

  if (key === "arrowup") {
    inventorySelection--;

    if (inventorySelection < 0) {
      inventorySelection = inventory.length - 1;
    }

    redrawInventoryOverlay();
    return;
  }

  if (key === "arrowdown") {
    inventorySelection++;

    if (inventorySelection >= inventory.length) {
      inventorySelection = 0;
    }

    redrawInventoryOverlay();
    return;
  }

  if (key === "e" || key === "enter") {
    if (inventory.length > 0) {
      useInventoryItem(inventory[inventorySelection]);
    }
    return;
  }

  if (key === "i" || key === "b" || key === "escape") {
    closeInventoryOverlay();
    return;
  }

  return;
}

if (key === "i") {
  openInventoryOverlay();
  return;
}

if (viewingGearShop) {
  event.preventDefault();
  handleGearShopInput(key);
  return;
}

if (viewingExchange) {
  event.preventDefault();
  handleExchangeInput(key);
  return;
}

  if (usingPhone) {
    handlePhoneInput(key, event);
    return;
  }

if (key === " ") {
  event.preventDefault();

  if (mode !== "walking") {
    setMessage("You can't fire from here.");
    return;
  }

  fireEquippedWeapon();
  return;
}

if (
  key === "arrowup" ||
  key === "arrowdown" ||
  key === "arrowleft" ||
  key === "arrowright"
) {
  event.preventDefault();

  let dx = 0;
  let dy = 0;
  let direction = "";

  if (key === "arrowup") {
    dy = -1;
    direction = "up";
  }

  if (key === "arrowdown") {
    dy = 1;
    direction = "down";
  }

  if (key === "arrowleft") {
    dx = -1;
    direction = "left";
  }

  if (key === "arrowright") {
    dx = 1;
    direction = "right";
  }

  if (mode === "walking") {
    movePlayer(dx, dy, direction);
    return;
  }

  if (mode === "driving") {
  if (vehicleRole === "passenger") {
    const owner = currentVehicle?.ownerId
      ? getResidentById(currentVehicle.ownerId)
      : null;

    if (
      owner &&
      owner.vehicleId === currentVehicle.id &&

        owner.state === "drivingAround" ||

        owner.state === "waitingToPark"

    showBubble("VEHICLE SECURITY", "UNAUTHORIZED ACCESS DETECTED.");
    setMessage("You don't have the keys to this vehicle.");
    return;
  }

  moveCurrentVehicle(dx, dy, direction);
  return;
}
}

if (key === "e") {
  interact();
  return;
}

if (key === "b") {
  backAction();
  return;
}
