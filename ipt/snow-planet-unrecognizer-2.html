/* =============================================================
   17. UNIVERSAL OVERLAY SYSTEM

   An option has:
   {
     label: "Readable menu text",
     action: function,
     disabled: false
   }

   The same framework can become a phone, computer, shop, dialogue
   choice, inventory screen, map terminal, or object inspection.
   ============================================================= */

function openOverlay({
  title,
  image = "",
  text = "",
  options = [],
  selectedIndex = 0,
  onClose = null
}) {
  worldState.overlay = {
    open: true,
    title,
    image,
    text,
    options,
    selectedIndex,
    onClose
  };

  hideBubble();
  renderOverlay();
}

function renderOverlay() {
  const state = worldState.overlay;

  universalOverlay.classList.toggle("open", state.open);

  if (!state.open) return;

  const selectedOption = state.options[state.selectedIndex];

const currentImage =
  selectedOption?.image ||
  state.image ||
  "";

const currentText =
  selectedOption?.text ??
  state.text ??
  "";

overlayTitle.textContent = state.title;
overlayText.innerHTML = currentText;

overlayImage.style.backgroundImage =
  currentImage
    ? `url("${currentImage}")`
    : "none";

  overlayOptions.innerHTML = "";

  let selectedRow = null;

state.options.forEach((option, index) => {
  const row = document.createElement("div");

  row.className = "menuOption";
  row.textContent = option.label;

  row.setAttribute("role", "button");
  row.setAttribute("tabindex", option.disabled ? "-1" : "0");

  if (index === state.selectedIndex) {
    row.classList.add("selected");
    selectedRow = row;
  }

  if (option.disabled) {
    row.style.opacity = "0.45";
    row.setAttribute("aria-disabled", "true");
  } else {
    row.addEventListener("pointerup", event => {
      event.preventDefault();

      worldState.overlay.selectedIndex = index;
      confirmOverlaySelection();
    });
  }

  overlayOptions.appendChild(row);
});

if (selectedRow) {
  requestAnimationFrame(() => {
    selectedRow.scrollIntoView({
      block: "nearest",
      behavior: "auto"
    });
  });
}
}

function closeOverlay() {
  const onClose = worldState.overlay.onClose;

  worldState.overlay.open = false;
  universalOverlay.classList.remove("open");

  if (typeof onClose === "function") onClose();
}

function moveOverlaySelection(change) {
  const state = worldState.overlay;
  if (!state.open || state.options.length === 0) return;

  state.selectedIndex += change;

  if (state.selectedIndex < 0) {
    state.selectedIndex = state.options.length - 1;
  }

  if (state.selectedIndex >= state.options.length) {
    state.selectedIndex = 0;
  }

  renderOverlay();
}

function confirmOverlaySelection() {
  const state = worldState.overlay;
  const option = state.options[state.selectedIndex];

  if (!option || option.disabled) return;
  if (typeof option.action === "function") option.action();
}

let bubbleTouchLockedUntil = 0;

function showBubble(speaker, text) {
  bubbleSpeaker.textContent = speaker;
  bubbleText.innerHTML = text;
  bubbleOverlay.style.display = "block";

  // Prevent the same tap that opened the bubble
  // from immediately closing it.
  bubbleTouchLockedUntil = Date.now() + 350;
}

function hideBubble() {
  bubbleOverlay.style.display = "none";
}

bubbleOverlay.addEventListener("click", event => {
  event.preventDefault();

  if (Date.now() < bubbleTouchLockedUntil) {
    return;
  }

  hideBubble();
});

function getAvailableUnrecognizerTransmissions() {
  return UNRECOGNIZER_TRANSMISSIONS
    .filter(transmission => transmission.isAvailable())
    .slice()
    .sort((a, b) => b.order - a.order);
}

function getUnreadUnrecognizerTransmissions() {
  return getAvailableUnrecognizerTransmissions()
    .filter(transmission => {
      return !hasReadUnrecognizerTransmission(
        transmission.id
      );
    });
}

function hasWatchAcknowledgedTransmission(
  transmissionId
) {
  return worldState.transmissionFlags
    .watchAcknowledgedBulletins
    .includes(transmissionId);
}

function getPendingWatchTransmissions() {
  return getUnreadUnrecognizerTransmissions()
    .filter(transmission => {
      return !hasWatchAcknowledgedTransmission(
        transmission.id
      );
    });
}

function acknowledgeCurrentWatchTransmissions() {
  const pendingTransmissions =
    getPendingWatchTransmissions();

  if (pendingTransmissions.length === 0) {
    closeOverlay();

    showBubble(
      "UNRECOGNIZER WATCH",
      "No repeating notifications are currently active."
    );

    return;
  }

  const newestTransmission = pendingTransmissions[0];

  const acknowledgedBulletins =
    worldState.transmissionFlags
      .watchAcknowledgedBulletins;

  if (
    !acknowledgedBulletins.includes(
      newestTransmission.id
    )
  ) {
    acknowledgedBulletins.push(
      newestTransmission.id
    );
  }

  closeOverlay();

  showBubble(
    "UNRECOGNIZER WATCH",
    "Notification acknowledged.<br><br>" +
    "The transmission remains unread at UNRECOGNIZER phones, " +
    "but the watch will not repeat this alert."
  );
}

function resumeCurrentWatchTransmissions() {
  const unreadTransmissionIds =
    getUnreadUnrecognizerTransmissions()
      .map(transmission => transmission.id);

  worldState.transmissionFlags
    .watchAcknowledgedBulletins =
      worldState.transmissionFlags
        .watchAcknowledgedBulletins
        .filter(transmissionId => {
          return !unreadTransmissionIds.includes(
            transmissionId
          );
        });

  worldState.transmissionFlags
    .lastWatchNotificationAt = 0;

  closeOverlay();

  showBubble(
    "UNRECOGNIZER WATCH",
    "Repeating notifications resumed."
  );
}

function updateUnrecognizerWatch() {
  if (!hasItem("unrecognizerWatch")) return;

  const pendingTransmissions =
    getPendingWatchTransmissions();

  if (pendingTransmissions.length === 0) {
    return;
  }

  const now = Date.now();

  const elapsed =
    now -
    worldState.transmissionFlags
      .lastWatchNotificationAt;

  if (
    elapsed <
    UNRECOGNIZER_WATCH_RULES.repeatIntervalMs
  ) {
    return;
  }

  worldState.transmissionFlags
    .lastWatchNotificationAt = now;

  const count = pendingTransmissions.length;

  const noun =
    count === 1
      ? "transmission is"
      : "transmissions are";

  setMessage(
    `The UNRECOGNIZER Watch pulses. ` +
    `${count} unread ${noun} waiting at an ` +
    `UNRECOGNIZER phone.`
  );
}

function hasReadUnrecognizerTransmission(transmissionId) {
  return worldState.transmissionFlags
    .readUnrecognizerBulletins
    .includes(transmissionId);
}

function markUnrecognizerTransmissionRead(
  transmissionId
) {
  const readBulletins =
    worldState.transmissionFlags
      .readUnrecognizerBulletins;

  if (!readBulletins.includes(transmissionId)) {
    readBulletins.push(transmissionId);
  }

  worldState.transmissionFlags
    .watchAcknowledgedBulletins =
      worldState.transmissionFlags
        .watchAcknowledgedBulletins
        .filter(id => id !== transmissionId);
}

function openUnrecognizerWatch() {
  const unreadTransmissions =
    getUnreadUnrecognizerTransmissions();

  const pendingTransmissions =
    getPendingWatchTransmissions();

  const unreadCount =
    unreadTransmissions.length;

  const pendingCount =
    pendingTransmissions.length;

  const options = [];

  if (unreadCount === 0) {
    options.push({
      label: "No transmissions detected",
      disabled: true
    });
  } else if (pendingCount > 0) {
    options.push({
      label: "ACKNOWLEDGE NOTIFICATIONS",
      image: ASSETS.item.unrecognizerWatch,

      text:
  "Silence the newest repeating watch notification.<br><br>" +
  "The transmission will remain unread at " +
  "UNRECOGNIZER phones.",

      action:
        acknowledgeCurrentWatchTransmissions
    });
  } else {
    options.push({
      label: "RESUME NOTIFICATIONS",
      image: ASSETS.item.unrecognizerWatch,

      text:
        "Resume repeating notifications for the " +
        "unread transmissions currently waiting.",

      action:
        resumeCurrentWatchTransmissions
    });
  }

  options.push({
    label: "Close watch",
    action: closeOverlay
  });

  let statusText = "";

  if (unreadCount === 0) {
    statusText =
      "No unread UNRECOGNIZER transmissions detected.";
  } else if (pendingCount === 0) {
    statusText =
      `${unreadCount} unread transmission` +
      `${unreadCount === 1 ? "" : "s"} detected.` +
      "<br><br>" +
      "Repeating notifications have been acknowledged.";
  } else {
    statusText =
      `${unreadCount} unread transmission` +
      `${unreadCount === 1 ? "" : "s"} detected.` +
      "<br><br>" +
      `${pendingCount} currently producing watch alerts.`;
  }

  openOverlay({
    title: "UNRECOGNIZER WATCH",
    image: ASSETS.item.unrecognizerWatch,
    text: statusText,
    options
  });
}

  machinery(interaction) {
  const machine =
    MACHINERY_DEFINITIONS[interaction.symbol];

  if (!machine) {
    setMessage("This machine has no matching definition.");
    return;
  }

  const hasRequirements =
    machine.requirements.every(requirement => {
      const quantityCarried =
        player.inventory.filter(
          itemId => itemId === requirement.itemId
        ).length;

      return quantityCarried >= requirement.quantity;
    });

  const requirementText =
    machine.requirements
      .map(requirement => {
        const item =
          ITEM_DEFINITIONS[requirement.itemId];

        return `${requirement.quantity} × ${
          item?.name || requirement.itemId
        }`;
      })
      .join("<br>");

  openOverlay({
  title: machine.title,
  image: machine.image,

  text:
      `${machine.description}` +
      `<br><br><strong>Required:</strong><br>` +
      requirementText,

    options: [
      {
        label: "Process Materials",

        disabled: !hasRequirements,

        text: hasRequirements
          ? "Place the required materials into the machine."
          : "Yoi is not carrying all required materials.",

        action: () => {
          /*
            Remove the required inputs.
          */
          for (const requirement of machine.requirements) {
            for (
              let count = 0;
              count < requirement.quantity;
              count += 1
            ) {
              removeItem(requirement.itemId);
            }
          }

          /*
            Add the finished outputs.
          */
          for (const output of machine.outputs) {
            for (
              let count = 0;
              count < output.quantity;
              count += 1
            ) {
              const added = addItem(output.itemId);

              if (!added) {
                /*
                  Restore the inputs if the output cannot fit.
                */
                for (const requirement of machine.requirements) {
                  for (
                    let restoreCount = 0;
                    restoreCount < requirement.quantity;
                    restoreCount += 1
                  ) {
                    addItem(requirement.itemId);
                  }
                }

                closeOverlay();

                showBubble(
                  machine.title,
                  "INVENTORY TOO FULL. The materials were not processed."
                );

                return;
              }
            }
          }

          closeOverlay();

          showBubble(
            machine.title,
            machine.processMessage
          );
        }
      },

      {
        label: "Leave",
        action: closeOverlay
      }
    ]
  });
},
