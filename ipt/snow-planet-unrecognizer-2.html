<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNRECOGNIZER II - Atlas Engine Foundation</title>

  <style>
    /* =========================================================
       UNRECOGNIZER II
       ATLAS ENGINE FOUNDATION

       DESIGN GOALS
       ------------
       1. One reusable 8 x 8 atlas of 28 x 28 outside maps.
       2. One registry for assets and reusable object definitions.
       3. Small, readable object instances placed into the world.
       4. Generic player and vehicle movement.
       5. Generic building-stamp and interior-blueprint systems.
       6. One universal overlay framework for images and menus.
       7. Fuel and combat systems retained as reusable foundations.
       ========================================================= */

    :root {
      --tile-size: 64px;
      --camera-width: 960px;
      --camera-height: 520px;

      --ink: #ffffff;
      --orange: #ff8c00;
      --green: #9cff00;
      --blue: #4cc9ff;
      --soft-blue: #b9d7ff;
      --amber: #ffb347;
      --panel: #101820;
      --panel-2: #1d2a33;
      --backdrop: rgba(0, 0, 0, 0.88);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--panel);
      color: var(--ink);
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 12px 0 4px;
      color: var(--orange);
      font-size: 22px;
      letter-spacing: 2px;
      text-align: center;
    }

    #hud {
      margin-bottom: 10px;
      color: var(--green);
      font-size: 14px;
      text-align: center;
    }

    #camera {
      width: var(--camera-width);
      height: var(--camera-height);
      overflow: hidden;
      border: 4px solid var(--orange);
      position: relative;
      background: #cfe8ff;
    }

    #binocularOverlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: none;
  pointer-events: none;
  z-index: 70;
}

#camera.binocular-active #binocularOverlay {
  display: block;
}

    #game {
      display: grid;
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: top left;
    }

    .tile {
      width: var(--tile-size);
      height: var(--tile-size);
      position: relative;
      overflow: visible;
      background-size: var(--tile-size) var(--tile-size);
      background-repeat: no-repeat;
    }

    .entity {
      position: absolute;
      pointer-events: none;
      background-repeat: no-repeat;
      background-position: center;
      image-rendering: pixelated;
    }

    .droppedItemSprite {
  width: var(--tile-size);
  height: var(--tile-size);
  background-size: contain;
  z-index: 14;
}

    .playerSprite {
      width: var(--tile-size);
      height: var(--tile-size);
      background-size: contain;
      z-index: 20;
    }

    .npcSprite {
      width: var(--tile-size);
      height: var(--tile-size);
      background-size: contain;
      z-index: 15;
    }

    .vehicleSprite {
      background-size: 100% 100%;
      z-index: 12;
    }

    .vehiclePiece {
  width: var(--tile-size);
  height: var(--tile-size);
  background-size: 100% 100%;
  background-repeat: no-repeat;
  background-position: center;
  z-index: 12;
}

    .buildingStamp {
      background-size: 100% 100%;
      z-index: 10;
    }

    .projectileSprite {
      width: var(--tile-size);
      height: var(--tile-size);
      background-size: contain;
      z-index: 30;
    }

    #nightOverlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 40;
  background: rgba(0, 20, 55, 0.45);
  display: none;
}

    /* =========================================================
       WEATHER VISUALS
       clear    = overlay hidden
       snow     = slow drifting snowfall
       blizzard = fast, dense, blurred snowfall
       ========================================================= */

    #snowOverlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 45;

  background-repeat: repeat;
  background-image:
    radial-gradient(
      circle,
      rgba(255, 255, 255, 0.95) 1px,
      transparent 2px
    ),
    radial-gradient(
      circle,
      rgba(255, 255, 255, 0.7) 1.5px,
      transparent 2.5px
    ),
    radial-gradient(
      circle,
      rgba(255, 255, 255, 0.45) 2px,
      transparent 3px
    );

  background-size:
    70px 70px,
    115px 115px,
    180px 180px;
}

    #snowOverlay.weather-clear {
  display: none;
}

#snowOverlay.weather-snow {
  display: block;
  opacity: 0.75;
  filter: none;
  animation: snowDrift 9s linear infinite;
}

#snowOverlay.weather-blizzard {
  display: block;
  opacity: 1;
  filter: blur(0.7px);
  background-size:
    45px 45px,
    75px 75px,
    120px 120px;
  animation: blizzardDrift 1.8s linear infinite;
}

#snowOverlay.weather-severe-blizzard {
  opacity: 1;
  filter: blur(1.2px);

  background-size:
    30px 30px,
    50px 50px,
    80px 80px;

  animation:
    severeBlizzardDrift 0.9s linear infinite;

  background-color:
    rgba(235, 245, 255, 0.28);
}

@keyframes severeBlizzardDrift {
  from {
    background-position:
      -400px -80px,
      -250px -120px,
      -100px -160px;
  }

  to {
    background-position:
      1100px 350px,
      1250px 470px,
      1400px 590px;
  }
}

    @keyframes snowDrift {
  from {
    background-position:
      0 0,
      35px -20px,
      80px -40px;
  }

  to {
    background-position:
      120px 420px,
      210px 520px,
      310px 620px;
  }
}

@keyframes blizzardDrift {
  from {
    background-position:
      -200px 0,
      -100px -40px,
      0 -80px;
  }

  to {
    background-position:
      850px 330px,
      950px 430px,
      1050px 530px;
  }
}

   

    #messageBox {
      width: min(95vw, 960px);
      min-height: 30px;
      margin-top: 10px;
      color: var(--amber);
      text-align: center;
      font-size: 15px;
    }

    .instructions {
      width: min(95vw, 960px);
      margin: 8px 0 24px;
      color: var(--soft-blue);
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    /* =========================================================
       UNIVERSAL OVERLAY SYSTEM
       Every machine, terminal, merchant, object, portrait, or
       special interaction may reuse these same classes.
       ========================================================= */

    .gameOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 24px;
      background: var(--backdrop);
    }

    .gameOverlay.open {
      display: flex;
    }

    .overlayImage {
      width: 420px;
      height: 520px;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      image-rendering: pixelated;
    }

    .overlayPanel {
      width: 380px;
      min-height: 420px;
      max-height: 75vh;
      overflow-y: auto;
      border: 4px solid var(--orange);
      background: var(--panel);
      color: var(--green);
      padding: 22px;
    }

    .overlayPanel h2 {
      margin-top: 0;
      color: var(--orange);
      letter-spacing: 2px;
    }

    .overlayText {
      color: var(--soft-blue);
      line-height: 1.45;
    }

    .menuOption {
  padding: 10px;
  margin: 8px 0;
  border: 2px solid #333;
  background: var(--panel-2);
  color: var(--amber);
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

.menuOption:active {
  border-color: var(--green);
  background: #263800;
  color: white;
}

    .menuOption.selected {
      border-color: var(--green);
      background: #263800;
      color: white;
    }

    .overlayHint {
      margin-top: 22px;
      color: var(--soft-blue);
      font-size: 13px;
    }

    #bubbleOverlay {
      position: fixed;
      left: 50%;
      bottom: 60px;
      transform: translateX(-50%);
      z-index: 90;
      display: none;
      width: 720px;
      max-width: 90vw;
      min-height: 90px;
      border: 4px solid var(--orange);
      background: rgba(16, 24, 32, 0.96);
      padding: 18px 22px;
      box-shadow: 0 0 18px #ff00cc;
    }

    #bubbleSpeaker {
      margin-bottom: 8px;
      color: var(--green);
      font-weight: bold;
    }

    #bubbleText {
      color: var(--amber);
      font-size: 20px;
      line-height: 1.35;
    }

    /* =========================================================
   MOBILE TOUCH CONTROLS
   Hidden on ordinary desktop devices.
   Gameplay wiring will be added in the next patch.
   ========================================================= */

#mobileControls {
  display: none;
  width: min(96vw, 960px);
  margin-top: 12px;
  padding: 10px;
  gap: 14px;
  align-items: center;
  justify-content: space-between;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
}

.mobileControlGroup {
  display: flex;
  align-items: center;
  justify-content: center;
}

#mobileAimPad {
  display: grid;
  grid-template-columns: repeat(3, 58px);
  grid-template-rows: repeat(3, 58px);
  gap: 5px;
}

.mobileButton {
  min-width: 58px;
  min-height: 58px;
  border: 3px solid var(--orange);
  border-radius: 10px;
  background: var(--panel-2);
  color: white;
  font: inherit;
  font-size: 21px;
  font-weight: bold;
  text-align: center;
  touch-action: none;
}

/* Permanent diagonal-fire coloring */
.mobileButton.mobileFireDiagonal {
  background: #000;
  color: #ff3333;
  border-color: #ff3333;
}

/* Applied to AIM and straight directions during Aim Mode */
.mobileButton.aimModeActive {
  background: #000;
  color: #ff3333;
  border-color: #ff3333;
}

/* =========================================================
   DRIVING MODE
   Vehicle controls glow teal while driving.
   ========================================================= */

#mobileControls.driving .mobileButton:not(.mobileFireDiagonal) {
  background: #006d73;
  border-color: #00d4d4;
  color: #ffffff;
}

/*
  Keep diagonal fire buttons red while walking.

  When driving, they become teal because they now move
  the vehicle instead of always firing.
*/
#mobileControls.driving .mobileFireDiagonal {
  background: #006d73;
  border-color: #00d4d4;
  color: #ffffff;
}

/* Aim Mode always wins visually. */

#mobileControls .mobileButton.aimModeActive {
  background: #000;
  color: #ff3333;
  border-color: #ff3333;
}

.mobileButton:active {
  transform: scale(0.94);
  background: #263800;
  border-color: var(--green);
}

.mobileDpadSpacer {
  width: 58px;
  height: 58px;
}

#mobileActionButtons {
  display: grid;
  grid-template-columns: repeat(2, minmax(72px, 1fr));
  gap: 8px;
}

.mobileActionButton {
  min-width: 72px;
  min-height: 52px;
  padding: 6px 10px;
  font-size: 13px;
  letter-spacing: 1px;
}

#mobileControls.mobileControlsDisabled {
  opacity: 0.55;
}

    @media (max-width: 900px), (pointer: coarse) {
      :root {
        --camera-width: 96vw;
        --camera-height: 58vh;
      }

      .gameOverlay.open {
        flex-direction: column;
        justify-content: flex-start;
        overflow-y: auto;
      }

      .overlayImage {
        width: min(80vw, 420px);
        height: 300px;
      }

      .overlayPanel {
        width: min(90vw, 420px);
        min-height: 260px;
      }

      #bubbleOverlay {
        bottom: 20px;
        font-size: 16px;
      }

      #mobileControls {
        display: flex;
      }

      .instructions {
        display: none;
      }
    }
  </style>
</head>

<body>
  <h1>BADGES OF SNOW PLANET UNRECOGNIZER II</h1>
  <div id="hud"></div>

 <div id="camera">

  <div id="nightOverlay"></div>
  <div id="snowOverlay"></div>

  <svg

</div>

  <!-- Mobile controls begin as a visual shell.
       Gameplay wiring is added in the next patch. -->
  <div

>

  <div id="mobileAimPad" class="mobileControlGroup">

    <button id="mobileFireUpLeft"

      ↖
    </button>

    <button id="mobileUp"

      ▲
    </button>

    <button id="mobileFireUpRight"

      ↗

    <button id="mobileLeft"

    <button id="mobileRight"

      ▶

    <button id="mobileFireDownLeft"

      ↙
    </button>

    <button id="mobileDown"
            class="mobileButton"
            type="button">
      ▼
    </button>

    <button id="mobileFireDownRight"
            class="mobileButton mobileFireDiagonal"

      ↘
    </button>

  </div>


  <div
    id="mobileActionButtons"
    class="mobileControlGroup"
  >

    <button
      id="mobileInteract"
      class="mobileButton mobileActionButton"
      type="button">
      ACT
    </button>

    <button
      id="mobileDeploy"
      class="mobileButton mobileActionButton"
      type="button">
      DEPLOY
    </button>

    <button
      id="mobileMenu"
      class="mobileButton mobileActionButton"
      type="button">
      MENU
    </button>

  </div>

</div>

  <div id="messageBox">Atlas engine initialized.</div>

  <div class="instructions">
    Arrows move / Numpad drive / 5: aim · E: interact / enter / exit · B: back ·
    F: fire equipped weapon · S: deploy shield · I: inventory · M: atlas · T: thinking mode
  </div>

  <!-- One overlay shell serves phones, computers, merchants, machines,
       portraits, special objects, inventory pages, and varied menus. -->
  <div id="universalOverlay" class="gameOverlay">
    <div id="overlayImage" class="overlayImage"></div>
    <div id="overlayPanel" class="overlayPanel">
      <h2 id="overlayTitle"></h2>
      <div id="overlayText" class="overlayText"></div>
      <div id="overlayOptions"></div>
      <div class="overlayHint">Arrow keys: choose · E/Enter: confirm · B/Escape: close</div>
    </div>
  </div>

  <div id="bubbleOverlay">
    <div id="bubbleSpeaker"></div>
    <div id="bubbleText"></div>
  </div>

/* Safe audio wrapper: missing files or browser autoplay restrictions
   will not halt the game engine. */
function createSound(path, { loop = false, volume = 0.3 } = {}) {
  const audio = new Audio(path);
  audio.loop = loop;
  audio.volume = volume;
  audio.preload = "auto";
  return audio;
}

const SOUNDS = {
  laser: createSound(ASSETS.sound.basicLaser, { volume: 0.35 }),
  carDoor: createSound(ASSETS.sound.carDoor, { volume: 0.35 }),
  snowmobile: createSound(ASSETS.sound.snowmobileEngine, { loop: true, volume: 0.5 }),
  rs1: createSound(ASSETS.sound.rs1Engine, { loop: true, volume: 0.1 }),
  car1: createSound(ASSETS.sound.car1Idle, { loop: true, volume: 0.5 }),
  wind: createSound(ASSETS.sound.wind, { loop: true, volume: 0.6 })
};

function playSound(sound, restart = true) {
  if (!sound) return;
  if (restart) sound.currentTime = 0;
  sound.play().catch(() => {});
}

function stopSound(sound) {
  if (!sound) return;
  sound.pause();
  sound.currentTime = 0;
}

/*
  These editing helpers remain available for optional scripted
  changes. You may also edit every array directly above.
*/
function replaceMapSymbol(mapRows, x, y, symbol) {
  if (!mapRows[y] || x < 0 || x >= mapRows[y].length) return;

  const row = mapRows[y];
  mapRows[y] =
    row.slice(0, x) +
    symbol +
    row.slice(x + 1);
}

function paintHorizontal(mapRows, y, x1, x2, symbol) {
  for (let x = x1; x <= x2; x++) {
    replaceMapSymbol(mapRows, x, y, symbol);
  }
}

function paintVertical(mapRows, x, y1, y2, symbol) {
  for (let y = y1; y <= y2; y++) {
    replaceMapSymbol(mapRows, x, y, symbol);
  }
}

/*
  Builds the atlas information around the manual arrays.

  This does not generate terrain. It only connects:
  - coordinate
  - row and column
  - title
  - manual tile array
  - weather
  - discovery state
*/
function buildAtlas() {
  const atlas = {};

  for (let row = 0; row < ATLAS_SIZE; row++) {
    for (let column = 0; column < ATLAS_SIZE; column++) {
      const code =
        ATLAS_LETTERS[row] +
        ATLAS_LETTERS[column];

      atlas[code] = {
        code,
        row,
        column,
        title: `UNSURVEYED SECTOR ${code}`,
        kind: "outside",
        tiles: ATLAS_MAP_ARRAYS[code],
        weather: "snow",
        discovered: code === "AA"
      };
    }
  }

  return atlas;
}

function getItemsSellableToBuyer(buyerId) {
  return player.inventory.filter(itemId => {
    const item = ITEM_DEFINITIONS[itemId];

    return (
      item &&
      item.buyerId === buyerId &&
      Number.isFinite(item.sellValue)
    );
  });
}

function sellItemToBuyer(itemId, buyerId) {
  const item = ITEM_DEFINITIONS[itemId];

  if (
    !item ||
    item.buyerId !== buyerId ||
    !Number.isFinite(item.sellValue)
  ) {
    showBubble(
      "SALE FAILED",
      "That item cannot be sold to this buyer."
    );

    return false;
  }

  if (!hasItem(itemId)) {
    showBubble(
      "SALE FAILED",
      `${item.name} is no longer in Yoi's inventory.`
    );

    return false;
  }

  if (!removeItem(itemId)) {
    showBubble(
      "SALE FAILED",
      `${item.name} could not be removed from Yoi's inventory.`
    );

    return false;
  }

  player.merit += item.sellValue;

  updateHud();

  return true;
}

function openVerkosArtifactMenu() {
  const sellableItemIds =
    getItemsSellableToBuyer("verkos");

  const options = sellableItemIds.map(itemId => {
    const item = ITEM_DEFINITIONS[itemId];

    return {
      label: `Sell ${item.name} · ${item.sellValue} Merit`,
      image: item.image,

      text:
        `<strong>${item.name}</strong><br><br>` +
        `${item.description || ""}<br><br>` +
        `ART CORP offer: ${item.sellValue} Merit.`,

      action: () => {
        const sold = sellItemToBuyer(
          itemId,
          "verkos"
        );

        if (!sold) {
          return;
        }

        plantThought("people_verkos_culture");

        closeOverlay();

        showBubble(
          "VERKOS",
          `ART CORP accepts the ${item.name}. ` +
          `${item.sellValue} Merit received.`
        );
      }
    };
  });

  if (sellableItemIds.length === 0) {
    options.push({
      label: "Nothing to sell",
      disabled: true,
      text:
        "Yoi is not carrying any cultural artifacts " +
        "that Verkos is authorized to purchase."
    });
  }

  options.push({
    label: "Leave",
    action: closeOverlay
  });

  openOverlay({
    title: "ART CORP ACQUISITIONS",
    image: ASSETS.character.badge.verkos,

    text:
      `Merit: ${player.merit}<br><br>` +
      `ART CORP purchases culturally significant objects ` +
      `associated with contemporary life on Stro.`,

    options
  });
}

function openPhaylUnrecognizerTrade() {
  const itemId = "fullPillBottle";

  const quantityCarried =
    getInventoryItemQuantity(itemId);

  openOverlay({
    title: "PHAYL",
    image: ASSETS.character.badge.phayl,

    text:
      "Bring me some UNRECOGNIZER and I'll buy it." +
      "<br><br>" +
      "I'll pay <strong>7 Serpentine</strong> per bottle." +
      "<br><br>" +
      `UNRECOGNIZER bottles carried: ${quantityCarried}` +
      "<br>" +
      `Serpentine: ${player.serpentine}`,

      {
        label: "Sell 1 bottle for 7 Serpentine",

        text:
          quantityCarried > 0

        action: closeOverlay

/* =============================================================
   COMMUNAL CAMPFIRE SYSTEM

   Every campfire on Stro draws from the same planetary collection.

   Each campfire visit reveals a random portion of that collection.
   Taking an item removes one copy from the shared collection,
   meaning it can no longer appear at another campfire.
   ============================================================= */

function openCampfireDepositMenu() {
  if (player.inventory.length === 0) {
    openOverlay({
      title: "THE COMMUNAL FIRE",
      image: ASSETS.props.campfireOut,

      text:
        "Yoi is carrying nothing that can be left beside the fire.",

      options: [
        {
          label: "Back",
          action: INTERACTIONS.campfire
        },

        {
          label: "Leave",
          action: closeOverlay
        }
      ]
    });

    return;
  }

  const inventoryOptions =
    player.inventory.map(
      (itemId, inventoryIndex) => {
        const item =
          ITEM_DEFINITIONS[itemId];

        return {
          label:
            item?.name ||
            itemId,

          action: () => {
            openCampfireDepositConfirmation(
              itemId,
              inventoryIndex
            );
          }
        };
      }
    );

  openOverlay({
    title: "LEAVE AN ITEM",
    image: ASSETS.props.campfireOut,

    text:
      "Choose an item to leave in the communal circulation of Stro's abandoned campfires.",

    options: [
      ...inventoryOptions,

      {
        label: "Back",
        action: INTERACTIONS.campfire
      },

      {
        label: "Leave",
        action: closeOverlay
      }
    ]
  });
}

function openCampfireDepositConfirmation(
  itemId,
  inventoryIndex
) {
  const item =
    ITEM_DEFINITIONS[itemId];

  if (
    !item ||
    player.inventory[inventoryIndex] !== itemId
  ) {
    openCampfireDepositMenu();
    return;
  }

  openOverlay({
    title: item.name,
    image: item.image,

    text:
      isItemEquipped(itemId)
        ? "This item is currently equipped. Leaving it here will unequip it and place it into the communal fire circulation."
        : "Leave this item beside the fire and place it into the communal circulation?",

    options: [
      {
        label: "Leave item",
        action: () => {
          depositCampfireItem(
            itemId,
            inventoryIndex
          );
        }
      },

      {
        label: "Keep it",
        action: openCampfireDepositMenu
      }
    ]
  });
}

function depositCampfireItem(
  itemId,
  inventoryIndex
) {
  const item =
    ITEM_DEFINITIONS[itemId];

  /*
    Verify that the exact inventory position selected
    still contains the expected item.

    This protects against stale menu selections.
  */
  if (
    !item ||
    player.inventory[inventoryIndex] !== itemId
  ) {
    closeOverlay();

    showBubble(
      "ITEM UNAVAILABLE",
      "That item is no longer in Yoi's inventory."
    );

    return;
  }

  /*
    Equipped items must be unequipped before removal.

    Otherwise the equipment slot would continue pointing
    to an item Yoi no longer possesses.
  */
  if (isItemEquipped(itemId)) {
    unequipItem(itemId);
  }

  const itemRemoved =
    removeItem(itemId);

  if (!itemRemoved) {
    closeOverlay();

    showBubble(
      "ITEM UNAVAILABLE",
      "That item could not be removed from inventory."
    );

    return;
  }

  /*
    Add one physical copy to the same planetary collection
    already used by the campfire shuffle.
  */
  COMMUNAL_CAMPFIRE_ITEMS.push(
    itemId
  );

  closeOverlay();

  showBubble(
    "ITEM LEFT",
    `${item.name} was left in the communal fire circulation.`
  );

  updateHud();
}

const CAMPFIRE_IMAGES = [
  ASSETS.props.campfireDead,
  ASSETS.props.campfireCooking,
  ASSETS.props.campfireBlazing,
  ASSETS.props.campfireSmoldering
];

const COMMUNAL_CAMPFIRE_ITEMS = [
  "pineFaceWitness",
  "pineFaceWitness",

  "stakeWitness",

  "heatedMealRation",
  "heatedMealRation",
  "heatedMealRation",
  "heatedMealRation",

  "gasJugEmpty",
  "gasJugEmpty",

  "binocularsBroken",

  "redglassRock",
  "redglassRock",
  "redglassRock",
  "redglassRock",

  "emptyPillBottle",
  "emptyPillBottle",
  "emptyPillBottle",
  "emptyPillBottle",
  "emptyPillBottle",
];

/*
  The currently visible handful is temporary.

  It changes whenever the player begins a new campfire search.
  The actual items remain inside COMMUNAL_CAMPFIRE_ITEMS until taken.
*/
let currentCampfireSelection = [];

let currentCampfireImage =
  ASSETS.props.campfireDead;

function getRandomCampfireSelection() {
  if (COMMUNAL_CAMPFIRE_ITEMS.length === 0) {
    return [];
  }

  /*
    Reveal between one and three items.

    Never attempt to reveal more items than remain in
    the communal collection.
  */
  const maximumVisible = Math.min(
    3,
    COMMUNAL_CAMPFIRE_ITEMS.length
  );

  const visibleCount =
    1 + Math.floor(
      Math.random() * maximumVisible
    );

  /*
    Shuffle a copy of the communal collection.

    The original collection remains untouched until
    the player actually takes something.
  */
  const shuffledItems = [
    ...COMMUNAL_CAMPFIRE_ITEMS
  ];

  for (
    let index = shuffledItems.length - 1;
    index > 0;
    index -= 1
  ) {
    const randomIndex =
      Math.floor(
        Math.random() * (index + 1)
      );

    [
      shuffledItems[index],
      shuffledItems[randomIndex]
    ] = [
      shuffledItems[randomIndex],
      shuffledItems[index]
    ];
  }

  return shuffledItems.slice(
    0,
    visibleCount
  );
}

function searchCampfire() {

  currentCampfireImage =
    CAMPFIRE_IMAGES[
      Math.floor(
        Math.random() *
        CAMPFIRE_IMAGES.length
      )
    ];

  currentCampfireSelection =
    getRandomCampfireSelection();

  openCampfireContents();
}

function openCampfireContents() {
  if (currentCampfireSelection.length === 0) {
    openOverlay({
      title: "THE COMMUNAL FIRE",
      image: currentCampfireImage,

      text:
        COMMUNAL_CAMPFIRE_ITEMS.length === 0
          ? "The fire offers nothing. Whatever once circulated among the camps has been carried away."
          : "You search around the cold firepit, but nothing reveals itself this time.",

      options: [
        {
          label: "Leave",
          action: closeOverlay
        }
      ]
    });

    return;
  }

  const itemOptions =
    currentCampfireSelection.map(
      (itemId, itemIndex) => {
        const item =
          ITEM_DEFINITIONS[itemId];

        return {
          label:
            item?.name ||
            itemId,

          action: () => {
            openCampfireItemMenu(
              itemIndex
            );
          }
        };
      }
    );

  openOverlay({
  title: "THE COMMUNAL FIRE",
  image: currentCampfireImage,

    text:
      "Among the remains of the campsite, a few objects seem to have surfaced from the wider circulation of Stro's abandoned fires.",

    options: [
      ...itemOptions,

      {
        label: "Leave",
        action: closeOverlay
      }
    ]
  });
}

function openCampfireItemMenu(
  itemIndex
) {
  const itemId =
    currentCampfireSelection[itemIndex];

  const item =
    ITEM_DEFINITIONS[itemId];

  if (!itemId || !item) {
    openCampfireContents();
    return;
  }

  openOverlay({
    title: item.name,
    image: item.image,

    text:
      item.description ||
      "An object circulating among the abandoned campfires of Stro.",

    options: [
      {
        label: "Take",
        action: () => {
          takeCampfireItem(
            itemIndex
          );
        }
      },

      {
        label: "Leave it",
        action: openCampfireContents
      }
    ]
  });
}

function takeCampfireItem(
  itemIndex
) {
  const itemId =
    currentCampfireSelection[itemIndex];

  const item =
    ITEM_DEFINITIONS[itemId];

  if (!itemId || !item) {
    openCampfireContents();
    return;
  }

  const itemAdded =
    addItem(itemId);

  if (!itemAdded) {
    closeOverlay();

    showBubble(
      "INVENTORY TOO FULL",
      `Make room before taking ${item.name}.`
    );

    return;
  }

  /*
    Remove one matching copy from the planetary collection.

    If several copies of an item exist, only one is removed.
  */
  const communalIndex =
    COMMUNAL_CAMPFIRE_ITEMS.indexOf(
      itemId
    );

  if (communalIndex !== -1) {
    COMMUNAL_CAMPFIRE_ITEMS.splice(
      communalIndex,
      1
    );
  }

  /*
    Also remove it from the handful currently being viewed.
  */
  currentCampfireSelection.splice(
    itemIndex,
    1
  );

  closeOverlay();

  showBubble(
    "ITEM TAKEN",
    `${item.name} removed from the communal fire and added to inventory.`
  );

  updateHud();
}

/* =============================================================
   COPY SYSTEM

   Copies are temporary performers produced from existing
   character or vehicle instances.

   The original instance remains completely untouched.
   ============================================================= */

function copyProduce(
  sourceId,
  copyId,
  staging = {}
) {
  /*
    Prevent two copies from sharing the same ID.
    If this copy already exists, vanish the old one first.
  */
  copyVanish(copyId);

  const sourceCharacter = characters.find(
    character => character.id === sourceId
  );

  if (sourceCharacter) {
    const characterCopy = {
      ...sourceCharacter,
      ...staging,

      id: copyId,

      isCopy: true,
      copySourceId: sourceId,

      /*
        A produced character begins as its own fresh performer.
      */
      conversationStep:
        staging.conversationStep ?? 0,

      portraitShown:
        staging.portraitShown ?? true,

      visible:
        staging.visible ?? true,

      defeated:
        staging.defeated ?? false
    };

    characters.push(characterCopy);

    return characterCopy;
  }

  const sourceVehicle = vehicles.find(
    vehicle => vehicle.id === sourceId
  );

  if (sourceVehicle) {
    const vehicleCopy = {
      ...sourceVehicle,
      ...staging,

      id: copyId,

      isCopy: true,
      copySourceId: sourceId,

      reversing: false
    };

    /*
      Do not let a copied vehicle share the original vehicle's
      cargo array. Each vehicle must own its own cargo list.
    */
    if (Array.isArray(sourceVehicle.cargo)) {
      vehicleCopy.cargo = [
        ...sourceVehicle.cargo
      ];
    }

    vehicles.push(vehicleCopy);

    return vehicleCopy;
  }

  console.warn(
    `copyProduce could not find source instance: ${sourceId}`
  );

  return null;
}

/* =============================================================
   THINKING MODE SYSTEM
   ============================================================= */

function hasThought(thoughtId) {
  return player.thoughts.includes(thoughtId);
}

function plantThought(thoughtId) {
  const thought = THOUGHT_DEFINITIONS[thoughtId];

  if (!thought) {
    console.warn(`Unknown thought ID: ${thoughtId}`);
    return false;
  }

  if (hasThought(thoughtId)) {
    return false;
  }

  player.thoughts.push(thoughtId);
  return true;
}

function getPlantedThoughts() {
  return player.thoughts
    .map(thoughtId => THOUGHT_DEFINITIONS[thoughtId])
    .filter(Boolean);
}

function getThoughtsByCategory(category) {
  return getPlantedThoughts()
    .filter(
      thought => thought.category === category
    )
    .reverse();
}

/*
==========================================================
  CLEANUP SYSTEM
==========================================================

  Temporary runtime copies eventually leave the world.

  Walking and vehicle transitions report map changes to
  this system, which decides whether any temporary story
  scenes should be cleaned up.

==========================================================
*/

function runMapTransitionCleanup(
  previousMapId,
  nextMapId
) {
  copyCheckCrukRecoveryVanish(
    previousMapId,
    nextMapId
  );
}

function copyCheckCrukRecoveryVanish(
  previousMapId,
  nextMapId
) {
  if (
    previousMapId === "BC" &&
    nextMapId !== "BC"
  ) {
    copyVanish("copyCruk");
    copyVanish("copyDriftwagon");
  }
}

function copyVanish(copyId) {
  /*
    Never vanish a vehicle while Yoi is occupying it.
    This prevents another visit to BETWEEN.
  */
  if (player.vehicleId === copyId) {
    console.warn(
      `copyVanish refused to remove occupied vehicle: ${copyId}`
    );

    return false;
  }

  const characterIndex = characters.findIndex(
    character =>
      character.id === copyId &&
      character.isCopy
  );

  if (characterIndex !== -1) {
    characters.splice(characterIndex, 1);
    return true;
  }

  const vehicleIndex = vehicles.findIndex(
    vehicle =>
      vehicle.id === copyId &&
      vehicle.isCopy
  );

  if (vehicleIndex !== -1) {
    vehicles.splice(vehicleIndex, 1);
    return true;
  }

  return false;
}

const DIRECTIONS = {
  upLeft:    { dx: -1, dy: -1 },
  up:        { dx:  0, dy: -1 },
  upRight:   { dx:  1, dy: -1 },

  left:      { dx: -1, dy:  0 },
  right:     { dx:  1, dy:  0 },

  downLeft:  { dx: -1, dy:  1 },
  down:      { dx:  0, dy:  1 },
  downRight: { dx:  1, dy:  1 }
};

const CARDINAL_DIRECTION_NAMES = new Set([
  "up",
  "down",
  "left",
  "right"
]);

const CARDINAL_DIRECTION_VECTORS = [
  DIRECTIONS.up,
  DIRECTIONS.down,
  DIRECTIONS.left,
  DIRECTIONS.right
];

function isCardinalDirection(direction) {
  return CARDINAL_DIRECTION_NAMES.has(direction);
}

function isDiagonalDirection(direction) {
  const vector = DIRECTIONS[direction];

  return Boolean(
    vector &&
    vector.dx !== 0 &&
    vector.dy !== 0
  );
}

const PROJECTILE_DIRECTIONS = {
  ...DIRECTIONS,

  upLeft: {
    dx: -1,
    dy: -1
  },

  upRight: {
    dx: 1,
    dy: -1
  },

  downLeft: {
    dx: -1,
    dy: 1
  },

  downRight: {
    dx: 1,
    dy: 1
  }
};

function isOppositeDirection(directionA, directionB) {
  return (
    (directionA === "left" && directionB === "right") ||
    (directionA === "right" && directionB === "left") ||
    (directionA === "up" && directionB === "down") ||
    (directionA === "down" && directionB === "up")
  );
}

/* bulk capacity */ 

function getItemBulk(itemId) {
  const item = ITEM_DEFINITIONS[itemId];

  if (!item) {
    console.warn(`Unknown item definition: ${itemId}`);
    return 0;
  }

  return item.bulk ?? 0;
}

function getInventoryBulk() {

  }, 0);
}

function getVehicleCargoBulk(vehicle) {
  const cargo = ensureVehicleCargo(vehicle);

  return cargo.reduce((total, itemId) => {
    return total + getItemBulk(itemId);
  }, 0);
}

function canPlayerCarryItem(itemId) {
  const currentBulk = getInventoryBulk();
  const itemBulk = getItemBulk(itemId);

  return currentBulk + itemBulk <= player.inventoryCapacity;
}

function canVehicleStoreItem(vehicle, itemId) {
  const definition = getVehicleDefinition(vehicle);
  const currentBulk = getVehicleCargoBulk(vehicle);
  const itemBulk = getItemBulk(itemId);

  return currentBulk + itemBulk <= definition.cargoCapacity;
}

/*
  ENGINE RULE

  Every system that gives Yoi an item must call addItem()
  first and only remove the item from its source or advance
  quest progress if addItem() succeeds.
*/

/* add item */

function addItem(itemId) {
  const item = ITEM_DEFINITIONS[itemId];

  if (!item) {
    setMessage("That item has no matching item definition.");
    return false;
  }

  /*
    Non-stackable items remain unique.

    Stackable items, such as heated meal rations, may appear
    multiple times in the inventory. Each copy still contributes
    its normal bulk.
  */
  if (!isItemStackable(itemId) && hasItem(itemId)) {
    return false;
  }

  if (!canPlayerCarryItem(itemId)) {
    setMessage("Inventory too full.");
    return false;
  }

  player.inventory.push(itemId);
  return true;
}

function removeItem(itemId) {
  const index = player.inventory.indexOf(itemId);

  if (index === -1) return false;

  player.inventory.splice(index, 1);
  return true;
}

   NPC TRADE SYSTEM

   Reusable for current and future NPC purchases.

function getInventoryItemQuantity(itemId) {
  return player.inventory.filter(
    carriedItemId => carriedItemId === itemId
  ).length;
}

function runNpcItemSale({
  sellerName = "NPC",
  itemId,
  quantity = 1,
  currencyId = "serpentine",
  paymentAmount = 0,
  successMessage = null,
  onSuccess = null
}) {
  const item = ITEM_DEFINITIONS[itemId];

  if (!item) {
    console.warn(
      `NPC trade rejected unknown item: ${itemId}`
    );

    showBubble(
      sellerName.toUpperCase(),
      "That trade cannot be completed."
    );

    return false;
  }

  const quantityCarried =
    getInventoryItemQuantity(itemId);

  if (quantityCarried < quantity) {
    showBubble(
      sellerName.toUpperCase(),
      `Yoi does not have ${
        quantity === 1
          ? `a ${item.name}`
          : `${quantity} × ${item.name}`
      }.`
    );

    return false;
  }

  /*
    Validate the player's currency property before
    removing anything from inventory.
  */
  if (
    typeof player[currencyId] !== "number"
  ) {
    console.warn(
      `NPC trade rejected unknown currency: ${currencyId}`
    );

    showBubble(
      sellerName.toUpperCase(),
      "That payment method is unavailable."
    );

    return false;
  }

  /*
    Remove every required item.
  */
  for (
    let removedCount = 0;
    removedCount < quantity;
    removedCount += 1
  ) {
    const removed = removeItem(itemId);

    if (!removed) {
      /*
        This should not normally happen because the
        quantity was already checked.

        Restore any copies removed before the failure.
      */
      for (
        let restoreCount = 0;
        restoreCount < removedCount;
        restoreCount += 1
      ) {
        addItem(itemId);
      }

      showBubble(
        sellerName.toUpperCase(),
        "The trade could not be completed."
      );

      return false;
    }
  }

  /*
    Pay Yoi only after the required item has
    successfully been removed.
  */
  player[currencyId] += paymentAmount;

  if (typeof onSuccess === "function") {
    onSuccess();
  }

  closeOverlay();

  showBubble(
    sellerName.toUpperCase(),
    successMessage ||
      `${sellerName} pays Yoi ${paymentAmount} ${currencyId}.`
  );

  drawGame();
  return true;
}

function unequipItem(itemId) {
  const item = ITEM_DEFINITIONS[itemId];

  if (!item) return;

  const slot = getEquipmentSlot(item.category);

}

function getEquipmentSlot(category) {
  const slots = {
    weapon: "equippedWeaponId",
    suit: "equippedSuitId",
    badge: "equippedBadgeId",
    tool: "equippedToolId",
    key: "equippedKeyId",
    device: "equippedDeviceId",
    watch: "equippedWatchId",

  };

  return slots[category] || null;
}

function isItemEquipped(itemId) {
  const item = ITEM_DEFINITIONS[itemId];
  if (!item) return false;

  const slot = getEquipmentSlot(item.category);
  if (!slot) return false;

  return player[slot] === itemId;
}

function equipInventoryItem(itemId) {
  const item = ITEM_DEFINITIONS[itemId];

  if (!item || !hasItem(itemId)) {
    setMessage("That item is not available.");
    return;
  }

  const slot = getEquipmentSlot(item.category);

  if (!slot) {
    setMessage(`${item.name} cannot be equipped.`);
    return;
  }

  if (player[slot] === itemId) {
    player[slot] = null;
    setMessage(`${item.name} unequipped.`);
  } else {
    player[slot] = itemId;
    setMessage(`${item.name} equipped.`);
  }

  drawGame();
}

function getAdjacentHtiCalibrationTarget() {
  if (!isOutsideMap()) return null;

  return getHtiCalibrationTargets().find(target => {
    if (target.mapId !== worldState.currentMapId) {
      return false;
    }

    const definition =
      BUILDING_DEFINITIONS[target.definitionId];

    if (!definition) return false;

    for (
      let localY = 0;
      localY < definition.collisionMask.length;
      localY++
    ) {
      const row =
        definition.collisionMask[localY] || "";

      for (
        let localX = 0;
        localX < row.length;
        localX++
      ) {
        if (row[localX] !== "X") continue;

        const targetX = target.x + localX;
        const targetY = target.y + localY;

        const cardinalDirections = [
  DIRECTIONS.up,
  DIRECTIONS.down,
  DIRECTIONS.left,
  DIRECTIONS.right
];

const adjacent =
  cardinalDirections.some(direction =>
    player.x + direction.dx === targetX &&
    player.y + direction.dy === targetY
  );

        if (adjacent) {
          return true;
        }
      }
    }

    return false;
  }) || null;
}

    showBubble(
      "HEREO TELEPORTER",
      "The network cannot transfer matter until three targets have established triangulation."
    );

    return;
  }

  if (!isHtiTargetCalibrated(target.id)) {
    showBubble(
      "HEREO TELEPORTER",
      "That destination has not been visited and calibrated."
    );

    return;
  }

  const vehicle = getCurrentVehicle();

  closeOverlay();

  /*
  Vehicle teleportation
*/
if (vehicle && player.mode === "driving") {
  const arrival = target.arrival.vehicle;

  if (!arrival) {
    showBubble(
      "HEREO TELEPORTER",
      "This calibration target cannot receive a vehicle."
    );

    return;
  }

  const arrivalFacing =
    arrival.facing || vehicle.facing;

  /*
    Test the complete vehicle footprint against the destination
    map before changing any permanent vehicle or player state.

    canVehicleOccupy() reads worldState.currentMapId, so temporarily
    point the collision system at the target map.
  */
  const previousWorldMapId =
    worldState.currentMapId;

  const previousVehicleMapId =
    vehicle.mapId;

  worldState.currentMapId =
    target.mapId;

  vehicle.mapId =
    target.mapId;

  const destinationIsClear =
    canVehicleOccupy(
      vehicle,
      arrival.x,
      arrival.y,
      arrivalFacing
    );

  /*
    Restore the original state before deciding whether the
    teleport succeeds.
  */
  worldState.currentMapId =
    previousWorldMapId;

  vehicle.mapId =
    previousVehicleMapId;

  if (!destinationIsClear) {
    showBubble(
      "HEREO TELEPORTER",
      "TRANSFER ABORTED.<br><br>" +
      "The registered vehicle arrival zone is obstructed."
    );

    return;
  }

  /*
    The complete destination footprint is clear.
    Teleportation may now proceed.
  */
  stopAllVehicleSounds();

  vehicle.mapId =
    target.mapId;

  vehicle.x =
    arrival.x;

  vehicle.y =
    arrival.y;

  vehicle.facing =
    arrivalFacing;

  vehicle.reversing =
    false;

  worldState.currentMapId =
    target.mapId;

  player.mapId =
    target.mapId;

  player.x =
    vehicle.x;

  player.y =
    vehicle.y;

  if (ATLAS[target.mapId]) {
    ATLAS[target.mapId].discovered = true;
  }

  showBubble(
    "HEREO TELEPORTER",
    `${getVehicleDefinition(vehicle).name} transferred to ` +
    `${target.teleporterName || target.mapId}.`
  );

  drawGame();
  return;
}

  /*
    On-foot teleportation
  */
  const arrival = target.arrival.player;

  if (!arrival) {
    showBubble(
      "HEREO TELEPORTER",
      "This calibration target has no registered arrival position."
    );

    return;
  }

  const safeArrival = findSafePlayerArrival(
  target.mapId,
  arrival.x,
  arrival.y
);

if (!safeArrival) {
  showBubble(

  );

}

worldState.currentMapId = target.mapId;

player.mapId = target.mapId;
player.x = safeArrival.x;
player.y = safeArrival.y;
player.mode = "walking";
player.vehicleId = null;

  if (ATLAS[target.mapId]) {
    ATLAS[target.mapId].discovered = true;
  }

  showBubble(
    "HEREO TELEPORTER",
    `Transfer complete: ${target.teleporterName || target.mapId}.`
  );

  drawGame();
}

function getCharacterDefinition(character) {

function getVehicleSize(vehicle, facing = vehicle.facing) {
  const definition = getVehicleDefinition(vehicle);
  return definition.size[facing];
}

function getVehicleOccupiedTiles(vehicle, x = vehicle.x, y = vehicle.y, facing = vehicle.facing) {
  const size = getVehicleSize(vehicle, facing);
  const tiles = [];

  for (let offsetY = 0; offsetY < size.height; offsetY++) {
    for (let offsetX = 0; offsetX < size.width; offsetX++) {
      tiles.push({ x: x + offsetX, y: y + offsetY });
    }
  }

  return tiles;
}

function getVehicleOverlayImage(vehicle) {
  const definition = getVehicleDefinition(vehicle);
  const facingImage = definition.images[vehicle.facing];

  if (definition.images.overlay?.[vehicle.facing]) {
    return definition.images.overlay[vehicle.facing];
  }

  if (definition.renderMode === "pieces") {
    return facingImage.front;
  }

  return facingImage;
}

function rectanglesOverlap(aTiles, bTiles) {
  return aTiles.some(a => bTiles.some(b => a.x === b.x && a.y === b.y));
}

/* =============================================================
   12. ATLAS NAVIGATION

   Crossing an outside edge changes the coordinate automatically.
   The matching position along the edge is preserved.
   ============================================================= */

/* =============================================================
   OPERATION ROUND STRO

   The atlas wraps around both planetary axes.

   Examples:
   AH east  -> AA
   AA west  -> AH
   HA south -> AA
   AA north -> HA

   This function is used by:
   - player walking
   - player-driven vehicles
   - NPC-operated vehicles
   - scheduled transports and convoys
   ============================================================= */

function getAdjacentAtlasCode(code, direction) {
  let row = ATLAS_LETTERS.indexOf(code[0]);
  let column = ATLAS_LETTERS.indexOf(code[1]);

  /*
    Reject invalid coordinate codes instead of producing
    an accidental atlas destination.
  */
  if (row === -1 || column === -1) {
    console.warn("Invalid atlas coordinate:", code);
    return null;
  }

  if (direction === "up") {
    row--;
  }

  if (direction === "down") {
    row++;
  }

  if (direction === "left") {
    column--;
  }

  if (direction === "right") {
    column++;
  }

  /*
    Wrap values around the 8 x 8 atlas.

    Going below zero returns to 7.
    Going above 7 returns to zero.
  */
  row = (row + ATLAS_SIZE) % ATLAS_SIZE;
  column = (column + ATLAS_SIZE) % ATLAS_SIZE;

  return (
    ATLAS_LETTERS[row] +
    ATLAS_LETTERS[column]
  );
}

function transitionWalkingAcrossAtlasEdge(direction) {
  const currentMapId = worldState.currentMapId;
  const nextMapId = getAdjacentAtlasCode(
    currentMapId,
    direction
  );

  if (!nextMapId) {
    setMessage("The chart ends here.");
    return false;
  }

  const nextMap = ATLAS[nextMapId];
  const { width, height } =
    getMapDimensions(nextMap);

  let arrivalX = player.x;
  let arrivalY = player.y;

  if (direction === "left") {
    arrivalX = width - 1;
  }

  if (direction === "right") {
    arrivalX = 0;
  }

  if (direction === "up") {
    arrivalY = height - 1;
  }

  if (direction === "down") {
    arrivalY = 0;
  }

  const arrivalSymbol = getTileSymbol(
    arrivalX,
    arrivalY,
    nextMap
  );

  const arrivalTile =
    OUTSIDE_TILES[arrivalSymbol];

  if (!arrivalTile?.walkable) {
    setMessage(
      "The route into the next sector is blocked."
    );

    return false;
  }

  if (
    getBuildingCollisionAt(
      nextMapId,
      arrivalX,
      arrivalY
    )
  ) {
    setMessage(
      "The route into the next sector is blocked."
    );

    return false;
  }

  const characterBlocked = characters.some(
    character =>
      character.visible &&
      !character.defeated &&
      character.mapId === nextMapId &&
      character.x === arrivalX &&
      character.y === arrivalY
  );

  if (characterBlocked) {
    setMessage(
      "Someone is blocking the route into the next sector."
    );

    return false;
  }

  const vehicleBlocked = vehicles.some(
    vehicle =>
      vehicle.mapId === nextMapId &&
      getVehicleOccupiedTiles(vehicle).some(
        tile =>
          tile.x === arrivalX &&
          tile.y === arrivalY
      )
  );

  if (vehicleBlocked) {
    setMessage(
      "A vehicle is blocking the route into the next sector."
    );

    return false;
  }

  worldState.currentMapId = nextMapId;
  player.mapId = nextMapId;
  player.x = arrivalX;
  player.y = arrivalY;

  nextMap.discovered = true;

  runMapTransitionCleanup(
  currentMapId,
  nextMapId
);

  triggerStragCEObstructionEvent();
  checkBeerMineNet();

  setMessage(`${nextMapId}: ${nextMap.title}`);

  return true;
}

function transitionVehicleAcrossAtlasEdge(
  vehicle,
  direction
) {
  const currentMapId =
    worldState.currentMapId;

  const nextMapId = getAdjacentAtlasCode(
    currentMapId,
    direction
  );

  if (!nextMapId) {
    setMessage("The chart ends here.");
    return false;
  }

  const nextMap = ATLAS[nextMapId];

  const { width, height } =
    getMapDimensions(nextMap);

  const size =
    getVehicleSize(vehicle, vehicle.facing);

  worldState.currentMapId = nextMapId;
  player.mapId = nextMapId;
  vehicle.mapId = nextMapId;
  nextMap.discovered = true;

  if (direction === "left") {
    vehicle.x = width - size.width;
  }

  if (direction === "right") {
    vehicle.x = 0;
  }

  if (direction === "up") {
    vehicle.y = height - size.height;
  }

  if (direction === "down") {
    vehicle.y = 0;
  }

  player.x = vehicle.x;
  player.y = vehicle.y;

  copyCheckCrukRecoveryVanish(
    currentMapId,
    nextMapId
  );

  setMessage(`${nextMapId}: ${nextMap.title}`);

  return true;
}

/*
  UNIVERSAL VEHICLE ATLAS TRANSITION

  Works for player-driven vehicles, NPC-driven vehicles,
  scheduled transports, convoys, and autopilot vehicles.

  Unlike the older player-specific transition function,
  this reads the vehicle's own mapId.
*/
function transitionVehicleAcrossAtlasEdgeFor(vehicle, direction) {
  if (!vehicle) return false;

  const currentMapId = vehicle.mapId;
  const nextMapId = getAdjacentAtlasCode(currentMapId, direction);

  if (!nextMapId) {
    return false;
  }

  const nextMap = ATLAS[nextMapId];

  if (!nextMap) {
    return false;
  }

  const { width, height } = getMapDimensions(nextMap);
  const size = getVehicleSize(vehicle, vehicle.facing);

  let arrivalX = vehicle.x;
  let arrivalY = vehicle.y;

  if (direction === "left") {
    arrivalX = width - size.width;
  }

  if (direction === "right") {
    arrivalX = 0;
  }

  if (direction === "up") {
    arrivalY = height - size.height;
  }

  if (direction === "down") {
    arrivalY = 0;
  }

  /*
    Temporarily point the existing collision system at the
    destination map. This lets canVehicleOccupy() inspect the
    next sector instead of the sector being exited.
  */
  const oldWorldMapId = worldState.currentMapId;
  const oldVehicleMapId = vehicle.mapId;

  worldState.currentMapId = nextMapId;
  vehicle.mapId = nextMapId;

  const canEnterNextMap = canVehicleOccupy(
    vehicle,
    arrivalX,
    arrivalY,
    vehicle.facing
  );

  /*
    Restore the original state before deciding whether the
    transition succeeds.
  */
  worldState.currentMapId = oldWorldMapId;
  vehicle.mapId = oldVehicleMapId;

  if (!canEnterNextMap) {
    return false;
  }

  vehicle.mapId = nextMapId;
  vehicle.x = arrivalX;
  vehicle.y = arrivalY;

  nextMap.discovered = true;

  return true;
}

/* =============================================================
   13. COLLISION SYSTEM
   ============================================================= */

function isOutsideTerrainPassable(x, y, forVehicle = false) {
  const map = getCurrentMap();
  const symbol = getTileSymbol(x, y, map);
  const tile = OUTSIDE_TILES[symbol];

  if (!tile) return false;
  return forVehicle ? tile.driveable : tile.walkable;
}

function isInteriorTerrainPassable(x, y) {
  const map = getCurrentMap();
  const symbol = getTileSymbol(x, y, map);
  return Boolean(INTERIOR_TILES[symbol]?.walkable);
}

function getBuildingCollisionAt(mapId, x, y) {
  for (const stamp of buildingStamps) {
    if (stamp.mapId !== mapId) continue;

    const definition = getBuildingDefinition(stamp);
    const localX = x - stamp.x;
    const localY = y - stamp.y;

    if (
      localX < 0 || localY < 0 ||
      localX >= definition.width ||
      localY >= definition.height
    ) {
      continue;
    }

    const maskSymbol = definition.collisionMask[localY]?.[localX] ?? ".";
    if (maskSymbol !== ".") {
      return { stamp, definition, maskSymbol };
    }
  }

  return null;
}

function isOccupiedByCharacter(x, y, ignoreId = null) {
  return characters.some(character =>
    character.id !== ignoreId &&
    character.visible &&
    !character.defeated &&
    character.mapId === worldState.currentMapId &&
    character.x === x &&
    character.y === y
  );
}

/* teleportation safety arrival */

function isTileOccupiedByVehicle(mapId, x, y) {
  return vehicles.some(vehicle => {
    if (vehicle.mapId !== mapId) return false;

    return getVehicleOccupiedTiles(vehicle).some(
      tile => tile.x === x && tile.y === y
    );
  });
}

function findSafePlayerArrival(mapId, preferredX, preferredY) {
  const offsets = [
    { x: 0, y: 0 },

    { x: 0, y: -1 },
    { x: 1, y: 0 },
    { x: 0, y: 1 },
    { x: -1, y: 0 },

    { x: 1, y: -1 },
    { x: 1, y: 1 },
    { x: -1, y: 1 },
    { x: -1, y: -1 },

    { x: 0, y: -2 },
    { x: 2, y: 0 },
    { x: 0, y: 2 },
    { x: -2, y: 0 }
  ];

  const map = ATLAS[mapId];

  for (const offset of offsets) {
    const x = preferredX + offset.x;
    const y = preferredY + offset.y;

    if (
      x < 0 ||
      y < 0 ||
      x >= OUTSIDE_MAP_SIZE ||
      y >= OUTSIDE_MAP_SIZE
    ) {
      continue;
    }

    const symbol = map.tiles[y][x];
    const tileDefinition = OUTSIDE_TILES[symbol];

    if (!tileDefinition?.walkable) {
      continue;
    }

    if (isTileOccupiedByVehicle(mapId, x, y)) {
      continue;
    }

    return { x, y };
  }

  return null;
}

/* normal vehicle occupy code */

function isOccupiedByVehicle(x, y, ignoreVehicleId = null) {
  return vehicles.some(vehicle => {
    if (vehicle.id === ignoreVehicleId) return false;
    if (vehicle.mapId !== worldState.currentMapId) return false;

    return getVehicleOccupiedTiles(vehicle).some(tile =>
      tile.x === x && tile.y === y
    );
  });
}

function canPlayerWalkTo(x, y) {
  if (!inBounds(x, y)) return false;

  if (isOutsideMap()) {
    if (!isOutsideTerrainPassable(x, y, false)) return false;
    if (getBuildingCollisionAt(worldState.currentMapId, x, y)?.maskSymbol === "X") return false;
  } else {
    if (!isInteriorTerrainPassable(x, y)) return false;
  }

  if (isOccupiedByCharacter(x, y)) return false;
  if (isOccupiedByVehicle(x, y)) return false;
  if (isDroppedHereoBackpackAt(x, y)) return false;

  const deployedShield = getDeployedLaserShieldAt(
  worldState.currentMapId,
  x,
  y
);

if (deployedShield) {
  return false;
}

  return true;
}

function canVehicleOccupy(vehicle, x, y, facing) {
  const proposedTiles = getVehicleOccupiedTiles(vehicle, x, y, facing);

  for (const tile of proposedTiles) {
    if (!inBounds(tile.x, tile.y)) return false;
    if (!isOutsideTerrainPassable(tile.x, tile.y, true)) return false;

    const collision = getBuildingCollisionAt(worldState.currentMapId, tile.x, tile.y);
    if (collision && collision.maskSymbol !== ".") return false;

    if (isOccupiedByCharacter(tile.x, tile.y)) return false;
    if (isDroppedHereoBackpackAt(tile.x, tile.y)) return false;
  }

  for (const otherVehicle of vehicles) {
    if (otherVehicle.id === vehicle.id) continue;
    if (otherVehicle.mapId !== worldState.currentMapId) continue;

    if (rectanglesOverlap(proposedTiles, getVehicleOccupiedTiles(otherVehicle))) {
      return false;
    }
  }

  return true;
}

/* =============================================================
   14. PLAYER MOVEMENT
   ============================================================= */

function movePlayer(direction) {
  if (player.mode !== "walking") return;

  if (player.carryingHereoBackpack) {
    player.backpackMoveToggle = !player.backpackMoveToggle;

    if (player.backpackMoveToggle) {
      player.facing = direction;
      drawGame();
      return;
    }
  }

  player.facing = direction;
  const vector = DIRECTIONS[direction];
  const nextX = player.x + vector.dx;
  const nextY = player.y + vector.dy;

  if (isOutsideMap() && !inBounds(nextX, nextY)) {
    if (transitionWalkingAcrossAtlasEdge(direction)) drawGame();
    return;
  }

  if (!canPlayerWalkTo(nextX, nextY)) {
    setMessage("That route is blocked.");
    drawGame();
    return;
  }

  player.x = nextX;
  player.y = nextY;
  updateWorldAfterMovement();
  drawGame();
}

/* cargo */

function dropInventoryItem(itemId) {
  const item = ITEM_DEFINITIONS[itemId];

  if (!item || !hasItem(itemId)) {
    setMessage("That item is not available to drop.");
    return;
  }

  // Remove its equipped status before removing it from inventory.
  unequipItem(itemId);

  if (!removeItem(itemId)) {
    setMessage(`${item.name} could not be removed from inventory.`);
    return;
  }

  worldState.droppedItems.push({
    itemId,
    mapId: worldState.currentMapId,
    x: player.x,
    y: player.y
  });

  closeOverlay();

  showBubble(
    item.name.toUpperCase(),
    `Yoi places the ${item.name} on the ground.`
  );

  drawGame();
}

function findNearbyDroppedItem() {
  const checks = [
    { x: player.x, y: player.y },

    ...CARDINAL_DIRECTION_VECTORS.map(vector => ({
      x: player.x + vector.dx,
      y: player.y + vector.dy
    }))
  ];

  return worldState.droppedItems.find(droppedItem => {
    if (droppedItem.mapId !== worldState.currentMapId) {
      return false;
    }

    return checks.some(spot =>
      spot.x === droppedItem.x &&
      spot.y === droppedItem.y
    );
  }) || null;
}

function pickUpDroppedItem(droppedItem) {
  if (!droppedItem) {
    setMessage("There is no dropped item within reach.");
    return;
  }

  const item = ITEM_DEFINITIONS[droppedItem.itemId];

  if (!item) {
    setMessage("That dropped object has no matching item definition.");
    return;
  }

  const index = worldState.droppedItems.indexOf(droppedItem);

  if (index === -1) {
    setMessage(`${item.name} is no longer there.`);
    return;
  }

  worldState.droppedItems.splice(index, 1);
  addItem(droppedItem.itemId);

  showBubble(
    item.name.toUpperCase(),
    `Yoi picks up the ${item.name}.`
  );

  drawGame();
}

function ensureVehicleCargo(vehicle) {
  if (!Array.isArray(vehicle.cargo)) {
    vehicle.cargo = [];
  }

  return vehicle.cargo;
}

function vehicleHasCargo(vehicle, itemId) {
  return ensureVehicleCargo(vehicle).includes(itemId);
}

function removeCargoFromVehicle(vehicle, itemId) {
  const cargo = ensureVehicleCargo(vehicle);
  const index = cargo.indexOf(itemId);

  if (index === -1) return false;

  cargo.splice(index, 1);
  return true;
}

function storeInventoryItemInVehicle(vehicle, itemId) {
  const item = ITEM_DEFINITIONS[itemId];

  if (!item || !hasItem(itemId)) {
    setMessage("That item is not available to store.");
    return;
  }

  if (!canVehicleStoreItem(vehicle, itemId)) {
    setMessage("Vehicle too full.");
    return;
  }

  unequipItem(itemId);

  if (!removeItem(itemId)) {
    setMessage(`${item.name} could not be removed from inventory.`);
    return;
  }

  ensureVehicleCargo(vehicle).push(itemId);

  setMessage(`${item.name} stored in vehicle cargo.`);
  drawGame();
  openVehicleCargoMenu(vehicle);
}

function takeInventoryItemFromVehicle(vehicle, itemId) {
  const item = ITEM_DEFINITIONS[itemId];

  if (!item) {
    setMessage("That cargo item has no matching item definition.");
    return;
  }

  /*
    Unique equipment cannot be duplicated in Yoi's inventory.

    Stackable supplies may be removed one unit at a time even when
    Yoi already possesses another copy.
  */
  if (!isItemStackable(itemId) && hasItem(itemId)) {
    setMessage(`${item.name} is already in Yoi's inventory.`);
    return;
  }

  if (!canPlayerCarryItem(itemId)) {
    setMessage("Inventory too full.");
    return;
  }

  /*
    Add the item first.

    Only remove it from the vehicle after the inventory transfer
    has definitely succeeded. This prevents cargo from vanishing
    if another inventory rule rejects the transfer.
  */
  if (!addItem(itemId)) {
    setMessage(`${item.name} could not be added to Yoi's inventory.`);
    return;
  }

  if (!removeCargoFromVehicle(vehicle, itemId)) {
    /*
      Extremely defensive rollback. This should rarely occur, but
      it keeps the item from being duplicated if the cargo changed.
    */
    removeItem(itemId);

    setMessage(`${item.name} is no longer inside this vehicle.`);
    return;
  }

  setMessage(`${item.name} removed from vehicle cargo.`);
  drawGame();
  openVehicleCargoMenu(vehicle);
}

function storeCarriedBackpackInVehicle(vehicle) {
  if (!player.carryingHereoBackpack) {
    setMessage("Yoi is not carrying the HTI calibration backpack.");
    return;

  if (vehicleHasCargo(vehicle, "hereoBackpack")) {

}

function isDroppedHereoBackpackAt(x, y, mapId = worldState.currentMapId) {

function findNearbyDroppedHereoBackpack() {

  if (!backpack) return null;

function getAdjacentVehicle() {
  const checks = CARDINAL_DIRECTION_VECTORS.map(vector => ({
    x: player.x + vector.dx,
    y: player.y + vector.dy
  }));

  return vehicles.find(vehicle => {
    if (vehicle.mapId !== worldState.currentMapId) return false;

    return getVehicleOccupiedTiles(vehicle).some(tile =>
      checks.some(check =>
        check.x === tile.x &&
        check.y === tile.y
      )
    );
  }) || null;
}

function canBoardVehicle(vehicle) {
  const definition = getVehicleDefinition(vehicle);

  if (!vehicle.boardable) {
    return {
      allowed: false,
      reason:
        `${definition.name} is locked and not available to operate.`
    };
  }

  if (
    definition.requiredEquippedBadgeId &&
    player.equippedBadgeId !==
      definition.requiredEquippedBadgeId
  ) {
    return {
      allowed: false,
      reason:
        `Equip ${
          ITEM_DEFINITIONS[
            definition.requiredEquippedBadgeId
          ].name
        } first.`
    };
  }

  return {
    allowed: true,
    reason: ""
  };
}

function enterVehicle(vehicle) {
  const definition = getVehicleDefinition(vehicle);

  /*
    Unpurchased luxury snowcrafts open their sales menu
    instead of allowing immediate boarding.
  */
  if (
    definition.family === "luxurySnowcraft" &&
    !vehicle.purchased
  ) {
    openLuxurySnowcraftPurchaseMenu(vehicle);
    return;
  }

  const access = canBoardVehicle(vehicle);

  if (!access.allowed) {
    showBubble(
      "VEHICLE ACCESS",
      access.reason
    );

    return;
  }

  player.mode = "driving";
updateMobileDrivingAppearance();

player.vehicleId = vehicle.id;
  player.mapId = vehicle.mapId;
  player.x = vehicle.x;
  player.y = vehicle.y;

  if (definition.hasDoorSound) {
    playSound(SOUNDS.carDoor);
  }

  startVehicleSound(vehicle);

  setMessage(
    `Driving ${definition.name}. Fuel: ${vehicle.fuel.toFixed(2)}`
  );

  drawGame();
}

function getPossibleExitPositions(vehicle) {
  const size = getVehicleSize(vehicle);

  const besideDoorByFacing = {
    right: {
      // Above the car, one tile back from the front.
      x: vehicle.x + size.width - 2,
      y: vehicle.y - 1
    },

    left: {
      // Below the car, one tile back from the front.
      x: vehicle.x + 1,
      y: vehicle.y + size.height
    },

    up: {
      // Left of the car, one tile back from the front.
      x: vehicle.x - 1,
      y: vehicle.y + 1
    },

    down: {
      // Right of the car, one tile back from the front.
      x: vehicle.x + size.width,
      y: vehicle.y + size.height - 2
    }
  };

  return [besideDoorByFacing[vehicle.facing]];
}

function exitVehicle() {
  const vehicle = getCurrentVehicle();
  if (!vehicle) return;

  const exitSpot = getPossibleExitPositions(vehicle).find(spot =>
    canPlayerWalkToIgnoringCurrentVehicle(spot.x, spot.y, vehicle.id)
  );

  if (!exitSpot) {
    setMessage("There is no safe place to exit.");
    return;
  }

  const definition = getVehicleDefinition(vehicle);

  player.mode = "walking";
updateMobileDrivingAppearance();

player.vehicleId = null;
  player.x = exitSpot.x;
  player.y = exitSpot.y;
  player.mapId = worldState.currentMapId;

  stopAllVehicleSounds();
  if (definition.hasDoorSound) playSound(SOUNDS.carDoor);

  setMessage(`Exited ${definition.name}.`);
  drawGame();
}

function canPlayerWalkToIgnoringCurrentVehicle(x, y, vehicleId) {
  if (!inBounds(x, y)) return false;

  if (isOutsideMap()) {
    if (!isOutsideTerrainPassable(x, y, false)) return false;
    if (getBuildingCollisionAt(worldState.currentMapId, x, y)?.maskSymbol === "X") return false;
  } else {
    if (!isInteriorTerrainPassable(x, y)) return false;
  }

  if (isOccupiedByCharacter(x, y)) return false;
  if (isOccupiedByVehicle(x, y, vehicleId)) return false;

  return true;
}

// Player or NPC drives vehicle.

function attemptVehicleMove(
  vehicle,
  direction,
  {
    driverType = "npc",
    consumeFuel = true,
    allowAtlasTransition = true,
    redraw = true
  } = {}
) {
  if (!vehicle) return false;

  const vector = DIRECTIONS[direction];

  if (!vector) {
    console.warn(
      `Unknown vehicle movement direction: ${direction}`
    );

    return false;
  }

  /*
    Preserve the vehicle's starting map before an atlas transition
    changes vehicle.mapId. Cleanup checks need both the old and new
    map IDs.
  */
  const previousMapId = vehicle.mapId;

  const definition = getVehicleDefinition(vehicle);

  if (consumeFuel && vehicle.fuel <= 0) {
    if (driverType === "player") {
      setMessage(`${definition.name} is out of fuel.`);
    }

    return false;
  }

  const cardinalMovement =
    isCardinalDirection(direction);

  const diagonalMovement =
    isDiagonalDirection(direction);

  /*
    Reversing only applies to cardinal movement.

    Diagonal movement preserves the vehicle's most recently
    established cardinal facing.
  */
  const reversing =
    cardinalMovement &&
    definition.family !== "snowmobile" &&
    isOppositeDirection(
      vehicle.facing,
      direction
    );

  /*
    Cardinal movement may change visual facing.

    Diagonal movement retains the most recent cardinal facing
    because vehicles do not have diagonal sprites.
  */
  const visualFacing = cardinalMovement
    ? reversing
      ? vehicle.facing
      : direction
    : vehicle.facing;

  const nextX = vehicle.x + vector.dx;
  const nextY = vehicle.y + vector.dy;

  const nextSize = getVehicleSize(
    vehicle,
    visualFacing
  );

  const map =
    ATLAS[vehicle.mapId] ||
    BLUEPRINTS[vehicle.mapId];

  const mapDimensions =
    getMapDimensions(map);

  const crossesEdge =
    nextX < 0 ||
    nextY < 0 ||
    nextX + nextSize.width >
      mapDimensions.width ||
    nextY + nextSize.height >
      mapDimensions.height;

  /*
    Do not permit diagonal atlas transitions yet.

    A diagonal edge crossing could attempt to enter two neighboring
    sectors simultaneously. Cardinal movement remains responsible
    for atlas transitions.
  */
  if (crossesEdge && diagonalMovement) {
    if (driverType === "player") {
      setMessage(
        "Use a cardinal direction to cross sectors."
      );

      if (redraw) {
        drawGame();
      }
    }

    return false;
  }

  if (crossesEdge) {
    if (
      !allowAtlasTransition ||
      !ATLAS[vehicle.mapId]
    ) {
      return false;
    }

    vehicle.facing = visualFacing;
    vehicle.reversing = reversing;

    const transitioned =
      transitionVehicleAcrossAtlasEdgeFor(
        vehicle,
        direction
      );

    if (!transitioned) {
      if (driverType === "player") {
        setMessage(
          "The route into the next sector is blocked."
        );

        if (redraw) {
          drawGame();
        }
      }

      return false;
    }
  } else {
    const oldMapId =
      worldState.currentMapId;

    /*
      Collision helpers currently inspect worldState.currentMapId.
      Temporarily point them at the vehicle's actual map so NPC
      vehicles can move even while Yoi is somewhere else.
    */
    worldState.currentMapId =
      vehicle.mapId;

    let canMove = false;

    /*
      For diagonal movement, first confirm that both cardinal
      component routes are open.

      This prevents large vehicles from slipping diagonally through
      touching corners.
    */
    if (diagonalMovement) {
      const horizontalX =
        vehicle.x + vector.dx;

      const horizontalY =
        vehicle.y;

      const verticalX =
        vehicle.x;

      const verticalY =
        vehicle.y + vector.dy;

      const horizontalClear =
        canVehicleOccupy(
          vehicle,
          horizontalX,
          horizontalY,
          visualFacing
        );

      const verticalClear =
        canVehicleOccupy(
          vehicle,
          verticalX,
          verticalY,
          visualFacing
        );

      const diagonalClear =
        canVehicleOccupy(
          vehicle,
          nextX,
          nextY,
          visualFacing
        );

      canMove =
        horizontalClear &&
        verticalClear &&
        diagonalClear;
    } else {
      canMove = canVehicleOccupy(
        vehicle,
        nextX,
        nextY,
        visualFacing
      );
    }

    worldState.currentMapId =
      oldMapId;

    if (!canMove) {
      /*
        Cardinal commands may rotate the vehicle toward the blocked
        route.

        Diagonal commands preserve the existing cardinal facing.
      */
      if (
        cardinalMovement &&
        !reversing
      ) {
        vehicle.facing =
          visualFacing;
      }

      vehicle.reversing = false;

      if (driverType === "player") {
        setMessage(
          "Vehicle route blocked."
        );
      }

      if (
        redraw &&
        vehicle.mapId ===
          worldState.currentMapId
      ) {
        drawGame();
      }

      return false;
    }

    vehicle.x = nextX;
    vehicle.y = nextY;
    vehicle.facing = visualFacing;
    vehicle.reversing = reversing;
  }

  if (consumeFuel) {
    consumeVehicleFuelSilently(
      vehicle
    );
  }

  if (driverType === "player") {
    player.x = vehicle.x;
    player.y = vehicle.y;
    player.mapId = vehicle.mapId;

    worldState.currentMapId =
      vehicle.mapId;

    triggerStragCEObstructionEvent();

    if (crossesEdge) {
      runMapTransitionCleanup(
        previousMapId,
        vehicle.mapId
      );

      checkBeerMineNet();
    }

    const action = reversing
      ? "Reversing"
      : "Driving";

    setMessage(
      `${action} ${definition.name} · ` +
      `Fuel ${vehicle.fuel.toFixed(2)} / ` +
      `${definition.fuelCapacity}`
    );
  }

  if (
    redraw &&
    vehicle.mapId ===
      worldState.currentMapId
  ) {
    drawGame();
  }

  return true;
}

// consume fuel helper

function consumeVehicleFuelSilently(vehicle) {
  const definition = getVehicleDefinition(vehicle);

  vehicle.fuel = Math.max(
    0,
    vehicle.fuel - definition.fuelPerStep
  );
}

/*
  PLAYER VEHICLE CONTROL WRAPPER

  The player and NPCs now use the same physical vehicle engine.
  This small function merely tells the shared engine that the
  player is currently issuing the driving command.
*/
function moveVehicle(direction) {
  const vehicle = getCurrentVehicle();

  if (!vehicle || player.mode !== "driving") {
    return;
  }

  attemptVehicleMove(vehicle, direction, {
    driverType: "player",
    consumeFuel: true,
    allowAtlasTransition: true,
    redraw: true
  });
}

function consumeVehicleFuel(vehicle) {
  const definition = getVehicleDefinition(vehicle);
  vehicle.fuel = Math.max(0, vehicle.fuel - definition.fuelPerStep);
  setMessage(`${definition.name} · Fuel ${vehicle.fuel.toFixed(2)} / ${definition.fuelCapacity}`);
}

function findAdjacentFuelPump() {
  return CARDINAL_DIRECTION_VECTORS
    .map(vector => ({
      x: player.x + vector.dx,
      y: player.y + vector.dy
    }))
    .find(
      spot => getTileSymbol(spot.x, spot.y) === "g"
    ) || null;
}

function findNearbyVehicle(range = 5) {
  return vehicles.find(vehicle => {
    if (vehicle.mapId !== worldState.currentMapId) return false;

    const distance =
      Math.abs(vehicle.x - player.x) +
      Math.abs(vehicle.y - player.y);

    return distance <= range;
  }) || null;
}

function getStorageCrateAt(mapId, x, y) {
  return STORAGE_CRATES.find(crate =>
    crate.mapId === mapId &&
    crate.x === x &&
    crate.y === y
  ) || null;
}

function openStorageCrate(crate) {
  if (!crate) {
    showBubble(
      "STORAGE CRATE",
      "This storage crate has no registered contents."
    );
    return;
  }

  if (
    !Array.isArray(crate.inventory) ||
    crate.inventory.length === 0
  ) {
    showBubble(
      "STORAGE CRATE",
      "The storage crate is empty."
    );
    return;
  }

  const retrievedItemIds = [];
  const remainingItemIds = [];

  for (const itemId of crate.inventory) {
    const itemAdded = addItem(itemId);

    if (itemAdded) {
      retrievedItemIds.push(itemId);
    } else {
      remainingItemIds.push(itemId);
    }
  }

  crate.inventory = remainingItemIds;

  const retrievedNames = retrievedItemIds.map(itemId => {
    return ITEM_DEFINITIONS[itemId]?.name || itemId;
  });

  const remainingNames = remainingItemIds.map(itemId => {
    return ITEM_DEFINITIONS[itemId]?.name || itemId;
  });

  if (retrievedItemIds.length === 0) {
    showBubble(
      "INVENTORY TOO FULL",
      "Make room before retrieving anything from this storage crate."
    );
    return;
  }

  if (remainingItemIds.length > 0) {
    showBubble(
      "STORAGE CRATE",
      `Retrieved: ${retrievedNames.join(", ")}. ` +
      `Still inside: ${remainingNames.join(", ")}.`
    );
    return;
  }

  showBubble(
    "STORAGE CRATE",
    `Retrieved: ${retrievedNames.join(", ")}.`
  );
}

      "This locker is not connected to the registered locker network."

    return;
  }

  /*
    Preserve the existing individual lock and keycard behavior.

    A locked locker must still be opened before it can access
    either part of the shared locker network.
  */
  if (locker.locked) {
    const requiredItemId =
      locker.requiredItemId;

    if (
      !requiredItemId ||
      !hasItem(requiredItemId)
    ) {
      showBubble(
        "LOCKED",
        "The locker is locked."
      );

      return;
    }

    locker.locked = false;

    showBubble(
      "LOCKER UNLOCKED",
      "The lock disengages."
    );

    return;
  }

  openOverlay({
    title: "STRO LOCKER NETWORK",
    image: ASSETS.props.locker,

    text:
      "This locker provides access to Yoi's dependable shared storage, " +
      "along with unclaimed objects circulating through abandoned lockers across Stro.",

    options: [

        label: "Access main cache",
        action: openLockerMainCache

function depositMainLockerItem(

  inventoryIndex

    ITEM_DEFINITIONS[itemId];

  if (

  LOCKER_MAIN_CACHE.push(

function getRandomLockerSelection() {
  if (
    COMMUNAL_LOCKER_ITEMS.length === 0
  ) {
    return [];
  }

  const maximumVisible =
    Math.min(
      3,
      COMMUNAL_LOCKER_ITEMS.length
    );

  const visibleCount =
    1 +
    Math.floor(
      Math.random() *
      maximumVisible
    );

  /*
    Shuffle a copy.

    The real communal collection is untouched until
    Yoi actually takes an item.
  */
  const shuffledItems = [
    ...COMMUNAL_LOCKER_ITEMS
  ];

  for (
    let index =
      shuffledItems.length - 1;

    index > 0;

    index -= 1
  ) {
    const randomIndex =
      Math.floor(
        Math.random() *
        (index + 1)
      );

    [
      shuffledItems[index],
      shuffledItems[randomIndex]
    ] = [
      shuffledItems[randomIndex],
      shuffledItems[index]
    ];
  }

  return shuffledItems.slice(
    0,
    visibleCount
  );
}

function spendMerit(amount) {
  if (player.merit < amount) return false;
  player.merit -= amount;
  return true;
}

function pourGasJugIntoVehicle(vehicle) {
  const definition = getVehicleDefinition(vehicle);

  if (player.gasJugFuel <= 0) {
    closeOverlay();
    showBubble("GAS JUG", "The gas jug is empty.");
    return;
  }

  const missingFuel = definition.fuelCapacity - vehicle.fuel;

  if (missingFuel <= 0) {
    closeOverlay();
    showBubble(
      "GAS JUG",
      `${definition.name} already has a full fuel tank.`
    );
    return;
  }

  const transferredFuel = Math.min(
    player.gasJugFuel,
    missingFuel
  );

  vehicle.fuel += transferredFuel;
  player.gasJugFuel -= transferredFuel;

  closeOverlay();

  showBubble(
    "GAS JUG",
    `Poured ${transferredFuel.toFixed(2)} fuel into ${definition.name}. ` +
    `Jug remaining: ${player.gasJugFuel.toFixed(2)}.`
  );

  drawGame();
}

  openOverlay({

      {

      },

        action: () => {

          enterVehicle(vehicle);
        }
      },

      }
    ]
  });
}

function refuelVehicle(vehicle) {
  if (!spendMerit(25)) {
    setMessage("Not enough Merit.");
    return;
  }

  const definition = getVehicleDefinition(vehicle);
  vehicle.fuel = Math.min(definition.fuelCapacity, vehicle.fuel + 20);
  closeOverlay();
  showBubble("STRO FUEL", `${definition.name} refueled.`);
}

function fillGasJug() {
  if (!hasItem("gasJug")) {
    setMessage("You need a gas jug.");
    return;
  }

  if (!spendMerit(25)) {
    setMessage("Not enough Merit.");
    return;
  }

  player.gasJugFuel = ITEM_DEFINITIONS.gasJug.capacity;
  closeOverlay();
  showBubble("STRO FUEL", "Gas jug filled.");
}

function useGasJugOnVehicle(vehicle) {
  if (!hasItem("gasJug") || player.gasJugFuel <= 0) {
    showBubble("GAS JUG", "The gas jug is empty.");
    return;
  }

  const definition = getVehicleDefinition(vehicle);
  const transferred = Math.min(
    player.gasJugFuel,
    definition.fuelCapacity - vehicle.fuel
  );

  vehicle.fuel += transferred;
  player.gasJugFuel -= transferred;

  showBubble(
    "GAS JUG",
    `${transferred.toFixed(1)} fuel transferred to ${definition.name}.`
  );
}

  if (!hasItem("binoculars")) return false;

  if (player.binocularsCondition !== "broken") return false;

  player.binocularsCondition = "operational";

  camera.classList.add("binocular-active");

  player.binocularMapId = worldState.currentMapId;
  player.binocularCameraX = player.x;
  player.binocularCameraY = player.y;

  setMessage(

function moveBinocularCamera(direction) {
  const vector = DIRECTIONS[direction];
  if (!vector) return;

  player.binocularCameraX += vector.dx;
  player.binocularCameraY += vector.dy;

  const viewedMap = getViewedMap();
  const { width, height } = getMapDimensions(viewedMap);

  /*
    Operational binoculars remain confined to Yoi's current map.

    Enhanced binoculars may cross atlas-sector edges,
    but only while observing outside maps.
  */
  const canCrossAtlas =
    player.binocularsCondition === "enhanced" &&
    isOutsideMap(player.binocularMapId);

  if (!canCrossAtlas) {
    player.binocularCameraX = Math.max(
      0,
      Math.min(width - 1, player.binocularCameraX)
    );

    player.binocularCameraY = Math.max(
      0,
      Math.min(height - 1, player.binocularCameraY)
    );

    updateCamera();
    return;
  }

  let crossedEdge = false;

  if (player.binocularCameraX < 0) {
    player.binocularMapId =
      getAdjacentAtlasCode(player.binocularMapId, "left");

    const nextMap = getViewedMap();
    const nextDimensions = getMapDimensions(nextMap);

    player.binocularCameraX = nextDimensions.width - 1;
    crossedEdge = true;
  } else if (player.binocularCameraX >= width) {
    player.binocularMapId =
      getAdjacentAtlasCode(player.binocularMapId, "right");

    player.binocularCameraX = 0;
    crossedEdge = true;
  }

  if (player.binocularCameraY < 0) {
    player.binocularMapId =
      getAdjacentAtlasCode(player.binocularMapId, "up");

    const nextMap = getViewedMap();
    const nextDimensions = getMapDimensions(nextMap);

    player.binocularCameraY = nextDimensions.height - 1;
    crossedEdge = true;
  } else if (player.binocularCameraY >= height) {
    player.binocularMapId =
      getAdjacentAtlasCode(player.binocularMapId, "down");

    player.binocularCameraY = 0;
    crossedEdge = true;
  }

  if (crossedEdge) {
    drawGame();

    const map = getViewedMap();

    setMessage(
      `ENHANCED BINOCULARS · Observing ${player.binocularMapId} · ${map.title}`
    );

    return;
  }

  updateCamera();
}
