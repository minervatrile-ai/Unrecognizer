/* =============================================================
   18. BUILDING ENTRY AND BLUEPRINT EXIT
   ============================================================= */

function getAdjacentBuildingEntrance() {
  const checks = CARDINAL_DIRECTION_VECTORS.map(vector => ({
    x: player.x + vector.dx,
    y: player.y + vector.dy
  }));

  for (const check of checks) {
    const collision = getBuildingCollisionAt(
      worldState.currentMapId,
      check.x,
      check.y
    );

    if (collision?.maskSymbol === "D") {
      return collision;
    }
  }

  return null;
}

function enterBuilding(stamp, definition) {
  const blueprintId =
    stamp.blueprintId ||
    definition.blueprintId;

  const blueprint = BLUEPRINTS[blueprintId];

  if (!blueprintId || !blueprint) {
    showBubble(
      definition.name.toUpperCase(),
      "This interior has not been built yet."
    );
    return;
  }

  if (!blueprint.spawn) {
    console.warn(
      `Blueprint "${blueprintId}" has no spawn coordinate.`
    );

    showBubble(
      definition.name.toUpperCase(),
      "This interior has no valid entry position."
    );
    return;
  }

  worldState.previousOutsidePosition = {
    mapId: worldState.currentMapId,
    x: player.x,
    y: player.y
  };

  worldState.currentMapId = blueprintId;
  player.mapId = blueprintId;

  player.x = blueprint.spawn.x;
  player.y = blueprint.spawn.y;

  player.mode = "walking";
  player.vehicleId = null;

  setMessage(`Entered ${definition.name}.`);
  drawGame();
}

function exitBlueprint(exit) {
  const destination =
    exit?.destination ||
    worldState.previousOutsidePosition;

  if (!destination) {
    setMessage("This exit has no registered destination.");
    return;
  }

  worldState.currentMapId = destination.mapId;
  player.mapId = destination.mapId;
  player.x = destination.x;
  player.y = destination.y;

  worldState.previousOutsidePosition = null;

  const outsideMap = ATLAS[destination.mapId];

  setMessage(
    outsideMap
      ? `Returned to ${outsideMap.title}.`
      : `Exited to ${destination.mapId}.`
  );

  drawGame();
}

/*
  Returns true when a coordinate has been declared as an exit inside
  the currently active blueprint.

  This separates exit behavior from door artwork:
  - D may be an ordinary interior door.
  - D may also be an outside exit when its coordinate appears in exits.
  - Any other visual symbol can become an exit the same way.
*/
function getBlueprintExitAt(mapId, x, y) {
  const blueprint = BLUEPRINTS[mapId];

  if (!blueprint || !Array.isArray(blueprint.exits)) {
    return null;
  }

  return blueprint.exits.find(exit =>
    exit.x === x &&
    exit.y === y
  ) || null;
}

function getNearestResidentBlueprintExit(character) {
  if (!character) {
    return null;
  }

  const blueprint = BLUEPRINTS[character.mapId];

  if (
    !blueprint ||
    !Array.isArray(blueprint.exits)
  ) {
    return null;
  }

  const usableExits = blueprint.exits.filter(
    exit => exit.destination
  );

  if (usableExits.length === 0) {
    return null;
  }

  let nearestExit = usableExits[0];
  let nearestDistance = Infinity;

  for (const exit of usableExits) {
    const distance =
      Math.abs(character.x - exit.x) +
      Math.abs(character.y - exit.y);

    if (distance < nearestDistance) {
      nearestExit = exit;
      nearestDistance = distance;
    }
  }

  return nearestExit;
}

function getAdjacentOutsideInteraction() {
  if (!isOutsideMap()) return null;

  for (const direction of CARDINAL_DIRECTION_VECTORS) {
    const x = player.x + direction.dx;
    const y = player.y + direction.dy;

    const symbol = getTileSymbol(x, y);
    const tile = OUTSIDE_TILES[symbol];

    if (tile?.interaction) {
      return {
        interaction: tile.interaction,
        x,
        y
      };
    }
  }

  return null;
}

function getAdjacentInteriorInteraction() {
  if (isOutsideMap()) return null;

  for (const direction of CARDINAL_DIRECTION_VECTORS) {
    const x = player.x + direction.dx;
    const y = player.y + direction.dy;

    const blueprintExit = getBlueprintExitAt(
      worldState.currentMapId,
      x,
      y
    );

    if (blueprintExit) {
      return {
        interaction: "exitBlueprint",
        x,
        y,
        exit: blueprintExit
      };
    }

    const symbol = getTileSymbol(x, y);
    const tile = INTERIOR_TILES[symbol];

    if (tile?.interaction) {
      return {
        interaction: tile.interaction,
        symbol,
        x,
        y
      };
    }
  }

  return null;
}

/* DEFENSE COMBAT SYSTEMS */

function findNearbyDeployedLaserShield() {
  const adjacentTiles = [
    { x: player.x,     y: player.y - 1 },
    { x: player.x + 1, y: player.y     },
    { x: player.x,     y: player.y + 1 },
    { x: player.x - 1, y: player.y     }
  ];

  for (const tile of adjacentTiles) {
    const shield = getDeployedLaserShieldAt(
      worldState.currentMapId,
      tile.x,
      tile.y
    );

    if (shield) {
      return shield;
    }
  }

  return null;
}

function pickUpDeployedLaserShield(shield) {
  if (!shield) {
    return false;
  }

  /*
    Make sure Yoi can carry the folded shield before
    removing the deployed world version.
  */
  if (!canPlayerCarryItem("laserShield")) {
    setMessage(
      "Yoi does not have enough inventory space for the laser shield."
    );
    return false;
  }

  const shieldIndex =
    worldState.deployedLaserShields.findIndex(candidate =>
      candidate.id === shield.id
    );

  if (shieldIndex === -1) {
    setMessage("The deployed laser shield could not be found.");
    return false;
  }

  /*
    Add the folded inventory item first.
  */
  if (!addItem("laserShield")) {
    setMessage("The laser shield could not be returned to inventory.");
    return false;
  }

  /*
    Remove the deployed world version only after
    the inventory addition succeeds.
  */
  worldState.deployedLaserShields.splice(shieldIndex, 1);

  showBubble(
    "LASER SHIELD",
    "Yoi folds the laser shield and returns it to inventory."
  );

  drawGame();
  return true;
}

function getDeployedLaserShieldAt(mapId, x, y) {
  return worldState.deployedLaserShields.find(shield =>
    shield.mapId === mapId &&
    shield.x === x &&
    shield.y === y
  ) || null;
}

function getLaserShieldAsset(shield) {
  switch (shield.facing) {
    case "up":
      return ASSETS.props.laserShieldUp;

    case "down":
      return ASSETS.props.laserShieldDown;

    case "left":
      return ASSETS.props.laserShieldLeft;

    case "right":
      return ASSETS.props.laserShieldRight;
  }

  return ASSETS.props.laserShieldUp;
}

function deployLaserShield() {
  const itemId = "laserShield";
  const item = ITEM_DEFINITIONS[itemId];

  if (!item || !hasItem(itemId)) {
    setMessage("Yoi does not have a laser shield to deploy.");
    return false;
  }

  const vector = DIRECTIONS[player.facing];
  const targetX = player.x + vector.dx;
  const targetY = player.y + vector.dy;
  const currentMapId = worldState.currentMapId;

  /*
    Keep deployment inside the current map.
  */
  if (!inBounds(targetX, targetY)) {
    setMessage("The laser shield cannot be deployed beyond the map boundary.");
    drawGame();
    return false;
  }

  /*
    Check for another deployed shield first.

    Later, canPlayerWalkTo() will also recognize shields as solid,
    so this specific check belongs before the general collision check.
  */
  const shieldAlreadyThere =
    worldState.deployedLaserShields.some(shield =>
      shield.mapId === currentMapId &&
      shield.x === targetX &&
      shield.y === targetY
    );

  if (shieldAlreadyThere) {
    setMessage("A laser shield is already deployed there.");
    drawGame();
    return false;
  }

  /*
    Prevent deployment on ordinary dropped items.
  */
  const droppedItemThere =
    worldState.droppedItems.some(droppedItem =>
      droppedItem.mapId === currentMapId &&
      droppedItem.x === targetX &&
      droppedItem.y === targetY
    );

  if (droppedItemThere) {
    setMessage("An item on the ground blocks shield deployment.");
    drawGame();
    return false;
  }

  /*
    Reject walls, vehicles, characters, props,
    and other locations Yoi could not normally enter.
  */
  if (!canPlayerWalkTo(targetX, targetY)) {
    setMessage("There is not enough open space to deploy the laser shield.");
    drawGame();
    return false;
  }

  /*
    Do not consume the inventory item until every check succeeds.
  */
  if (!removeItem(itemId)) {
    setMessage("The laser shield could not be removed from inventory.");
    return false;
  }

  /*
    Create the active world version.
  */
  worldState.deployedLaserShields.push({
    id:
      `laser-shield-${Date.now()}-` +
      Math.random().toString(36).slice(2, 8),

    mapId: currentMapId,
    x: targetX,
    y: targetY,

    facing: player.facing,

    integrity: 600,
    maxIntegrity: 600
  });

  closeOverlay();

  showBubble(
    "LASER SHIELD",
    `Yoi deploys the laser shield facing ${player.facing}.`
  );

  drawGame();
  return true;
}

function damageDeployedLaserShield(shield, damage) {
  if (!shield) return false;

  shield.integrity = Math.max(
    0,
    shield.integrity - damage
  );

  if (shield.integrity <= 0) {
    const shieldIndex =
      worldState.deployedLaserShields.findIndex(candidate =>
        candidate.id === shield.id
      );

    if (shieldIndex !== -1) {
      worldState.deployedLaserShields.splice(
        shieldIndex,
        1
      );
    }

    showBubble(
      "LASER SHIELD",
      "The laser shield overloads and collapses."
    );
  } else {
    setMessage(
      `LASER SHIELD HIT · Integrity: ` +
      `${shield.integrity}/${shield.maxIntegrity}`
    );
  }

  drawGame();
  return true;
}

function doesLaserShieldBlockProjectile(shield, projectile) {
  if (!shield || !projectile) {
    return false;
  }

  const incomingDirectionByShieldFacing = {
    up: "down",
    down: "up",
    left: "right",
    right: "left"
  };

  return (
    projectile.direction ===
    incomingDirectionByShieldFacing[shield.facing]
  );
}

/* =============================================================
   19. COMBAT AND PROJECTILES

   This is a clean baseline, not a final enemy-AI system.
   It retains weapon definitions, damage, range, projectiles,
   defeat state, and a generic combat target.
   ============================================================= */

function updateAimButtonAppearance() {

  const active = worldState.aimMode;

  mobileAim.classList.toggle(
    "aimModeActive",
    active
  );

  [
    mobileUp,
    mobileDown,
    mobileLeft,
    mobileRight
  ].forEach(button => {

    button.classList.toggle(
      "aimModeActive",
      active
    );

  });

}

function toggleAimMode() {
  worldState.aimMode = !worldState.aimMode;
  updateAimButtonAppearance();
}

function alertNearbyFactionMembers(
  triggeredCharacter,
  radius = 8
) {
  if (!triggeredCharacter) return;

  const triggeredDefinition =
    getCharacterDefinition(triggeredCharacter);

  const faction = triggeredDefinition?.faction;

  if (!faction) return;

  characters.forEach(character => {
    if (character === triggeredCharacter) return;

    if (character.mapId !== triggeredCharacter.mapId) return;

    const characterDefinition =
      getCharacterDefinition(character);

    if (characterDefinition?.faction !== faction) return;

    const distance =
      Math.abs(character.x - triggeredCharacter.x) +
      Math.abs(character.y - triggeredCharacter.y);

    if (distance > radius) return;

    character.autonomous = true;
    character.residentState = "attackingPlayer";
    character.stateTimer = 0;
    character.nextWeaponFireTime = 0;
  });
}   

function beginCombat(enemy) {
  if (!enemy || enemy.defeated) return;

  worldState.combatMode = true;
  worldState.combatEnemyId = enemy.id;
  setMessage(`COMBAT MODE · ${getCharacterDefinition(enemy).name}`);
}

function endCombat(message = "Combat ended.") {
  worldState.combatMode = false;
  worldState.combatEnemyId = null;
  setMessage(message);
}

function fireEquippedWeapon(direction = player.facing) {
  if (player.mode !== "walking") {
    setMessage("Exit the vehicle before firing.");
    return false;
  }

  const weapon =
    ITEM_DEFINITIONS[player.equippedWeaponId];

  if (
    !weapon ||
    weapon.category !== "weapon"
  ) {
    setMessage("No weapon equipped.");
    return false;
  }

  if (!PROJECTILE_DIRECTIONS[direction]) {
    console.warn(
      `Invalid projectile direction: ${direction}`
    );

    return false;
  }

  /*
    Cardinal aiming changes Yoi's visible facing.

    Diagonal firing does not, because Yoi currently
    has only four directional sprite facings.
  */
  if (DIRECTIONS[direction]) {
    player.facing = direction;
  }

  const projectile = {
    ownerId: "player",
    mapId: worldState.currentMapId,

    x: player.x,
    y: player.y,

    direction,
    damage: weapon.damage,
    rangeRemaining: weapon.range,
    image: weapon.projectileImage
  };

  worldState.projectiles.push(projectile);

  playSound(SOUNDS.laser);
  drawGame();
  animateProjectile();

  return true;
}

let projectileAnimationTimer = null;

function animateProjectile() {
  if (projectileAnimationTimer !== null) {
    return;
  }

  const stepDelay = 60;

  projectileAnimationTimer = setInterval(() => {
    if (worldState.projectiles.length === 0) {
      clearInterval(projectileAnimationTimer);
      projectileAnimationTimer = null;
      return;
    }

    const survivingProjectiles = [];

    for (const projectile of worldState.projectiles) {
      const finished =
        updateSingleProjectile(projectile);

      if (!finished) {
        survivingProjectiles.push(projectile);
      }
    }

    worldState.projectiles =
      survivingProjectiles;

    /*
      One complete redraw per projectile step,
      no matter how many beams are flying.
    */
    drawGame();
  }, stepDelay);
}

function getResidentWeapon(character) {
  const definition =
    getCharacterDefinition(character);

  if (!definition?.weaponId) {
    return null;
  }

  const weapon =
    ITEM_DEFINITIONS[definition.weaponId];

  if (
    !weapon ||
    weapon.category !== "weapon"
  ) {
    return null;
  }

  return weapon;
}


function getStraightDirectionToPlayer(character) {
  if (character.x === player.x) {
    return player.y < character.y
      ? "up"
      : "down";
  }

  if (character.y === player.y) {
    return player.x < character.x
      ? "left"
      : "right";
  }

  return null;
}


function residentHasClearShot(character, direction, range) {
  const vector = DIRECTIONS[direction];

  let x = character.x;
  let y = character.y;

  for (let step = 1; step <= range; step++) {
    x += vector.dx;
    y += vector.dy;

    if (!inBounds(x, y)) {
      return false;
    }

    if (
      x === player.x &&
      y === player.y
    ) {
      return true;
    }

    if (isProjectileBlocked(x, y)) {
      return false;
    }
  }

  return false;
}


function fireResidentWeapon(character) {
  const weapon =
    getResidentWeapon(character);

  if (!weapon) {
    return false;
  }

  const direction =
    getStraightDirectionToPlayer(character);

  if (!direction) {
    return false;
  }

  if (
    !residentHasClearShot(
      character,
      direction,
      weapon.range
    )
  ) {
    return false;
  }

  const now = Date.now();

  if (
    character.nextWeaponFireTime &&
    now < character.nextWeaponFireTime
  ) {
    return false;
  }

  character.facing = direction;

  const projectile = {
    ownerId: character.id,
    mapId: character.mapId,

    x: character.x,
    y: character.y,

    direction,
    damage: weapon.damage,
    rangeRemaining: weapon.range,
    image: weapon.projectileImage
  };

  worldState.projectiles.push(projectile);

  /*
    One shot every 1.4 seconds.
    This prevents several Operatives from becoming
    an uninterrupted laser hose.
  */
  character.nextWeaponFireTime =
    now + 1400;

  playSound(SOUNDS.laser);
  drawGame();
  animateProjectile();

  return true;
}

/* =============================================================
   RESIDENT LIFE SYSTEM

   Autonomous residents are updated independently from the player.
   Each resident uses residentState to decide what behavior occurs.
   ============================================================= */

function moveResidentToLocation(character, location) {
  character.mapId = location.mapId;
  character.x = location.x;
  character.y = location.y;
  character.facing = location.facing || character.facing;
  character.visible = true;

  if (
    character.mapId === worldState.currentMapId ||
    worldState.currentMapId === "engineTestInterior"
  ) {
    drawGame();
  }
}

function getResidentVehicle(character) {
  if (!character.vehicleId) {
    return null;
  }

  return vehicles.find(
    vehicle => vehicle.id === character.vehicleId
  ) || null;
}

function isResidentAdjacentToVehicle(character, vehicle) {
  if (character.mapId !== vehicle.mapId) {
    return false;
  }

  const occupiedTiles =
    getVehicleOccupiedTiles(vehicle);

  return occupiedTiles.some(tile => {
    const distance =
      Math.abs(character.x - tile.x) +
      Math.abs(character.y - tile.y);

    return distance === 1;
  });
}

function findResidentApproachTileForVehicle(
  character,
  vehicle
) {
  if (character.mapId !== vehicle.mapId) {
    return null;
  }

  const occupiedTiles =
    getVehicleOccupiedTiles(vehicle);

  const candidateTiles = [];

  for (const tile of occupiedTiles) {
    for (const direction of CARDINAL_DIRECTION_VECTORS) {
      const candidateX = tile.x + direction.dx;
      const candidateY = tile.y + direction.dy;

      const alreadyAdded = candidateTiles.some(candidate =>
        candidate.x === candidateX &&
        candidate.y === candidateY
      );

      if (alreadyAdded) {
        continue;
      }

      const occupiedByVehicle = occupiedTiles.some(
        occupiedTile =>
          occupiedTile.x === candidateX &&
          occupiedTile.y === candidateY
      );

      if (occupiedByVehicle) {
        continue;
      }

      if (
        !canResidentWalkTo(
          character,
          candidateX,
          candidateY
        )
      ) {
        continue;
      }

      candidateTiles.push({
        x: candidateX,
        y: candidateY
      });
    }
  }

  if (candidateTiles.length === 0) {
    return null;
  }

  candidateTiles.sort((a, b) => {
    const distanceA =
      Math.abs(character.x - a.x) +
      Math.abs(character.y - a.y);

    const distanceB =
      Math.abs(character.x - b.x) +
      Math.abs(character.y - b.y);

    return distanceA - distanceB;
  });

  return candidateTiles[0];
}

function canResidentWalkTo(character, x, y) {
  const map =
    ATLAS[character.mapId] ||
    BLUEPRINTS[character.mapId];

  if (!map) {
    return false;
  }

  if (!inBounds(x, y, map)) {
    return false;
  }

  const symbol = getTileSymbol(x, y, map);

  if (map.kind === "outside") {
    const tileDefinition = OUTSIDE_TILES[symbol];

    if (!tileDefinition?.walkable) {
      return false;
    }

    const buildingCollision =
      getBuildingCollisionAt(character.mapId, x, y);

    if (buildingCollision?.maskSymbol === "X") {
      return false;
    }
  } else {
    const tileDefinition = INTERIOR_TILES[symbol];

    if (!tileDefinition?.walkable) {
      return false;
    }
  }

  const characterBlocking = characters.some(other =>
    other.id !== character.id &&
    other.visible &&
    !other.defeated &&
    other.mapId === character.mapId &&
    other.x === x &&
    other.y === y
  );

  if (characterBlocking) {
    return false;
  }

  if (
    player.mapId === character.mapId &&
    player.mode !== "driving" &&
    player.x === x &&
    player.y === y
  ) {
    return false;
  }

  const vehicleBlocking = vehicles.some(vehicle =>
    vehicle.mapId === character.mapId &&
    getVehicleOccupiedTiles(vehicle).some(tile =>
      tile.x === x &&
      tile.y === y
    )
  );

  return !vehicleBlocking;
}

function moveResidentOneStepToward(
  character,
  targetX,
  targetY
) {
  const horizontalDirection =
    targetX > character.x
      ? "right"
      : targetX < character.x
        ? "left"
        : null;

  const verticalDirection =
    targetY > character.y
      ? "down"
      : targetY < character.y
        ? "up"
        : null;

  const directions = [];

  /*
    Prefer the axis with the greatest remaining distance.
    This makes movement look more deliberate.
  */
  const horizontalDistance =
    Math.abs(targetX - character.x);

  const verticalDistance =
    Math.abs(targetY - character.y);

  if (horizontalDistance >= verticalDistance) {
    if (horizontalDirection) {
      directions.push(horizontalDirection);
    }

    if (verticalDirection) {
      directions.push(verticalDirection);
    }
  } else {
    if (verticalDirection) {
      directions.push(verticalDirection);
    }

    if (horizontalDirection) {
      directions.push(horizontalDirection);
    }
  }

  for (const direction of directions) {
    const vector = DIRECTIONS[direction];

    const nextX = character.x + vector.dx;
    const nextY = character.y + vector.dy;

    if (!canResidentWalkTo(character, nextX, nextY)) {
      continue;
    }

    character.x = nextX;
    character.y = nextY;
    character.facing = direction;

    /*
  Redrawing is handled once after all residents update.
*/

    return true;
  }

  return false;
}

function exitBuildingForResident(
  character,
  exteriorLocation,
  nextState = "stationary"
) {
  moveResidentToLocation(
    character,
    exteriorLocation
  );

  character.residentState = nextState;
  character.stateTimer = 0;
}

function releaseResidentAfterTalk(character) {
  if (!character) {
    return false;
  }

  if (character.residentState !== "stopUntilTalkedTo") {
    return false;
  }

  character.talkGateCompleted = true;
  return true;
}

function boardVehicleForResident(character, vehicle) {
  if (!character || !vehicle) {
    return false;
  }

  if (character.mapId !== vehicle.mapId) {
    return false;
  }

  if (!isResidentAdjacentToVehicle(character, vehicle)) {
    return false;
  }

  if (
    vehicle.driverId &&
    vehicle.driverId !== character.id
  ) {
    return false;
  }

  vehicle.driverId = character.id;

  character.visible = false;
  character.mapId = vehicle.mapId;
  character.x = vehicle.x;
  character.y = vehicle.y;
  character.facing = vehicle.facing;

  character.residentState = "driving";
  character.stateTimer = 0;

  if (vehicle.mapId === worldState.currentMapId) {
    drawGame();
  }

  return true;
}

function driveResidentVehicle(character) {
  const vehicle = getResidentVehicle(character);

  if (!vehicle) {
    character.residentState = "stationary";
    return false;
  }

  /*
    Make sure this resident still owns the driver's seat.
  */
  if (vehicle.driverId !== character.id) {
    character.residentState = "stationary";
    return false;
  }

  const leftTurn = {
    up: "left",
    left: "down",
    down: "right",
    right: "up"
  };

  const rightTurn = {
    up: "right",
    right: "down",
    down: "left",
    left: "up"
  };

  const oppositeDirection = {
    up: "down",
    down: "up",
    left: "right",
    right: "left"
  };

  const facing = vehicle.facing || "down";

  /*
    Usually continue forward.

    When forward is blocked, randomly choose whether
    to test the left route or right route first.
  */
  const sideDirections =
    Math.random() < 0.5
      ? [leftTurn[facing], rightTurn[facing]]
      : [rightTurn[facing], leftTurn[facing]];

  const directionsToTry = [
    facing,
    ...sideDirections,
    oppositeDirection[facing]
  ];

  for (const direction of directionsToTry) {
    const moved = attemptVehicleMove(
      vehicle,
      direction,
      {
        driverType: "npc",

        /*
          Temporary for the roaming prototype.

          They will not run out of fuel while we test
          whether autonomous travel works correctly.
        */
        consumeFuel: false,

        allowAtlasTransition: true,
        redraw: true
      }
    );

    if (!moved) {
      continue;
    }

    /*
      Keep the hidden resident synchronized with
      the vehicle carrying them.

      This will matter later when they park,
      dismount, and enter buildings.
    */
    character.mapId = vehicle.mapId;
    character.x = vehicle.x;
    character.y = vehicle.y;
    character.facing = vehicle.facing;
    character.stateTimer = 0;

    return true;
  }

  /*
    Completely boxed in.

    Stay in driving state and try again next tick.
  */
  character.stateTimer =
    (character.stateTimer || 0) + 1;

  return false;
}

function updateResidents() {
  let currentMapChanged = false;

  for (const character of characters) {
    if (!character.autonomous) {
      continue;
    }

    /*
      Attackers do not need updates while the player
      is somewhere else.
    */
    if (
      character.residentState === "attackingPlayer" &&
      character.mapId !== player.mapId
    ) {
      continue;
    }

    /*
      Stationary residents require no update tick.
    */
    if (character.residentState === "stationary") {
      continue;
    }

    const oldMapId = character.mapId;
    const oldX = character.x;
    const oldY = character.y;
    const oldVisible = character.visible;
    const oldDefeated = character.defeated;

    updateResident(character);

    const affectedCurrentMap =
      oldMapId === worldState.currentMapId ||
      character.mapId === worldState.currentMapId;

    const changed =
      oldMapId !== character.mapId ||
      oldX !== character.x ||
      oldY !== character.y ||
      oldVisible !== character.visible ||
      oldDefeated !== character.defeated;

    if (affectedCurrentMap && changed) {
      currentMapChanged = true;
    }
  }

  if (currentMapChanged) {
    redrawCharacterLayer();
  }
}

function updateResident(character) {
  switch (character.residentState) {
    case "stationary":
      break;

      case "attackingPlayer": {
  if (
    character.defeated ||
    !character.visible ||
    character.mapId !== player.mapId
  ) {
    break;
  }

  const distance =
    Math.abs(character.x - player.x) +
    Math.abs(character.y - player.y);

  /*
    Fire first if there is a clear shot.
  */
  if (fireResidentWeapon(character)) {
    break;
  }

  /*
    Otherwise preserve the old melee attack.
  */
  if (distance <= 1) {
    player.health = Math.max(
      0,
      player.health - 10
    );

    setMessage(
      `LASER ATTACK ONSLAUGHT · Yoi health: ${player.health}/${player.maxHealth}`
    );

    if (player.health <= 0) {
      showBubble(
        "YOI",
        "Yoi collapses from the assault."
      );

      character.residentState = "stationary";
    }

    break;
  }

  moveResidentOneStepToward(
    character,
    player.x,
    player.y
  );

  break;
}

      case "leavingBuilding": {
  const exit =
    getNearestResidentBlueprintExit(character);

  if (!exit) {
    console.warn(
      `Resident "${character.id}" could not find a usable exit from "${character.mapId}".`
    );

    character.residentState = "stationary";
    character.stateTimer = 0;
    break;
  }

  const distanceToExit =
  Math.abs(character.x - exit.x) +
  Math.abs(character.y - exit.y);

const reachedExit =
  distanceToExit <= 1;

  if (!reachedExit) {
    moveResidentOneStepToward(
      character,
      exit.x,
      exit.y
    );

    break;
  }

  const stateAfterExit =
    character.afterBuildingExitState ||
    "stationary";

  exitBuildingForResident(
    character,
    exit.destination,
    stateAfterExit
  );

  character.afterBuildingExitState = null;
  break;
}

    case "leavingStation": {
      /*
        Temporary:
        Walk toward the Atlas Engine Test Facility exit.
        Later this destination will come from the blueprint.
      */
      const exitApproach = {
        x: 5,
        y: 6
      };

      const reachedExit =
        character.x === exitApproach.x &&
        character.y === exitApproach.y;

      if (reachedExit) {
        character.residentState = "waitingAtExit";
        character.stateTimer = 0;
        break;
      }

      moveResidentOneStepToward(
        character,
        exitApproach.x,
        exitApproach.y
      );

      break;
    }

    case "waitingAtExit":
      exitBuildingForResident(
        character,
        ENGINE_TEST_FACILITY_EXTERIOR,
        "stopUntilTalkedTo"
      );

      character.nextResidentState = "walkingToVehicle";
      character.talkGateCompleted = false;
      break;

    case "stopUntilTalkedTo":
      if (!character.talkGateCompleted) {
        break;
      }

      character.talkGateCompleted = false;

      character.residentState =
        character.nextResidentState || "stationary";

      character.nextResidentState = null;
      character.stateTimer = 0;
      break;

    case "walkingToVehicle": {
      const vehicle = getResidentVehicle(character);

      if (!vehicle) {
        character.residentState = "stationary";
        break;
      }

      if (vehicle.mapId !== character.mapId) {
        character.residentState = "stationary";
        break;
      }

      if (
        isResidentAdjacentToVehicle(
          character,
          vehicle
        )
      ) {
        character.residentState = "boardingVehicle";
        character.stateTimer = 0;
        break;
      }

      const approachTile =
        findResidentApproachTileForVehicle(
          character,
          vehicle
        );

      if (!approachTile) {
        character.residentState = "stationary";
        break;
      }

      moveResidentOneStepToward(
        character,
        approachTile.x,
        approachTile.y
      );

      break;
    }

    case "boardingVehicle": {
      const vehicle = getResidentVehicle(character);

      if (!vehicle) {
        character.residentState = "stationary";
        break;
      }

      const boarded =
        boardVehicleForResident(
          character,
          vehicle
        );

      if (!boarded) {
        character.residentState = "stationary";
      }

      break;
    }

    case "driving": {
  driveResidentVehicle(character);
  break;
}

    default:
      character.residentState = "stationary";
      break;
  }
}


function updateSingleProjectile(projectile) {
  if (projectile.rangeRemaining <= 0) {
    return true;
  }

  const vector =
  PROJECTILE_DIRECTIONS[projectile.direction];

if (!vector) {
  console.warn(
    `Projectile has invalid direction: ` +
    `${projectile.direction}`
  );

  return true;
}

  const nextX = projectile.x + vector.dx;
  const nextY = projectile.y + vector.dy;

  if (!inBounds(nextX, nextY)) {
    return true;
  }

  /*
    Deployed laser shields intercept projectiles before
    those projectiles can strike Yoi or another character.
  */
  const deployedShield = getDeployedLaserShieldAt(
  projectile.mapId,
  nextX,
  nextY
);

if (
  deployedShield &&
  doesLaserShieldBlockProjectile(
    deployedShield,
    projectile
  )
) {
  projectile.x = nextX;
  projectile.y = nextY;

  damageDeployedLaserShield(
    deployedShield,
    projectile.damage
  );

  /*
    The projectile is destroyed by the shield.
  */
  return true;
}

  /*
    Enemy projectiles can strike Yoi.
  */
  if (
    projectile.ownerId !== "player" &&
    projectile.mapId === player.mapId &&
    nextX === player.x &&
    nextY === player.y
  ) {
    projectile.x = nextX;
    projectile.y = nextY;

    player.health = Math.max(
      0,
      player.health - projectile.damage
    );

    setMessage(
      `LASER HIT · Yoi health: ${player.health}/${player.maxHealth}`
    );

    if (player.health <= 0) {
      recoverPlayerCruk();
      return true;
    }

    return true;
  }

  const target = characters.find(character =>
    character.visible &&
    !character.defeated &&
    character.mapId === projectile.mapId &&
    character.id !== projectile.ownerId &&
    character.x === nextX &&
    character.y === nextY
  );

  if (target) {
  projectile.x = nextX;
  projectile.y = nextY;

  const targetDefinition =
  getCharacterDefinition(target);

const faction =
  targetDefinition?.faction;

if (
  projectile.ownerId === "player" &&
  (
    faction === "sda" ||
    faction === "unrecognizer" ||
    faction === "redSnow"
  )
) {
  target.autonomous = true;
  target.residentState = "attackingPlayer";
  target.stateTimer = 0;
  target.nextWeaponFireTime = 0;

  alertNearbyFactionMembers(target, 8);
}

  target.health -= projectile.damage;

  if (target.health <= 0) {
    defeatCharacter(target);
  } else {
    beginCombat(target);
  }

  return true;
}

  if (isProjectileBlocked(nextX, nextY)) {
    return true;
  }

  projectile.x = nextX;
  projectile.y = nextY;
  projectile.rangeRemaining--;

  return projectile.rangeRemaining <= 0;
}

function isProjectileBlocked(x, y) {
  if (isOutsideMap()) {
    if (!isOutsideTerrainPassable(x, y, false)) return true;

    const buildingCollision = getBuildingCollisionAt(
      worldState.currentMapId,
      x,
      y
    );

    if (buildingCollision?.maskSymbol === "X") return true;
  } else if (!isInteriorTerrainPassable(x, y)) {
    return true;
  }

  if (isOccupiedByVehicle(x, y)) return true;

  return false;
}

function defeatCharacter(character) {
  character.health = 0;
  character.defeated = true;

  if (worldState.combatEnemyId === character.id) {
    endCombat(`${getCharacterDefinition(character).name} defeated.`);
  }
}

/* =============================================================
   20. CONTEXTUAL INTERACTION ROUTER

   One E key checks the current context in a predictable order.
   Additional systems can be inserted here without tangling all
   of their internal logic together.
   ============================================================= */

function interact() {
  hideBubble();

  if (player.mode === "driving") {
    exitVehicle();
    return;
  }

  const droppedBackpack = findNearbyDroppedHereoBackpack();

if (droppedBackpack) {
  pickUpDroppedHereoBackpack();
  return;
}

  const droppedItem = findNearbyDroppedItem();

if (droppedItem) {
  pickUpDroppedItem(droppedItem);
  return;
}

const deployedShield = findNearbyDeployedLaserShield();

if (deployedShield) {
  pickUpDeployedLaserShield(deployedShield);
  return;
}

const character = getAdjacentCharacter();

if (character) {
  interactWithCharacter(character);
  return;
}

const htiTarget =
  getAdjacentHtiCalibrationTarget();

if (htiTarget) {
  openHtiCalibrationTargetMenu(htiTarget);
  return;
}

  const entrance = getAdjacentBuildingEntrance();

if (entrance) {
  const interactionId =
    entrance.stamp.entranceInteraction ||
    entrance.definition.entranceInteraction;

  if (interactionId && INTERACTIONS[interactionId]) {
    INTERACTIONS[interactionId](entrance);
  } else {
    enterBuilding(entrance.stamp, entrance.definition);
  }

  return;
}

  const outsideInteraction =
  getAdjacentOutsideInteraction();

if (outsideInteraction) {
  const handler =
    INTERACTIONS[outsideInteraction.interaction];

  if (handler) {
    handler(outsideInteraction);
  }

  return;
}

  const interiorInteraction = getAdjacentInteriorInteraction();
  if (interiorInteraction) {
    if (interiorInteraction.interaction === "exitBlueprint") {
  exitBlueprint(interiorInteraction.exit);
  return;
}

    const handler = INTERACTIONS[interiorInteraction.interaction];

if (handler) {
  handler(interiorInteraction);
}

return;
  }

  if (isOutsideMap() && findAdjacentFuelPump()) {
    openFuelOverlay();
    return;
  }

  const vehicle = getAdjacentVehicle();

if (vehicle) {
  if (player.equippedFuelContainerId === "gasJug") {
    openGasJugVehicleMenu(vehicle);
  } else {
    openVehicleCargoMenu(vehicle);
  }

  return;
}

  setMessage("There is nothing to interact with here.");
}

function interactWithCharacter(character) {
  const definition = getCharacterDefinition(character);

  if (!character.portraitShown && (definition.portrait || definition.image)) {
    showCharacterPortrait(character);
    return;
  }

  const dialogueId = character.dialogueId || definition.dialogueId;

  if (!dialogueId) {
    showBubble(
      definition.name,
      "This character does not have dialogue yet."
    );
    return;
  }

  runCharacterDialogue(character, dialogueId);
}

function runCharacterDialogue(character, dialogueId) {
  const definition = getCharacterDefinition(character);
  const dialogue = DIALOGUE_DEFINITIONS[dialogueId];

  if (!dialogue) {
    showBubble(
      definition.name,
      "This character's dialogue has not been written yet."
    );
    return;
  }

  const lines =
  typeof dialogue.lines === "function"
    ? dialogue.lines(character)
    : dialogue.lines || [];

  if (lines.length === 0) {
    showBubble(
      definition.name,
      "This character has nothing to say."
    );
    return;
  }

  const step = character.conversationStep || 0;
  const lineIndex = Math.min(step, lines.length - 1);
  const dialogueLine = lines[lineIndex];

if (
  step === 0 &&
  definition.firstMeetingThoughtId
) {
  plantThought(
    definition.firstMeetingThoughtId
  );
}

  const text =
  typeof dialogueLine === "string"
    ? dialogueLine
    : typeof dialogueLine.text === "function"
      ? dialogueLine.text(character)
      : dialogueLine.text;

  if (
    typeof dialogueLine === "object" &&
    typeof dialogueLine.action === "function"
  ) {
    dialogueLine.action(character);
  }

  showBubble(
    definition.name,
    text
  );

  if (step < lines.length - 1) {
    character.conversationStep = step + 1;
  }
}

/* =============================================================
   21. WEATHER, BODY HEAT, AND MOVEMENT AFTERMATH

   Ported from UNRECOGNIZER I and adapted to:
   - the AA through HH atlas
   - player.mode
   - player.equippedSuitId
   - the shared worldState object
   ============================================================= */

const WEATHER_MODES = ["clear", "snow", "blizzard"];

const WEATHER_SEVERITIES = ["normal", "severe"];

const WEATHER_RULES = {
  normalMinimumDuration: 10000,
  normalMaximumDuration: 80000,

  severeBlizzardChance: 0.08,

  severeBlizzardMinimumDuration: 180000,
  severeBlizzardMaximumDuration: 360000
};

const BODY_HEAT_RULES = {
  clearLoss: 1,
  snowDayLoss: 2,
  snowNightLoss: 4,
  blizzardLoss: 6,

  snowSuitProtection: 2,
  thermalSnowSuitProtection: 4,

  shelterRecovery: 2,
  criticalThreshold: 50,
  emergencyThreshold: 25
};

function isSpeechBubbleOpen() {
  return bubbleOverlay.style.display === "block";
}

function randomDuration(minimum, maximum) {
  return (
    minimum +
    Math.random() * (maximum - minimum)
  );
}

function isSevereBlizzardActive() {
  return (
    worldState.weatherMode === "blizzard" &&
    worldState.weatherSeverity === "severe"
  );
}

function getCurrentWeatherState() {
  return {
    mode: worldState.weatherMode,
    severity: worldState.weatherSeverity,
    startedAt: worldState.weatherStartedAt,
    endsAt: worldState.weatherEndsAt,
    severeBlizzard: isSevereBlizzardActive()
  };
}

function setWeather(
  mode,
  {
    severity = "normal",
    announce = true
  } = {}
) {
  if (!WEATHER_MODES.includes(mode)) {
    console.warn("Unknown weather mode:", mode);
    return false;
  }

  /*
    Only blizzards may currently become severe.
  */
  if (mode !== "blizzard") {
    severity = "normal";
  }

  if (!WEATHER_SEVERITIES.includes(severity)) {
    console.warn("Unknown weather severity:", severity);
    severity = "normal";
  }

  worldState.weatherMode = mode;
  worldState.weatherSeverity = severity;
  worldState.weatherStartedAt = Date.now();

  snowOverlay.classList.remove(
    "weather-clear",
    "weather-snow",
    "weather-blizzard",
    "weather-severe-blizzard"
  );

  /*
    Weather remains active planet-wide while its visual
    effect is hidden inside buildings.
  */
  if (!isOutsideMap()) {
    snowOverlay.style.display = "none";
  } else {
    snowOverlay.style.display = "";

    if (mode === "clear") {
      snowOverlay.classList.add("weather-clear");
    }

    if (mode === "snow") {
      snowOverlay.classList.add("weather-snow");
    }

    if (mode === "blizzard") {
      snowOverlay.classList.add("weather-blizzard");

      if (severity === "severe") {
        snowOverlay.classList.add(
          "weather-severe-blizzard"
        );
      }
    }
  }

  if (announce) {
    showWeatherMessage(mode, severity);
  }

  updateWeatherSounds();
  updateHud();

  console.log(
    "Weather is now:",
    worldState.weatherMode,
    worldState.weatherSeverity
  );

  return true;
}

function showWeatherMessage(mode, severity = "normal") {
  if (!isOutsideMap()) return;

  const messageIdentity = `${mode}:${severity}`;

  if (
    worldState.lastWeatherMessage === messageIdentity
  ) {
    return;
  }

  if (isSpeechBubbleOpen()) return;

  worldState.lastWeatherMessage = messageIdentity;

  if (mode === "clear") {
    setMessage("The snowfall clears.");
    return;
  }

  if (mode === "snow") {
    setMessage("Snow begins falling.");
    return;
  }

  if (
    mode === "blizzard" &&
    severity === "severe"
  ) {
    setMessage(
      "A major blizzard bears down upon Stro."
    );

    showBubble(
      "STRO WEATHER EMERGENCY",
      "SEVERE BLIZZARD. Prolonged whiteout conditions expected."
    );

    return;
  }

  if (mode === "blizzard") {
    setMessage("Blizzard conditions intensify.");
  }
}

function randomWeather() {
  const choices = WEATHER_MODES.filter(
    mode => mode !== worldState.weatherMode
  );

  const nextMode =
    choices[Math.floor(Math.random() * choices.length)];

  let nextSeverity = "normal";

  if (
    nextMode === "blizzard" &&
    Math.random() <
      WEATHER_RULES.severeBlizzardChance
  ) {
    nextSeverity = "severe";
  }

  setWeather(nextMode, {
    severity: nextSeverity
  });
}

function scheduleNextWeatherChange() {
  if (worldState.weatherTimer) {
    clearTimeout(worldState.weatherTimer);
  }

  let delay;

  if (isSevereBlizzardActive()) {
    delay = randomDuration(
      WEATHER_RULES.severeBlizzardMinimumDuration,
      WEATHER_RULES.severeBlizzardMaximumDuration
    );
  } else {
    delay = randomDuration(
      WEATHER_RULES.normalMinimumDuration,
      WEATHER_RULES.normalMaximumDuration
    );
  }

  worldState.weatherEndsAt = Date.now() + delay;

  worldState.weatherTimer = setTimeout(() => {
    randomWeather();
    scheduleNextWeatherChange();
  }, delay);
}

function startWeatherSystem() {
  setWeather(worldState.weatherMode, { announce: false });
  scheduleNextWeatherChange();
}

function updateWeatherSounds() {
  const exposedOutside =
    isOutsideMap() &&
    player.mode === "walking";

  if (exposedOutside) {
    playSound(SOUNDS.wind, false);
  } else {
    stopSound(SOUNDS.wind);
  }
}

function getCurrentBodyHeatLoss() {
  if (worldState.weatherMode === "clear") {
    return BODY_HEAT_RULES.clearLoss;
  }

  if (worldState.weatherMode === "snow") {
    return worldState.timeOfDay === "night"
      ? BODY_HEAT_RULES.snowNightLoss
      : BODY_HEAT_RULES.snowDayLoss;
  }

  if (worldState.weatherMode === "blizzard") {
    return BODY_HEAT_RULES.blizzardLoss;
  }

  return 0;
}

function updateBodyHeat() {
  if (!player.bodyHeatActive) return;

  const outside = isOutsideMap();
  const inVehicle = player.mode === "driving";

  /*
    Lose body heat while outdoors and on foot.
  */
  if (outside && !inVehicle) {
    let heatLoss = getCurrentBodyHeatLoss();

    /*
      The regular Snow Suit reduces heat loss.
    */
    if (player.equippedSuitId === "snowSuit") {
      heatLoss = Math.max(
        0,
        heatLoss - BODY_HEAT_RULES.snowSuitProtection
      );
    }

    /*
      The Thermal Snow Suit provides stronger protection,
      but does not make Yoi completely immune to cold.
    */
    if (player.equippedSuitId === "thermalSnowSuit") {
      heatLoss = Math.max(
        0,
        heatLoss - BODY_HEAT_RULES.thermalSnowSuitProtection
      );
    }

    player.bodyHeat -= heatLoss;
  }

  /*
    Recover body heat inside buildings and vehicles.
  */
  if (!outside || inVehicle) {
    player.bodyHeat += BODY_HEAT_RULES.shelterRecovery;
  }

  /*
    Keep body heat between 0 and 100.
  */
  player.bodyHeat = Math.max(
    0,
    Math.min(100, player.bodyHeat)
  );

  /*
    Give only one warning when body heat reaches the
    emergency threshold.
  */
  if (
    player.bodyHeat <= BODY_HEAT_RULES.emergencyThreshold &&
    worldState.lastBodyHeatWarning !== "critical"
  ) {
    worldState.lastBodyHeatWarning = "critical";

    showBubble(
      "THERMAL WARNING",
      "BODY HEAT CRITICAL — SEEK SHELTER IMMEDIATELY."
    );
  }

  /*
    Reset the warning after the player warms above
    the emergency threshold, allowing a future warning.
  */
  if (
    player.bodyHeat > BODY_HEAT_RULES.emergencyThreshold &&
    worldState.lastBodyHeatWarning === "critical"
  ) {
    worldState.lastBodyHeatWarning = "";
  }

  /*
    Temporary protection until the death system exists.
  */
  if (player.bodyHeat <= 0) {
    recoverPlayer("bodyHeat");
    return;
  }

  worldState.lastBodyHeat = player.bodyHeat;
  updateHud();
}

function findHangarRenegadeSpawnTiles(hangar, count) {
  const definition =
    BUILDING_DEFINITIONS[hangar.definitionId];

  const centerX =
    hangar.x + Math.floor(definition.width / 2);

  const centerY =
    hangar.y + Math.floor(definition.height / 2);

  const candidates = [];

  for (
    let y = Math.max(0, centerY - hangar.ambush.radius);
    y <= Math.min(OUTSIDE_MAP_SIZE - 1, centerY + hangar.ambush.radius);
    y++
  ) {
    for (
      let x = Math.max(0, centerX - hangar.ambush.radius);
      x <= Math.min(OUTSIDE_MAP_SIZE - 1, centerX + hangar.ambush.radius);
      x++
    ) {
      const distanceFromPlayer =
        Math.abs(player.x - x) +
        Math.abs(player.y - y);

      if (distanceFromPlayer < 3) continue;

      const testCharacter = {
        id: "temporary-renegade-spawn-test",
        mapId: hangar.mapId
      };

      if (!canResidentWalkTo(testCharacter, x, y)) {
        continue;
      }

      candidates.push({ x, y });
    }
  }

  candidates.sort(
    () => Math.random() - 0.5
  );

  return candidates.slice(0, count);
}

function spawnHangarRenegades(hangar) {
  const spawnTiles =
    findHangarRenegadeSpawnTiles(
      hangar,
      hangar.ambush.renegades
    );

  spawnTiles.forEach((tile, index) => {
    characters.push({
      id:
        `${hangar.id}-renegade-${index + 1}`,

      definitionId: "redSnowRenegade",
      mapId: hangar.mapId,

      x: tile.x,
      y: tile.y,
      facing: "down",

      health: 75,
      defeated: false,
      visible: true,
      conversationStep: 0,
      portraitShown: false,

      autonomous: true,
      residentState: "attackingPlayer",

      sourceHangarId: hangar.id
    });
  });
}

function checkHangarAmbushes() {
  let hangarId = null;

  if (worldState.currentMapId === "FA") {
    hangarId = "hangar-gate-fa";
  } else if (worldState.currentMapId === "BD") {
    hangarId = "hangar-gate-bd";
  } else {
    return;
  }

  const hangar = buildingStamps.find(
    stamp => stamp.id === hangarId
  );

  if (
    !hangar ||
    !hangar.ambush ||
    hangar.ambush.triggered
  ) {
    return;
  }

  const definition =
    BUILDING_DEFINITIONS[hangar.definitionId];

  if (!definition) return;

  const centerX =
    hangar.x + Math.floor(definition.width / 2);

  const centerY =
    hangar.y + Math.floor(definition.height / 2);

  const distance =
    Math.abs(player.x - centerX) +
    Math.abs(player.y - centerY);

  if (distance > hangar.ambush.radius) return;

hangar.ambush.triggered = true;

plantThought(
  "stro_red_snow_tunnel_entrance"
);

spawnHangarRenegades(hangar);

  showBubble(
    "RED SNOW RENEGADES",
    "Movement stirs among the trees surrounding the tunnel entrance."
  );
}

function updateWorldAfterMovement() {
  checkHangarAmbushes();
  updateWeatherDisplay();
  updateHud();
}

function updateWeatherDisplay() {
  const outside = isOutsideMap();

  nightOverlay.style.display =
    outside && worldState.timeOfDay === "night"
      ? "block"
      : "none";

  if (!outside) {
    snowOverlay.style.display = "none";
  } else {
    setWeather(worldState.weatherMode, { announce: false });
  }

  updateWeatherSounds();
}

// beds toggle day and night sleep

function toggleDayNight() {
  worldState.timeOfDay =
    worldState.timeOfDay === "day"
      ? "night"
      : "day";

  updateWeatherDisplay();
  updateHud();

  const label =
    worldState.timeOfDay === "day"
      ? "DAY"
      : "NIGHT";

  showBubble(
    "REST",
    `Yoi sleeps. Time advances to ${label}.`
  );

  drawGame();
}

/* =============================================================
   UNRECOGNIZER HALLUCINATION SYSTEM

   A full pill bottle provides unlimited doses.

   Each dose:
   - lasts 20 seconds
   - rerolls the hallucination
   - gives each outside pine tree a 20% chance of appearing
     as one stable hallucination face
   - changes visuals only, never collision or behavior
   ============================================================= */

function getRandomHallucinationFaceId() {
  const randomIndex = Math.floor(
    Math.random() * HALLUCINATION_FACE_IDS.length
  );

  return HALLUCINATION_FACE_IDS[randomIndex];
}

function getHallucinationTileKey(mapId, x, y) {
  return `${mapId}:${x}:${y}`;
}

function getHallucinationImage({
  mapId,
  x,
  y,
  symbol,
  normalImage
}) {
  /*
    Hallucinations currently affect outside pine trees only.
  */
  if (
    !worldState.hallucination.active ||
    !isOutsideMap(mapId) ||
    (symbol !== "P" && symbol !== "p")
  ) {
    return normalImage;
  }

  const tileKey =
    getHallucinationTileKey(mapId, x, y);

  /*
    undefined means this tree has not yet been rolled
    during the current hallucination.
  */
  if (
    worldState.hallucination.faceByTile[tileKey] === undefined
  ) {
    const becomesFace =
      Math.random() < HALLUCINATION_TREE_CHANCE;

    worldState.hallucination.faceByTile[tileKey] =
      becomesFace
        ? getRandomHallucinationFaceId()
        : null;
  }

  const faceId =
    worldState.hallucination.faceByTile[tileKey];

  /*
    A null result means this tree remains normal
    for the duration of the current pill.
  */
  if (!faceId) {
    return normalImage;
  }

  return ASSETS.hallucination[faceId] || normalImage;
}

function endUnrecognizerHallucination() {
  if (worldState.hallucination.timer) {
    clearTimeout(
      worldState.hallucination.timer
    );
  }

  worldState.hallucination.active = false;
  worldState.hallucination.faceByTile = {};
  worldState.hallucination.timer = null;
  worldState.hallucination.endsAt = null;

  drawGame();

  showBubble(
    "UNRECOGNIZER",
    "The landscape settles back into its ordinarily recognizable arrangement."
  );
}

function takeUnrecognizerPill() {
  if (!hasItem("fullPillBottle")) {
    closeOverlay();

    showBubble(
      "UNRECOGNIZER",
      "Yoi does not have a bottle of UNRECOGNIZER pills."
    );

    return false;
  }

  /*
    Taking another pill replaces the current hallucination
    and restarts the full 20-second duration.
  */
  if (worldState.hallucination.timer) {
    clearTimeout(
      worldState.hallucination.timer
    );
  }

  worldState.hallucination.active = true;
  worldState.hallucination.faceByTile = {};
  worldState.hallucination.endsAt =
    Date.now() + HALLUCINATION_DURATION;

  worldState.hallucination.timer = setTimeout(
    endUnrecognizerHallucination,
    HALLUCINATION_DURATION
  );

  closeOverlay();
  drawGame();

  showBubble(
    "UNRECOGNIZER",
    "Yoi swallows one capsule. Certain trees immediately become difficult to recognize."
  );

  return true;
}

/* =============================================================
   22. RENDERING
   ============================================================= */

function drawGame() {
  const map = getViewedMap();
  const { width, height } = getMapDimensions(map);

  game.innerHTML = "";
  game.style.gridTemplateColumns = `repeat(${width}, ${TILE_SIZE}px)`;
  game.style.gridTemplateRows = `repeat(${height}, ${TILE_SIZE}px)`;
  game.style.width = `${width * TILE_SIZE}px`;
  game.style.height = `${height * TILE_SIZE}px`;

  drawTiles(map);

  if (isOutsideMap(getViewedMapId())) {
  drawBuildingStamps();
  drawVehicles();
}

  drawCharacters();
drawDroppedHereoBackpack();
drawDroppedItems();
drawProjectiles();
drawDeployedLaserShields();
drawPlayer();
  updateCamera();
  updateWeatherDisplay();
  updateHud();
}

function drawTiles(map) {
  const viewedMapId = getViewedMapId();

  const tileLegend = isOutsideMap(viewedMapId)
    ? OUTSIDE_TILES
    : INTERIOR_TILES;

  for (let y = 0; y < map.tiles.length; y++) {
    for (let x = 0; x < map.tiles[y].length; x++) {
      const symbol = map.tiles[y][x];
      const tileDefinition = tileLegend[symbol];

      const normalImage =
        tileDefinition?.image ||
        ASSETS.ground.snow;

      const displayedImage =
        getHallucinationImage({
          mapId: viewedMapId,
          x,
          y,
          symbol,
          normalImage
        });

      const tile = document.createElement("div");
      tile.className = "tile";

      tile.style.backgroundImage =
        displayedImage
          ? `url("${displayedImage}")`
          : "";

      game.appendChild(tile);
    }
  }
}

function placeEntity(element, x, y, widthTiles = 1, heightTiles = 1) {
  element.style.left = `${x * TILE_SIZE}px`;
  element.style.top = `${y * TILE_SIZE}px`;
  element.style.width = `${widthTiles * TILE_SIZE}px`;
  element.style.height = `${heightTiles * TILE_SIZE}px`;
  game.appendChild(element);
}

function drawDroppedItems() {
  for (const droppedItem of worldState.droppedItems) {
    if (droppedItem.mapId !== worldState.currentMapId) {
      continue;
    }

    const item = ITEM_DEFINITIONS[droppedItem.itemId];

    if (!item) {
      continue;
    }

    let itemImage = item.image;

    if (
      droppedItem.itemId === "gasJug" &&
      player.gasJugFuel <= 0 &&
      item.emptyImage
    ) {
      itemImage = item.emptyImage;
    }

    const sprite = document.createElement("div");

    sprite.className = "entity droppedItemSprite";
    sprite.style.backgroundImage = `url("${itemImage}")`;

    placeEntity(
      sprite,
      droppedItem.x,
      droppedItem.y
    );
  }
}

function drawDeployedLaserShields() {
  for (const shield of worldState.deployedLaserShields) {
    if (shield.mapId !== getViewedMapId()) {
      continue;
    }

    const shieldImage = getLaserShieldAsset(shield);

    if (!shieldImage) {
      continue;
    }

    const sprite = document.createElement("div");

sprite.className = "entity laserShieldSprite";
sprite.style.backgroundImage = `url("${shieldImage}")`;

sprite.style.backgroundSize = "contain";
sprite.style.backgroundPosition = "center";
sprite.style.backgroundRepeat = "no-repeat";

placeEntity(
  sprite,
  shield.x,
  shield.y
);
  }
}

function drawDroppedHereoBackpack() {
  const backpack = worldState.droppedHereoBackpack;

  if (!backpack) return;
  if (backpack.mapId !== worldState.currentMapId) return;

  const sprite = document.createElement("div");

  sprite.className = "entity droppedItemSprite";

  const backpackImage =
    ASSETS.character.htiBackpack[backpack.facing] ||
    ASSETS.character.htiBackpack.down;

  sprite.style.backgroundImage = `url("${backpackImage}")`;

  placeEntity(sprite, backpack.x, backpack.y);
}

function drawPlayer() {
  if (getViewedMapId() !== player.mapId) return;
  if (player.mode === "driving") return;

  const definition = CHARACTER_DEFINITIONS[player.characterId];
  const sprite = document.createElement("div");

  sprite.className = "entity playerSprite";

  let playerImage = definition.images[player.facing];

  if (player.equippedBadgeId === "yoiUnrecognizerBadge") {
    playerImage = ASSETS.character.badge.yoiUnrecognizer;
  }

    if (player.carryingHereoBackpack) {
  playerImage = ASSETS.character.htiBackpack[player.facing];
}

  sprite.style.backgroundImage = `url("${playerImage}")`;

  placeEntity(sprite, player.x, player.y);
}

function redrawCharacterLayer() {
  /*
    Remove only existing NPC sprites.
  */
  game
    .querySelectorAll(".npcSprite")
    .forEach(sprite => sprite.remove());

  /*
    Recreate only the characters currently visible.
  */
  drawCharacters();
}

function drawCharacters() {
  for (const character of characters) {
    if (!character.visible || character.mapId !== getViewedMapId()) continue;

    const definition = getCharacterDefinition(character);
    const sprite = document.createElement("div");

    sprite.className = "entity npcSprite";
    sprite.style.backgroundImage = `url("${
      character.defeated ? definition.defeatedImage : definition.image
    }")`;

    placeEntity(sprite, character.x, character.y);
  }
}

function drawBuildingStamps() {
  for (const stamp of buildingStamps) {
    if (stamp.mapId !== getViewedMapId()) continue;

    const definition = getBuildingDefinition(stamp);
    const element = document.createElement("div");

    element.className = "entity buildingStamp";
    element.style.backgroundImage = `url("${definition.image}")`;

    placeEntity(
      element,
      stamp.x,
      stamp.y,
      definition.width,
      definition.height
    );
  }
}

function drawVehicles() {
  for (const vehicle of vehicles) {
    if (vehicle.mapId !== getViewedMapId()) continue;

    const definition = getVehicleDefinition(vehicle);
    const size = getVehicleSize(vehicle);

    if (definition.renderMode === "full") {
      const element = document.createElement("div");

      element.className = "entity vehicleSprite";
      element.style.backgroundImage = `url("${definition.images[vehicle.facing]}")`;

      placeEntity(element, vehicle.x, vehicle.y, size.width, size.height);
      continue;
    }

    drawPieceVehicle(vehicle, definition);
  }
}

function drawPieceVehicle(vehicle, definition) {
  const images = definition.images[vehicle.facing];

  const rear = document.createElement("div");
  rear.className = "entity vehiclePiece";
  rear.style.backgroundImage = `url("${images.rear}")`;

  const front = document.createElement("div");
  front.className = "entity vehiclePiece";
  front.style.backgroundImage = `url("${images.front}")`;

  const positions = getSnowmobilePiecePositions(vehicle);

  placeEntity(rear, positions.rear.x, positions.rear.y);
  placeEntity(front, positions.front.x, positions.front.y);
}

function getSnowmobilePiecePositions(vehicle) {
  if (vehicle.facing === "right") {
    return {
      rear: { x: vehicle.x, y: vehicle.y },
      front: { x: vehicle.x + 1, y: vehicle.y }
    };
  }

  if (vehicle.facing === "left") {
    return {
      front: { x: vehicle.x, y: vehicle.y },
      rear: { x: vehicle.x + 1, y: vehicle.y }
    };
  }

  if (vehicle.facing === "down") {
    return {
      rear: { x: vehicle.x, y: vehicle.y },
      front: { x: vehicle.x, y: vehicle.y + 1 }
    };
  }

  return {
    front: { x: vehicle.x, y: vehicle.y },
    rear: { x: vehicle.x, y: vehicle.y + 1 }
  };
}

function drawProjectiles() {
  for (const projectile of worldState.projectiles) {
    if (projectile.mapId !== worldState.currentMapId) continue;

    const element = document.createElement("div");
    element.className = "entity projectileSprite";
    element.style.backgroundImage = `url("${projectile.image}")`;

    placeEntity(element, projectile.x, projectile.y);
  }
}

function updateCamera() {
  let focusTileX;
  let focusTileY;

  if (player.binocularMode) {
    focusTileX = player.binocularCameraX;
    focusTileY = player.binocularCameraY;
  } else if (player.mode === "driving") {
    const vehicle = getCurrentVehicle();

    if (vehicle) {
      const size = getVehicleSize(vehicle, vehicle.facing);

      /*
        Center the camera on the complete vehicle footprint,
        rather than its top-left coordinate.
      */
      focusTileX = vehicle.x + size.width / 2;
      focusTileY = vehicle.y + size.height / 2;

      /*
        Push the camera view ahead of the vehicle so the driver
        can see the route they are approaching.
      */
      const lookAheadTiles = 2;

      if (vehicle.facing === "left") {
        focusTileX -= lookAheadTiles;
      }

      if (vehicle.facing === "right") {
        focusTileX += lookAheadTiles;
      }

      if (vehicle.facing === "up") {
        focusTileY -= lookAheadTiles;
      }

      if (vehicle.facing === "down") {
        focusTileY += lookAheadTiles;
      }
    } else {
      focusTileX = player.x;
      focusTileY = player.y;
    }
  } else {
    focusTileX = player.x;
    focusTileY = player.y;
  }

  const focusX = focusTileX * TILE_SIZE;
  const focusY = focusTileY * TILE_SIZE;

  const map = getViewedMap();
  const { width, height } = getMapDimensions(map);

  const maxLeft = Math.max(
    0,
    width * TILE_SIZE - camera.clientWidth
  );

  const maxTop = Math.max(
    0,
    height * TILE_SIZE - camera.clientHeight
  );

  const left = Math.max(
    0,
    Math.min(
      maxLeft,
      focusX - camera.clientWidth / 2
    )
  );

  const top = Math.max(
    0,
    Math.min(
      maxTop,
      focusY - camera.clientHeight / 2
    )
  );

  game.style.transform =
    `translate(${-left}px, ${-top}px)`;
}

function updateHud() {
  const map = getCurrentMap();
  const vehicle = getCurrentVehicle();

  const locationText = isOutsideMap()
    ? `${worldState.currentMapId} · ${map.title}`
    : map.title;

  const modeText = vehicle
    ? `Driving ${getVehicleDefinition(vehicle).name} · Fuel ${vehicle.fuel.toFixed(2)}`
    : "Walking";

  hud.textContent =
    `${locationText} | ${modeText} | ` +
    `Body Heat ${Math.round(player.bodyHeat)}% | ` +
    `Weather ${worldState.weatherMode.toUpperCase()} | ` +
    `HP ${player.health}/${player.maxHealth} | ` +
    `Merit ${player.merit} | Serpentine ${player.serpentine}`;
}

function openThinkingMode(selectedIndex = 0) {
  const availableCategories = THOUGHT_CATEGORIES.filter(
    category => getThoughtsByCategory(category).length > 0
  );

  const options = availableCategories.map(category => {
    const thoughts = getThoughtsByCategory(category);

    return {
      label: `${category} [${thoughts.length}]`,

      text:
        `<strong>${category}</strong><br><br>` +
        `${thoughts.length} thought${thoughts.length === 1 ? "" : "s"} ` +
        `currently formed.`,

      action: () => {
        openThoughtCategory(category);
      }
    };
  });

  options.push({
    label: "Close Thinking Mode",
    text:
      "Leave Yoi's current thoughts and return to the world.",
    action: closeOverlay
  });

  openOverlay({
    title: "YOI ZIMEK: THINK MODE",
    image: ASSETS.character.yoi.down,
    text:
      "Yoi's thoughts are not objectives or instructions. " +
      "They are the developing structure of his understanding.",
    options,
    selectedIndex: Math.min(
      selectedIndex,
      Math.max(0, options.length - 1)
    )
  });
}

function openThoughtCategory(category, selectedIndex = 0) {
  const thoughts = getThoughtsByCategory(category);

  const options = thoughts.map(thought => ({
    label: thought.title,

    text:
      `<strong>${thought.title}</strong><br><br>` +
      `${thought.text}`,

    action: () => {
      openThought(thought.id, category);
    }
  }));

  options.push({
    label: "Back to Thinking Mode",
    text: "Return to the categories.",
    action: openThinkingMode
  });

  openOverlay({
    title: category.toUpperCase(),
    image: ASSETS.character.badge.yoiUnrecognizer,
    text:
      thoughts.length > 0
        ? "Choose a thought."
        : "No thoughts have formed here yet.",
    options,
    selectedIndex: Math.min(
      selectedIndex,
      Math.max(0, options.length - 1)
    )
  });
}

function openThought(thoughtId, category) {
  const thought = THOUGHT_DEFINITIONS[thoughtId];

  if (!thought || !hasThought(thoughtId)) {
    openThinkingMode();
    return;
  }

  openOverlay({
    title: thought.title.toUpperCase(),
    image: ASSETS.character.badge.yoiUnrecognizer,

    text:
      `<span style="color:#9cff00;">${thought.category}</span>` +
      `<br><br>` +
      `${thought.text}`,

    options: [
      {
        label: `Back to ${category}`,
        action: () => {
          const thoughtIndex = getThoughtsByCategory(category)
            .findIndex(entry => entry.id === thoughtId);

          openThoughtCategory(
            category,
            Math.max(0, thoughtIndex)
          );
        }
      },

      {
        label: "Close Thinking Mode",
        action: closeOverlay
      }
    ]
  });
}

/* =============================================================
   23. ATLAS INFORMATION OVERLAY
   ============================================================= */

function openAtlasInformation() {
  const discovered = Object.values(ATLAS).filter(map => map.discovered);
  const rows = [];

  for (let row = 0; row < ATLAS_SIZE; row++) {
    const cells = [];

    for (let column = 0; column < ATLAS_SIZE; column++) {
      const code = ATLAS_LETTERS[row] + ATLAS_LETTERS[column];
      const map = ATLAS[code];

      cells.push(map.discovered ? `[${code}]` : " -- ");
    }

    rows.push(cells.join(" "));
  }

  openOverlay({
    title: "STRO ATLAS",
    image: ASSETS.item.hereoDevice,
    text:
      `<pre style="color:#b9d7ff;line-height:1.7">${rows.join("\n")}</pre>` +
      `<p>${discovered.length} of 64 sectors discovered.</p>`,
    options: [
      { label: "Close atlas", action: closeOverlay }
    ]
  });
}

function updateMobileDrivingAppearance() {
  const mobileControls =
    document.getElementById("mobileControls");

  if (!mobileControls) return;

  mobileControls.classList.toggle(
    "driving",
    player.mode === "driving"
  );
}

/* =============================================================
   MOBILE DIRECTIONAL INPUT

   One tap equals one directional action.

   The same existing movement functions are used for:
   - walking
   - driving
   - binocular movement
   ============================================================= */

function handleMobileDirection(direction) {
  if (worldState.overlay.open) {
    return;
  }

  if (bubbleOverlay.style.display === "block") {
    return;
  }

  if (player.binocularMode) {
    moveBinocularCamera(direction);
    return;
  }

  /*
    Aim Mode converts the four cardinal movement
    controls into cardinal firing controls.

    Yoi remains planted on his current tile.
  */
  if (worldState.aimMode) {
    fireEquippedWeapon(direction);
    return;
  }

  if (player.mode === "driving") {
    moveVehicle(direction);
    return;
  }

  movePlayer(direction);
}

function connectMobileDirectionButton(button, direction) {
  if (!button) return;

  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    handleMobileDirection(direction);
  });
}

connectMobileDirectionButton(mobileUp, "up");
connectMobileDirectionButton(mobileDown, "down");
connectMobileDirectionButton(mobileLeft, "left");
connectMobileDirectionButton(mobileRight, "right");

function connectMobileFireButton(
  button,
  direction
) {
  if (!button) return;

  button.addEventListener(
    "pointerdown",
    event => {
      event.preventDefault();

      if (worldState.overlay.open) {
        return;
      }

      if (
        bubbleOverlay.style.display === "block"
      ) {
        return;
      }

      if (player.binocularMode) {
        return;
      }

      /*
        While driving with Aim Mode off,
        diagonal buttons move the vehicle.

        On foot, or while Aim Mode is on,
        diagonal buttons fire the equipped weapon.
      */
      if (
        player.mode === "driving" &&
        !worldState.aimMode
      ) {
        moveVehicle(direction);
        return;
      }

      fireEquippedWeapon(direction);
    }
  );
}

connectMobileFireButton(
  mobileFireUpLeft,
  "upLeft"
);

connectMobileFireButton(
  mobileFireUpRight,
  "upRight"
);

connectMobileFireButton(
  mobileFireDownLeft,
  "downLeft"
);

connectMobileFireButton(
  mobileFireDownRight,
  "downRight"
);

function handleMobileInteract() {
  if (worldState.overlay.open) {
    confirmOverlaySelection();
    return;
  }

  if (bubbleOverlay.style.display === "block") {
    hideBubble();
    return;
  }

  if (player.binocularMode) {
    exitBinocularMode();
    return;
  }

  interact();
}

if (mobileInteract) {
  mobileInteract.addEventListener("pointerdown", event => {
    event.preventDefault();
    handleMobileInteract();
  });
}

if (mobileDeploy) {
  mobileDeploy.addEventListener("pointerdown", event => {
    event.preventDefault();

    if (worldState.overlay.open) {
      return;
    }

    if (bubbleOverlay.style.display === "block") {
      return;
    }

    if (player.binocularMode) {
      return;
    }

    deployLaserShield();
  });
}

if (mobileAim) {
  mobileAim.addEventListener("pointerdown", event => {
    event.preventDefault();

    toggleAimMode();

    setMessage(
      worldState.aimMode
        ? "AIM MODE ON"
        : "AIM MODE OFF"
    );
  });
}

if (mobileMenu) {
  mobileMenu.addEventListener("pointerdown", event => {
    event.preventDefault();

    if (bubbleOverlay.style.display === "block") {
      return;
    }

    if (player.binocularMode) {
      return;
    }

    if (worldState.overlay.open) {
      closeOverlay();
      return;
    }

    openMobileSystemMenu();
  });
}

if (mobileControls) {
  mobileControls.classList.remove("mobileControlsDisabled");
}

function openMobileSystemMenu() {
  openOverlay({
    title: "YOI SYSTEM MENU",
    image: ASSETS.character.badge.yoiUnrecognizer,

    text:
      "Select a system interface.",

    options: [
      {
        label: "Inventory",
        action: () => openInventory()
      },

      {
        label: "Stro Atlas",
        action: openAtlasInformation
      },

      {
        label: "Thinking Mode",
        action: () => openThinkingMode()
      },

      {
        label: "Close Menu",
        action: closeOverlay
      }
    ]
  });
}

/* =============================================================
   24. KEYBOARD INPUT

   Input priority:
   overlay > bubble > driving/walking > contextual actions
   ============================================================= */

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();
  const code = event.code;

  /*
    Overlay controls have first priority.
  */
  if (worldState.overlay.open) {
    if (key === "arrowup") {
      moveOverlaySelection(-1);
    } else if (key === "arrowdown") {
      moveOverlaySelection(1);
    } else if (key === "e" || key === "enter") {
      confirmOverlaySelection();
    } else if (key === "b" || key === "escape") {
      closeOverlay();
    }

    event.preventDefault();
    return;
  }

  /*
    Speech bubbles have second priority.
  */
  if (bubbleOverlay.style.display === "block") {
    if (
      key === "b" ||
      key === "escape" ||
      key === "e" ||
      key === "enter"
    ) {
      hideBubble();
      event.preventDefault();
      return;
    }
  }

  /*
    BINOCULAR MODE

    This must appear before normal player movement.
    Otherwise the arrow keys move Yoi and return before
    binocular movement gets a chance to run.
  */
  if (player.binocularMode) {
    if (
      key === "b" ||
      key === "escape" ||
      key === "e" ||
      key === "enter"
    ) {
      exitBinocularMode();
      event.preventDefault();
      return;
    }

    const binocularDirectionByKey = {
  arrowup: "up",
  arrowdown: "down",
  arrowleft: "left",
  arrowright: "right"
};

const direction = binocularDirectionByKey[key];

if (!direction) {
  event.preventDefault();
  return;
}

moveBinocularCamera(direction);

    event.preventDefault();
    return;
  }

  /*
  NORMAL MOVEMENT AND AIM MODE

  Arrow keys and the cardinal numpad keys move normally
  while Aim Mode is off.

  While Aim Mode is on, those same keys fire without
  moving Yoi.
*/
const cardinalDirectionByKey = {
  ArrowUp: "up",
  ArrowDown: "down",
  ArrowLeft: "left",
  ArrowRight: "right",

  Numpad8: "up",
  Numpad2: "down",
  Numpad4: "left",
  Numpad6: "right"
};

const cardinalDirection =
  cardinalDirectionByKey[code];

if (cardinalDirection) {
  if (worldState.aimMode) {
    fireEquippedWeapon(cardinalDirection);
  } else if (player.mode === "driving") {
    moveVehicle(cardinalDirection);
  } else {
    movePlayer(cardinalDirection);
  }

  event.preventDefault();
  return;
}

/*
  DIAGONAL NUMPAD INPUT

  While driving:
  - Aim Mode off: move the vehicle diagonally.
  - Aim Mode on: fire diagonally.

  While on foot:
  - Diagonal numpad keys continue firing diagonally.
  - Yoi's walking remains cardinal-only.
*/
const diagonalDirectionByKey = {
  Numpad7: "upLeft",
  Numpad9: "upRight",
  Numpad1: "downLeft",
  Numpad3: "downRight"
};

const diagonalDirection =
  diagonalDirectionByKey[code];

if (diagonalDirection) {
  if (
    player.mode === "driving" &&
    !worldState.aimMode
  ) {
    moveVehicle(diagonalDirection);
  } else {
    fireEquippedWeapon(diagonalDirection);
  }

  event.preventDefault();
  return;
}

/*
  Numpad 5 toggles Aim Mode.
*/
if (code === "Numpad5") {
  toggleAimMode();

  setMessage(
    worldState.aimMode
      ? "AIM MODE ON"
      : "AIM MODE OFF"
  );

  event.preventDefault();
  return;
}

  if (key === "e" || key === "enter") {
    interact();
    event.preventDefault();
    return;
  }

  if (key === "f") {
    fireEquippedWeapon();
    event.preventDefault();
    return;
  }

  if (key === "s") {
    deployLaserShield();
    event.preventDefault();
    return;
  }

  if (key === "i") {
    openInventory();
    event.preventDefault();
    return;
  }

  if (key === "m") {
    openAtlasInformation();
    event.preventDefault();
    return;
  }

  if (key === "t") {
  openThinkingMode();
  event.preventDefault();
  return;
}
});

/* =============================================================
   25. STARTUP
   ============================================================= */

function initializeGame() {
  worldState.currentMapId = player.mapId;
  worldState.lastBodyHeat = player.bodyHeat;

  drawGame();
  startWeatherSystem();
  showHereoStartupBriefing();

  /*
    UNRECOGNIZER I updated body heat every three seconds.
  */
  setInterval(updateBodyHeat, 3000);

/*
  Autonomous residents update once per second.
*/
setInterval(updateResidents, 1000);

/*
  The UNRECOGNIZER Watch checks once per second,
  but only displays a notification when its own
  repeat interval has elapsed.
*/
setInterval(updateUnrecognizerWatch, 1000);

  console.log("UNRECOGNIZER II atlas ready.");
  console.log("Outside atlas sectors:", Object.keys(ATLAS).length);
  console.log("Vehicle definitions:", Object.keys(VEHICLE_DEFINITIONS));
  console.log("Vehicles placed:", vehicles.map(vehicle => vehicle.id));
}

initializeGame();
